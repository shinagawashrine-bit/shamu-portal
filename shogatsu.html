<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<title>正月</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700&display=swap">
<style>
/* 社務ポータル「神社くん」の配色に合わせた業務画面。上に要約、下に表。表だけ横にスクロール */
:root {
  --bg: #f7f4f4; --card: #ffffff; --bg-2: #efe9ea; --line: #e2d8da;
  --text: #2a2224; --text-2: #5f5357; --text-3: #8e8185;
  --brand: #9c545b; --sat: #2f62b0; --brand-soft: #f3e3e5; --brand-ink: #ffffff;
  --rokuji: #6b3a63; --rokuji-soft: #efe2ec;
  --vet: #9c545b; --vet-soft: #f3e3e5;
  --mid: #9a6b12; --mid-soft: #f6ecd6;
  --new: #2f6f6a; --new-soft: #dcefec;
  --ok: #2f7d4a; --ok-soft: #e1f1e6; --warn: #a86a00; --warn-soft: #fbefd6; --ng: #b23a3a; --ng-soft: #f8e0e0;
  --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-disp: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171314; --card: #211b1d; --bg-2: #2b2326; --line: #3a3034;
  --text: #f1e9eb; --text-2: #c7b9bd; --text-3: #94858a;
  --brand: #d38a92; --sat: #8fb0ea; --brand-soft: #3b2629; --brand-ink: #1b1214;
  --rokuji: #d6a4cc; --rokuji-soft: #3a2537; --vet: #d38a92; --vet-soft: #3b2629;
  --mid: #e0b45a; --mid-soft: #3a2f1a; --new: #6cc1b8; --new-soft: #1c3533;
  --ok: #6cc58a; --ok-soft: #1d3324; --warn: #e6b04a; --warn-soft: #3a2e16; --ng: #ee8a8a; --ng-soft: #3d2121; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171314; --card: #211b1d; --bg-2: #2b2326; --line: #3a3034;
  --text: #f1e9eb; --text-2: #c7b9bd; --text-3: #94858a;
  --brand: #d38a92; --sat: #8fb0ea; --brand-soft: #3b2629; --brand-ink: #1b1214;
  --rokuji: #d6a4cc; --rokuji-soft: #3a2537; --vet: #d38a92; --vet-soft: #3b2629;
  --mid: #e0b45a; --mid-soft: #3a2f1a; --new: #6cc1b8; --new-soft: #1c3533;
  --ok: #6cc58a; --ok-soft: #1d3324; --warn: #e6b04a; --warn-soft: #3a2e16; --ng: #ee8a8a; --ng-soft: #3d2121; color-scheme: dark }
body { background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 14px; line-height: 1.6 }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) }
#view { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); min-width: 0 }
h1 { font-family: var(--f-disp); font-size: 26px; margin: 0; letter-spacing: .04em }
h2 { font-size: 16px; margin: 0 }
.head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline }
.sub { color: var(--text-3); font-size: 13px }
.demo { font-size: 12px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 2px 8px; font-weight: 700 }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs button { border: 0; background: none; font: inherit; font-size: 15px; font-weight: 700; color: var(--text-3); padding: 8px 14px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap }
.tabs button.on { color: var(--brand); border-bottom-color: var(--brand) }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0 }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.sp { flex: 1 }
.btn { font: inherit; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink) }
.btn:focus-visible, .tabs button:focus-visible, td.c:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.kpi .l { font-size: 12px; color: var(--text-3) }
.kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums }
.kpi .s { font-size: 12px; color: var(--text-2) }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 5px; font-size: 11px; font-weight: 700 }
.r-rokuji { background: var(--rokuji-soft); color: var(--rokuji) } .r-vet { background: var(--vet-soft); color: var(--vet) }
.r-mid { background: var(--mid-soft); color: var(--mid) } .r-new { background: var(--new-soft); color: var(--new) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); align-items: center }
.legend span { display: inline-flex; gap: 5px; align-items: center }
.scroll { overflow-x: auto; max-width: 100% }
table.g { border-collapse: separate; border-spacing: 0; font-size: 12px; font-variant-numeric: tabular-nums }
table.g th, table.g td { border-bottom: 1px solid var(--line); padding: 4px 3px; text-align: center; white-space: nowrap }
table.g th.name, table.g td.name { position: sticky; left: 0; background: var(--card); text-align: left; padding-right: 10px; z-index: 1; min-width: 132px }
table.g thead th { color: var(--text-2); font-weight: 500 }
table.g .dh { min-width: 46px; line-height: 1.25 }
.sun, .hol { color: var(--ng) } .sat { color: var(--sat) }
.dh.sun { color: var(--ng); font-weight: 700 } .dh.sat { color: var(--sat); font-weight: 700 }
.kind { font-size: 10px; color: var(--text-3) }
.need { display: inline-flex; align-items: center; gap: 2px }
.need button { border: 0; background: var(--bg-2); color: var(--text-2); width: 16px; height: 16px; border-radius: 4px; font-size: 11px; line-height: 1; cursor: pointer; padding: 0 }
.src { font-size: 9px; color: var(--brand); display: block }
.chk { font-size: 11px; font-weight: 700 }
.chk.good { color: var(--ok) } .chk.bad { color: var(--ng) }
td.c { cursor: pointer; width: 46px; height: 28px }
td.c .m { display: inline-flex; width: 26px; height: 22px; align-items: center; justify-content: center; border-radius: 5px; font-weight: 700 }
.m.as { background: var(--brand); color: var(--brand-ink) }
.m.as.ngas { background: var(--ng); color: #fff }
.m.ok { color: var(--ok) } .m.ng { color: var(--ng) } .m.no { color: var(--text-3) }
tr.grp td { background: var(--bg-2); font-weight: 700; color: var(--text-2); text-align: left; font-size: 12px }
tr.grp td.name { background: var(--bg-2) }
.warnlist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none }
.warnlist li { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-size: 13px }
.goodnote { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 6px 10px; font-size: 13px }
.note { font-size: 12px; color: var(--text-3) }
.tag { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 5px; padding: 0 6px; background: var(--bg-2); color: var(--text-2) }
.tag.kari { background: var(--warn-soft); color: var(--warn) }
.size { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; background: var(--brand-soft); color: var(--brand) }
.size.none { background: var(--bg-2); color: var(--text-3) }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; vertical-align: top }
table.t th { color: var(--text-3); font-weight: 500; font-size: 12px; white-space: nowrap }
table.t td.n { text-align: right; white-space: nowrap }
.short { color: var(--ng); font-weight: 700 }
.chips { display: flex; flex-wrap: wrap; gap: 4px }
.chip { font-size: 12px; background: var(--bg-2); border-radius: 5px; padding: 0 6px }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.f { display: grid; gap: 4px }
.f label { font-size: 12px; color: var(--text-3) }
.in { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 8px; padding: 6px 9px; width: 100%; min-width: 0; box-sizing: border-box }
.in.s { width: 72px }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 10px }
.fields > .f, .dlg > .f { min-width: 0 }
.fields .in { height: 34px }
.rules { display: grid; gap: 10px }
.rules-wrap { display: grid; gap: 16px; max-width: 880px }
.rules h3 { font-size: 13px; color: var(--text-3); margin: 6px 0 0; letter-spacing: .04em }
.rule { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px }
.rule > :first-child { flex: 1 1 300px; min-width: 0 }
.rule > :last-child:not(:first-child) { flex: 0 0 auto; margin-left: auto }
.rule:last-child { border-bottom: 0; padding-bottom: 0 }
.rule .val { font-weight: 700; white-space: nowrap; color: var(--text) }
.rule .val:empty { display: none }
.rule .row { flex-wrap: nowrap; white-space: nowrap }
.rule .d { font-size: 12px; color: var(--text-3) }
.overlay { position: fixed; inset: 0; background: rgba(20, 12, 14, .45); display: grid; place-items: center; z-index: 20; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.dlg { background: var(--card); border-radius: 14px; width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 18px; display: grid; gap: 12px }
textarea.in { min-height: 140px; font-size: 13px }
.pairs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px }
.pair { border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 4px; background: var(--bg) }
.pair.bad { border-color: var(--ng); background: var(--ng-soft) }
.pn { font-size: 12px; color: var(--text-3); font-weight: 700 }
.pm { font: inherit; text-align: left; border: 1px solid transparent; background: var(--card); color: var(--text); border-radius: 7px; padding: 4px 6px; cursor: pointer; display: flex; gap: 6px; align-items: center }
.pm.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft) }
.tag.ngt { background: var(--ng-soft); color: var(--ng) }
.friends { display: flex; flex-wrap: wrap; gap: 4px 12px; max-height: 120px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 13px }
.friends label { display: inline-flex; gap: 4px; align-items: center; color: var(--text) }
.dbtn { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; padding: 0; line-height: 1.25 }
.dbtn:hover { text-decoration: underline; text-underline-offset: 3px }
.dchips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px }
.dchip { font: inherit; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 4px 9px; cursor: pointer; white-space: nowrap; display: grid; text-align: center; line-height: 1.2 }
.dchip small { font-size: 10px; font-weight: 500 }
.dchip.sun { color: var(--ng) } .dchip.sat { color: var(--sat) }
.dchip.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink) }
table.tl { border-collapse: separate; border-spacing: 0; font-size: 12px; width: 100% }
table.tl th, table.tl td { border-bottom: 1px solid var(--line); padding: 3px 1px; text-align: center; white-space: nowrap }
table.tl th.hr { text-align: left; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 38px }
table.tl td.pname { position: sticky; left: 0; z-index: 1; background: var(--card); text-align: left; padding: 4px 8px 4px 0; min-width: 150px }
table.tl td.slot { cursor: pointer; padding: 3px 0 }
.pl { display: flex; align-items: center; justify-content: center; height: 30px; font-size: 11px; font-weight: 700 }
.pl.s { border-top-left-radius: 6px; border-bottom-left-radius: 6px }
.pl.e { border-top-right-radius: 6px; border-bottom-right-radius: 6px; margin-right: 2px }
.pl.p0 { background: var(--brand-soft); color: var(--brand) } .pl.p1 { background: var(--new-soft); color: var(--new) }
.pl.p2 { background: var(--mid-soft); color: var(--mid) } .pl.p3 { background: var(--rokuji-soft); color: var(--rokuji) }
.pl.rest { background: var(--bg-2); color: var(--text-3) }
.pname .pm { padding: 2px 5px; font-size: 13px }
.pname .pn { margin-bottom: 2px }
.sheetwrap { overflow-x: auto; max-width: 100% }
.sheet { min-width: 960px; aspect-ratio: 297 / 210; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 18px 22px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; box-shadow: 0 2px 8px rgba(42, 34, 36, .08) }
.sh-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid var(--brand); padding-bottom: 6px }
.sh-title { font-family: var(--f-disp); font-size: 30px; font-weight: 700; letter-spacing: .08em; line-height: 1.2 }
.yearsel { width: auto; font-weight: 700 }
.sh-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px }
.sh-date { font-size: 15px; font-weight: 700 }
.sh-dbig, .sh-dbig.sun, .sh-dbig.sat { font-family: var(--f-disp); font-size: 30px; font-weight: 700; letter-spacing: .04em; line-height: 1.2; color: var(--text) }   /* 日付は黒（2026-11-11 本人） */
.sh-lunch { display: flex; align-items: baseline; gap: 8px; padding: 4px 12px; border: 1.5px solid var(--brand); border-radius: 8px; white-space: nowrap; max-width: 46%; overflow: hidden }
.sh-lunch-l { font-size: 13px; font-weight: 700; color: var(--brand) } .sh-lunch b { font-size: 20px; overflow: hidden; text-overflow: ellipsis } .sh-lunch-v { font-size: 13px; color: var(--text-2) }
.sh-meta { text-align: right; font-size: 13px; color: var(--text-2); line-height: 1.5 }
.sh-grid { display: grid; grid-template-columns: 48px repeat(var(--np), minmax(0, 1fr)); grid-template-rows: auto repeat(var(--ns), minmax(0, 1fr)); column-gap: 6px; min-height: 0 }
.sh-h { padding: 2px 4px 6px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; align-content: end }
.sh-h .pm { font-size: 13px; padding: 1px 4px; background: transparent }
.sh-h .sz { font-size: 10px; color: var(--text-3); font-weight: 700 }
.sh-time { font-size: 11px; color: var(--text-3); text-align: right; padding: 1px 6px 0 0; font-variant-numeric: tabular-nums; line-height: 1; border-top: 1px solid transparent }
.sh-time.hr { color: var(--text); font-weight: 700; border-top-color: var(--line) }
.sh-c { font: inherit; border: 0; margin: 0; padding: 3px 8px 0; text-align: left; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: flex-start; min-height: 0; overflow: hidden }
.sh-c.s { border-top-left-radius: 6px; border-top-right-radius: 6px; margin-top: 2px }
.sh-c.e { border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; margin-bottom: 2px }
.sh-c.p0 { background: var(--brand-soft); color: var(--brand) } .sh-c.p1 { background: var(--new-soft); color: var(--new) }
.sh-c.p2 { background: var(--mid-soft); color: var(--mid) } .sh-c.p3 { background: var(--rokuji-soft); color: var(--rokuji) }
.sh-c.rest { background: var(--bg-2); color: var(--text-3) }
.sh-c.none { background: transparent; box-shadow: none !important }
.sh-c:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px }
.sh-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); align-items: center }
.sh-foot .key { display: inline-flex; align-items: center; gap: 5px }
.sh-foot .key i { width: 16px; height: 12px; border-radius: 3px; display: inline-block }
.btn:disabled { opacity: .5; cursor: not-allowed }
.sh-grid { grid-template-rows: auto auto repeat(var(--ns), minmax(0, 1fr)); column-gap: 3px }
.sh-ph { font-size: 12px; font-weight: 700; color: var(--text-2); border-bottom: 2px solid var(--brand-soft); padding: 0 4px 2px; align-self: end }
.sh-cnth { text-align: center; font-size: 10px; padding: 0 }
.sh-h { padding: 3px 1px 4px; align-content: start; min-width: 0 }
.sh-h .pm { font-size: 12px; padding: 1px 2px; gap: 4px; white-space: nowrap; overflow: hidden; max-width: 100% }
.sh-sub { display: flex; gap: 4px; font-size: 10px; padding-left: 2px; min-height: 13px }
.sh-sub .sz { margin-left: 0 }
.kgm { color: var(--new); font-weight: 700 }
.sh-grid .sh-c { font-size: 12px; padding: 0; line-height: 1.15; position: relative; overflow: visible }
.sh-grid .sh-c .lb { position: absolute; left: 6px; top: 3px; z-index: 2; white-space: nowrap; pointer-events: none }
.sh-grid .sh-c.s { margin-top: 1px } .sh-grid .sh-c.e { margin-bottom: 1px }
/* 10分ごとの境目に細い線が出ないよう、同じ色で1px重ねる */
.sh-grid .sh-c.p0:not(.e) { box-shadow: 0 1px 0 var(--brand-soft) } .sh-grid .sh-c.p1:not(.e) { box-shadow: 0 1px 0 var(--new-soft) }
.sh-grid .sh-c.p2:not(.e) { box-shadow: 0 1px 0 var(--mid-soft) } .sh-grid .sh-c.p3:not(.e) { box-shadow: 0 1px 0 var(--rokuji-soft) }
.sh-grid .sh-c.rest:not(.e) { box-shadow: 0 1px 0 var(--bg-2) }
.sh-time { font-size: 11px }
.sh-time.rt { text-align: left; padding: 1px 0 0 6px }
.sh-time.q, .sh-cnt.q { border-top: 1px dotted var(--line) }
.sh-cnt { font-size: 10px; text-align: center; color: var(--text-2); font-variant-numeric: tabular-nums; border-top: 1px solid transparent; line-height: 1.1 }
.sh-cnt.hr { border-top-color: var(--line) }
.sh-cnt.short { background: var(--ng-soft); color: var(--ng); font-weight: 700 }
.sh-cnt.lunch { background: var(--warn-soft); color: var(--warn); font-weight: 700 }
.kgt { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text-2); border-radius: 999px; padding: 2px 10px; cursor: pointer }
.kgt.on { background: var(--new-soft); border-color: var(--new); color: var(--new); font-weight: 700 }
@page { size: A4 landscape; margin: 8mm }
@media print {
  body { background: #fff !important }
  .head, .tabs, .noprint, #dlg { display: none !important }
  .wrap, #view { padding: 0 !important; max-width: none !important; gap: 0 !important; display: block !important }
  #view > .card { border: 0 !important; padding: 0 !important; background: none !important }
  .sheetwrap { overflow: visible }
  .sheet { --card: #fff; --text: #2a2224; --text-2: #5f5357; --text-3: #8e8185; --line: #d9cfd1; --bg-2: #efe9ea; --brand: #9c545b; --brand-soft: #f3e3e5; --new: #2f6f6a; --new-soft: #dcefec; --mid: #9a6b12; --mid-soft: #f6ecd6; --rokuji: #6b3a63; --rokuji-soft: #efe2ec; --vet: #9c545b; --vet-soft: #f3e3e5; --ng: #b23a3a; --ng-soft: #f8e0e0; --warn: #a86a00; --warn-soft: #fbefd6; --sat: #2f62b0;
    min-width: 0; width: 281mm; height: 194mm; aspect-ratio: auto; border: 0; border-radius: 0; padding: 0; box-shadow: none; background: #fff; color: var(--text); -webkit-print-color-adjust: exact; print-color-adjust: exact; break-inside: avoid }
  .sh-h .pm { border: 0; padding: 0 }
}
.delday { display: block; margin: 2px auto 0; border: 0; background: none; color: var(--text-3); font-size: 12px; cursor: pointer; line-height: 1 }
.delday:hover { color: var(--ng) }
.pdfdlg { width: min(1180px, 100%) }
.ss-prev { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 8px }
.ss-prev > .ss, .ss-prev > .pdfsheet { position: absolute; left: 0; top: 0; transform-origin: 0 0 }
.seg { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 4px 0 2px }
.seg label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer }

  if (ids.length < need) out.push(`${need - ids.length}人足りません`);
  ms.forEach((a, i) => ms.slice(i + 1).forEach(b => { if ((a.ng || []).includes(b.id) || (b.ng || []).includes(a.id)) out.push(`${a.name}さんと${b.name}さんはNG（同じ日に入っています）`); }));
  if (ids.length > need) out.push(`${ids.length - need}人多く入っています`);
  if (need && !rk.includes('rokuji')) out.push('録事がいません');
  const t = mixTarget(need), vet = rk.filter(r => r === 'rokuji' || r === 'vet').length;
  if (need && vet < t.vet) out.push(`ベテラン以上が${vet}人（目安${t.vet}人）`);
  const nw = rk.filter(r => r === 'new').length;
  if (need && nw > t.newMax) out.push(`新人が${nw}人（目安${t.newMax}人まで）`);
  const nn = pairsOf(d.k).filter(g => g.every(id => rankOf(byId(id)) === 'new')).length;
  if (nn) out.push(`新人だけの組が${nn}組`);
  const kn = Number(S.rules.haichi.kiganN) || 2, kc = ms.filter(canKigan).length;
  if (d.kind === 'shigoto' && ids.length && uketsukeOf(d.k).length < 2) out.push('祈願受付ができる人（録事・ベテラン）が別々の組に2人いません');
  if (d.kind === 'sanga' && ids.length && kc < kn) out.push(`祈願巫女が${kc}人（${kn}人必要）`);
  ms.forEach(m => { if (S.avail[m.id]?.[d.k] !== 'ok') out.push(`${m.name}さんは希望が○ではありません`); });
  return out;
}

/* ---- 下書き：録事 → ベテラン → 残り（出勤日数が少ない人から。新人は上限まで） ---- */
function draft() {
  markMade('miko');
  S.assign = {};
  const cnt = {}; S.members.forEach(m => cnt[m.id] = 0);
  const can = (m, d) => S.avail[m.id]?.[d.k] === 'ok';
  const order = DAYS.map(d => ({ d, need: needOf(d).n, pool: S.members.filter(m => can(m, d)).length })).filter(x => x.need > 0).sort((a, b) => a.pool / a.need - b.pool / b.need);
  order.forEach(({ d, need }) => {
    const pick = [], cand = S.members.filter(m => can(m, d));
    // 出勤日数が少ない人を優先。同じなら、友達がもう入っている人を優先
    const sc = m => cnt[m.id] - (pick.some(p => (m.friends || []).includes(p.id)) ? 0.5 : 0);
    const take = f => { const c = cand.filter(m => !pick.includes(m) && !pick.some(p => (m.ng || []).includes(p.id) || (p.ng || []).includes(m.id)) && f(m)).sort((a, b) => sc(a) - sc(b) || ORDER.indexOf(rankOf(a)) - ORDER.indexOf(rankOf(b))); if (c[0]) pick.push(c[0]); return !!c[0]; };
    take(m => rankOf(m) === 'rokuji');
    if (d.kind === 'sanga') { const kn = Number(S.rules.haichi.kiganN) || 2; while (pick.length < need && pick.filter(canKigan).length < kn && take(canKigan)); }   // 祈願巫女
    const tg = mixTarget(need), vetNeed = tg.vet, newMax = tg.newMax;
    while (pick.filter(m => ['rokuji', 'vet'].includes(rankOf(m))).length < vetNeed && pick.length < need && take(m => rankOf(m) === 'vet'));
    // 新人は今年の割合の分まで入れる（新人にも経験を積ませる）。残りを中堅・ベテランで埋め、足りなければ誰でも
    while (pick.length < need && pick.filter(m => rankOf(m) === 'mid').length < tg.mid && take(m => rankOf(m) === 'mid'));
    while (pick.length < need && pick.filter(m => rankOf(m) === 'new').length < newMax && take(m => rankOf(m) === 'new'));
    while (pick.length < need && (take(m => rankOf(m) === 'mid' || rankOf(m) === 'vet') || take(() => true)));
    S.assign[d.k] = pick.map(m => m.id);
    pick.forEach(m => cnt[m.id]++);
  });
  S.pairs = {}; DAYS.forEach(d => makePairs(d.k));
}

/* 装束の番号（2026-11-11 本人）：「装束M①」のように何番を着るかまで。装束は使い回す。
   ただし前の日も入った人は、前の日と同じ番号をそのまま着る。それ以外の人は、前に着た番号が空いていればそれ、なければ空いている一番小さい番号。
   戻り値：{ 日付: { id: 番号 } } */
const circ = n => n >= 1 && n <= 20 ? String.fromCharCode(0x245F + n) : n ? `(${n})` : '';
function shozokuNos() {
  const out = {}, last = {}, lastDay = {};
  const prevDay = k => { const t = new Date(k + 'T00:00:00'); t.setDate(t.getDate() - 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; };
  DAYS.forEach(d => {
    const dk = d.k === 'eve' ? `${Y - 1}-12-31` : d.k;   // 大晦日の夜は12/31として数える
    const today = out[d.k] = {}, used = { S: new Set(), M: new Set(), L: new Set() }, y = prevDay(dk);
    const ms = assigned(d.k).map(byId).filter(m => m && sizeOf(m));
    const rank = m => lastDay[m.id] === y ? 0 : last[m.id] ? 1 : 2;   // 前の日も入った人 → 前に着た番号のある人 → 初めての人
    ms.sort((a, b) => rank(a) - rank(b) || ORDER.indexOf(rankOf(a)) - ORDER.indexOf(rankOf(b))).forEach(m => {

  const lateOf = {}; DAYS.forEach(d => { if (d.kind === 'shigoto') lateOf[d.k] = lateMembersOf(d.k); });
  const anyLate = Object.values(lateOf).some(a => a.length);

const loadScript = src => new Promise((ok, ng) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const t = document.createElement('script'); t.src = src; t.onload = ok; t.onerror = ng; document.head.appendChild(t); });
async function pdfLibs() {
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
}
/* pages：1ページずつ「画面に置く要素」を返す関数の配列。各要素はA4横（1123×794px）で描く */
async function savePdf(pages, filename, btn, msg, portrait) {
  btn.disabled = true; msg.textContent = 'PDFを作っています…';
  const host = document.createElement('div'); host.className = 'ss-host'; document.body.appendChild(host);
  try {
    await pdfLibs(); try { await document.fonts.ready; } catch (e) {}
    const ori = portrait ? 'portrait' : 'landscape', pdf = new window.jspdf.jsPDF({ orientation: ori, unit: 'mm', format: 'a4' });
    for (let i = 0; i < pages.length; i++) {
      host.innerHTML = ''; host.appendChild(pages[i]());
      if (pages.length > 1) msg.textContent = `PDFを作っています…（${i + 1}/${pages.length}）`;
      const cv = await html2canvas(host.firstElementChild, { scale: 2, backgroundColor: '#ffffff', logging: false });
      if (i) pdf.addPage('a4', ori);
      pdf.addImage(cv.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, portrait ? 210 : 297, portrait ? 297 : 210);
    }
    const blob = pdf.output('blob');
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); msg.textContent = 'PDFを保存しました。'; return; }
    await dl.save({ filename, data: blob });
    msg.textContent = 'PDFを保存しました。';
  } catch (e) {
    msg.textContent = e && e.code === 'declined' ? '保存をやめました。' : e && e.code === 'rate_limited' ? '少し待ってからもう一度押してください。' : 'PDFを作れませんでした。もう一度押してください。';
  } finally { host.remove(); btn.disabled = false; }
}
function makePdf(btn, msg) {

function gMark(id, k, on) { const a = (S.goAvail[id] || {})[k]; return on ? `<span class="m as ${a !== 'ok' ? 'ngas' : ''}">${gById(id).team === 'kitchen' ? '台' : '朱'}</span>` : a === 'ok' ? '<span class="m ok">○</span>' : a === 'ng' ? '<span class="m ng">×</span>' : '<span class="m no">・</span>'; }
function gSub(m) { return S.goSent[m.id] ? `<span class="kind">提出 ${sentLabel(S.goSent[m.id])}</span>` : '<span class="tag ngt">未提出</span>'; }
function vGoshuin() {
  const G = gTeam('goshuin'), K = gTeam('kitchen'), KD = kDays();
  const needRow = DAYS.map(d => `<td><span class="need"><button data-gadj="-1" data-k="${d.k}" aria-label="${d.label}の人数を減らす">−</button><b>${gNeed(d.k)}</b><button data-gadj="1" data-k="${d.k}" aria-label="${d.label}の人数を増やす">＋</button></span>${S.goNeed[d.k] != null ? '<span class="src">手直し</span>' : ''}</td>`).join('');
  const gotRow = DAYS.map(d => { const n = gNeed(d.k), a = gAs(d.k).length; return `<td><span class="chk ${!n && !a || !madeG() ? '' : a < n ? 'bad' : 'good'}">${n || a ? `${a}/${n}${!madeG() ? '' : a < n ? ' !' : ' ✓'}` : '—'}</span></td>`; }).join('');
  const gRows = G.map(m => `<tr><td class="name"><b>${esc(m.name)}</b> <span class="kind">${gDaysOf(m.id)}日</span><br>${gSub(m)}</td>${DAYS.map(d => `<td class="c" tabindex="0" data-gcell="${d.k}" data-id="${m.id}" title="${esc(m.name)} ${dayName(d)}">${gMark(m.id, d.k, gAs(d.k).includes(m.id))}</td>`).join('')}</tr>`).join('');
  const kWho = KD.map(d => { const m = gById(S.kitchen[d.k]); return `<td><span class="chk ${m ? 'good' : madeG() ? 'bad' : ''}">${m ? esc(m.name.split(' ')[0]) : madeG() ? '未定 !' : '—'}</span></td>`; }).join('');
  const kRows = K.map(m => `<tr><td class="name"><b>${esc(m.name)}</b> <span class="kind">${gDaysOf(m.id)}日</span><br>${gSub(m)}</td>${KD.map(d => `<td class="c" tabindex="0" data-kcell="${d.k}" data-id="${m.id}" title="${esc(m.name)} ${dayName(d)}">${gMark(m.id, d.k, S.kitchen[d.k] === m.id)}</td>`).join('')}</tr>`).join('');
  const list = t => gTeam(t).map(m => `<li><button class="linkish" data-gedit="${m.id}">${esc(m.name)}</button>${m.note ? `<span class="kind">${esc(m.note)}</span>` : ''}</li>`).join('') || '<li class="kind">まだいません</li>';
  return `<div class="card" style="display:grid;gap:12px">
    <div class="row"><h2>御朱印のシフト</h2><span class="sp"></span><button class="btn pri" id="gmk">${gSure ? 'もう一度押すと作り直します（手で直した分は消えます）' : 'シフトを作る'}</button></div>
    <div class="legend"><span><span class="m as" style="width:22px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px">朱</span>御朱印</span><span><span class="m ok">○</span>可</span><span><span class="m ng">×</span>不可</span><span><span class="m no">・</span>未</span></div>
    <div class="scroll"><table class="g"><thead><tr><th class="name">名前</th>${gHead(DAYS)}</tr></thead><tbody>
      <tr><td class="name"><b>必要人数</b></td>${needRow}</tr>
      <tr><td class="name"><b>割り当て</b></td>${gotRow}</tr>${gRows || `<tr><td class="name kind" colspan="${DAYS.length + 1}">御朱印の人を登録してください</td></tr>`}</tbody></table></div>
  </div>
  <div class="card" style="display:grid;gap:12px">
    <div class="row"><h2>台所担当のシフト</h2><span class="tag">毎日1人</span></div>
    <div class="legend"><span><span class="m as" style="width:22px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px">台</span>台所</span><span><span class="m ok">○</span>可</span><span><span class="m ng">×</span>不可</span><span><span class="m no">・</span>未</span></div>
    <div class="scroll"><table class="g"><thead><tr><th class="name">名前</th>${gHead(KD)}</tr></thead><tbody>
      <tr><td class="name"><b>担当</b></td>${kWho}</tr>${kRows || `<tr><td class="name kind" colspan="${KD.length + 1}">台所の人を登録してください</td></tr>`}</tbody></table></div>
  </div>
  <div class="card" style="display:grid;gap:12px">
    <div class="gteams">
      <div><div class="row"><h2>御朱印（${G.length}人）</h2><span class="sp"></span><button class="btn pri" data-gedit="" data-team="goshuin">＋ 登録</button></div><ul class="glist">${list('goshuin')}</ul></div>
      <div><div class="row"><h2>台所（${K.length}人）</h2><span class="sp"></span><button class="btn pri" data-gedit="" data-team="kitchen">＋ 登録</button></div><ul class="glist">${list('kitchen')}</ul></div>

      <div class="urlrow"><a class="url" id="gurl-${t}" href="${G_URLS[t]}" target="_blank" rel="noopener">${G_URLS[t]}</a><button type="button" class="btn" data-gcopy="${t}">コピー</button></div></div>`).join('')}
  </div>`;
}

    S.goMembers = S.goMembers.filter(x => x.id !== m.id); Object.keys(S.goAssign).forEach(k => S.goAssign[k] = gAs(k).filter(x => x !== m.id));
    Object.keys(S.kitchen).forEach(k => { if (S.kitchen[k] === m.id) delete S.kitchen[k]; }); delete S.goAvail[m.id]; delete S.goSent[m.id]; save(); close(); render(); };
  f.onsubmit = e => { e.preventDefault(); const name = document.getElementById('g-name').value.trim(); if (!name) return;
    const team = m.team, note = document.getElementById('g-note').value.trim();

    else { const n = { id: 'g' + Date.now(), name, team, note }; S.goMembers.push(n); S.goAvail[n.id] = {}; }
    save(); close(); render(); };
}

/* 御朱印・台所の人が自分のスマホで入れる画面（#goshuin）：名前 → シフトの希望 → 送信。あとから変更もできる */
let ginp = { step: 'name' };
const isGInput = () => location.hash === '#goshuin' || location.hash === '#daidokoro';
const gHashTeam = () => location.hash === '#daidokoro' ? 'kitchen' : 'goshuin';

    <button class="in-new" data-g-pick="new">名前がない（はじめての方）</button></section>`;
  if (ginp.step === 'info') return top + bar + `<form class="in-card" id="gnf"><h2>はじめての方</h2><p class="in-note">名前を入力してください。</p>

    <p class="in-msg" id="gi-msg"></p>

  const m = gById(ginp.id), days = daysFor(m), ans = ginp.ans, left = days.filter(d => !ans[d.k]).length;
  if (ginp.step === 'shift') return top + bar + `<section class="in-card"><h2>${esc(m.name)}さんのシフトの希望</h2>
      <p class="in-note">出られる日に「○」、出られない日に「×」を押してください。${S.goSent[m.id] ? `前回の送信：${sentLabel(S.goSent[m.id])}` : ''}</p>
      ${left ? '<button class="in-all" data-g-all>まだの日をすべて ○ にする</button>' : ''}
      <div class="in-days">${days.map(d => `<div class="in-day ${ans[d.k] ? '' : 'todo'}"><div class="in-d"><b class="${dayCls(d)}">${d.label}<small>（${d.sub}）</small></b><span>${d.kind === 'eve' ? '大晦日の夜 24:00〜3:00' : d.hol || kindShort[d.kind]}</span></div>
        <div class="in-yn"><button class="${ans[d.k] === 'ok' ? 'on ok' : ''}" data-g-ans="${d.k},ok" aria-pressed="${ans[d.k] === 'ok'}">○</button><button class="${ans[d.k] === 'ng' ? 'on ng' : ''}" data-g-ans="${d.k},ng" aria-pressed="${ans[d.k] === 'ng'}">×</button></div></div>`).join('')}</div>
      <button class="in-new" data-g-go="name">名前を選び直す</button></section>
    <div class="in-send"><span>${left ? `あと${left}日` : `○ ${days.filter(d => ans[d.k] === 'ok').length}日`}</span><button class="in-btn pri" data-g-send ${left ? 'disabled' : ''}>${S.goSent[m.id] ? '変更して送信' : '送信'}</button></div>`;
  const okDays = days.filter(d => gOk(m.id, d.k));
  return top + bar + `<section class="in-card in-done"><div class="in-check">✓</div><h2>送信しました</h2><p class="in-note">${esc(m.name)}さん、ありがとうございます。シフトが決まったらお知らせします。</p>
    <div class="in-sum"><b>出られる日（${okDays.length}日）</b><div>${okDays.map(d => `<span>${d.label}（${d.kind === 'eve' ? '夜' : d.sub}）</span>`).join('') || 'なし'}</div></div>
    <div class="in-btns"><button class="in-btn" data-g-go="shift">希望を変更する</button></div>
    <button class="in-new" data-g-go="name">最初の画面に戻る</button></section>`;
}
function gGoShift(id) { const a = S.goAvail[id] || {}, m = gById(id); ginp = { step: 'shift', id, ans: Object.fromEntries(daysFor(m).filter(d => a[d.k]).map(d => [d.k, a[d.k]])) }; }
document.addEventListener('click', e => {
  if (!isGInput()) return;
  const t = e.target.closest('[data-g-pick],[data-g-go],[data-g-ans],[data-g-all],[data-g-send]'); if (!t) return;
  if (t.dataset.gPick) { if (t.dataset.gPick === 'new') ginp = { step: 'info' }; else gGoShift(t.dataset.gPick); window.scrollTo(0, 0); }
  else if (t.dataset.gGo) { if (t.dataset.gGo === 'shift') gGoShift(ginp.id); else ginp = { step: 'name' }; window.scrollTo(0, 0); }
  else if (t.dataset.gAns) { const [k, v] = t.dataset.gAns.split(','); ginp.ans[k] = v; }
  else if ('gAll' in t.dataset) daysFor(gById(ginp.id)).forEach(d => { if (!ginp.ans[d.k]) ginp.ans[d.k] = 'ok'; });
  else if ('gSend' in t.dataset) { const a = S.goAvail[ginp.id] = S.goAvail[ginp.id] || {}; Object.assign(a, ginp.ans); S.goSent[ginp.id] = Date.now(); save(); ginp.step = 'done'; window.scrollTo(0, 0); }
  render();
});
document.addEventListener('submit', e => { if (e.target.id !== 'gnf') return; e.preventDefault();
  const name = document.getElementById('gi-name').value.trim(); if (!name) { document.getElementById('gi-msg').textContent = '名前を入れてください。'; return; }
  const n = { id: 'g' + Date.now(), name, team: gHashTeam(), note: '' };
  S.goMembers.push(n); S.goAvail[n.id] = {}; save(); gGoShift(n.id); render(); window.scrollTo(0, 0); });

/* ===== 食事（お弁当・夕食。2026-11-11 本人）=====
   お昼：その日に出ている全員（神職は神社くんの休み申告から、巫女・御朱印・台所はシフトから）。
   夕食：希望者だけ。その日に確かめて「あり」にする。小泉家（宮司・真奈美）は最初から「あり」。業者は毎日ちがう */
const SHINSHOKU = ['宮司', '勝史', '鈴木', '今井'];
const KOIZUMI = ['宮司', '真奈美'];   // 小泉家（宮司家）。勝史は別に住んでいるので神職として扱う（2026-11-11 本人）
let mealK = null;
function mealPeople(k) {
  const off = (S.leaves || {})[k] || [], tom = S.tomari || [], stay = mealOf(k).stay || {}, out = [];
  SHINSHOKU.forEach(n => out.push({ key: 's:' + n, name: n, grp: '神職', off: off.includes(n), tomari: tom.includes(n), family: tom.includes(n) }));
  tom.filter(n => !SHINSHOKU.includes(n)).forEach(n => out.push({ key: 't:' + n, name: n, grp: '台所', tomari: true, family: true }));   // 真奈美は台所（2026-11-11 本人）
  ((S.homeTemp || {})[k] || []).forEach(n => out.push({ key: 'x:' + n, name: n, grp: '臨時神職' }));   // ホームで出勤を登録した臨時職員は、神職の下に自動で（2026-11-11 本人）
  ORDER.flatMap(r => assigned(k).map(byId).filter(m => m && rankOf(m) === r)).forEach(m => out.push({ key: 'm:' + m.id, name: m.name, grp: '巫女' }));
  gAs(k).map(gById).filter(Boolean).forEach(m => out.push({ key: 'g:' + m.id, name: m.name, grp: '御朱印', canStay: true, tomari: !!stay[m.id] }));   // 泊まりは御朱印の人と宮司一家だけ
  const kc = gById(S.kitchen[k]); if (kc) out.push({ key: 'g:' + kc.id, name: kc.name, grp: '台所' });
  return out;
}
const MEAL0 = () => ({ lunchOff: {}, dinner: {}, extraL: 0, extraD: 0, stay: {}, order: {} });
const HOW = { yoyaku: '予約済み', kaini: '当日買いに行く', nashi: 'なし' };
const isNo = h => h === 'nashi';   // 夕食を頼まない日（夕食だけ選べる。2026-11-11 本人）
const howOpts = m => Object.entries(HOW).filter(([v]) => m === 'D' || !isNo(v));
const MEALS = { L: 'お昼', D: '夕食' };
const ordOf = (k, m) => { const o = { vendor: '', menu: '', place: '', how: '', ...((mealOf(k).order || {})[m] || {}) }; if (o.how === 'gaishoku' || o.how === 'jisui') o.how = 'nashi'; return o; };   // 版62の2択は「なし」へ
const ordW = (k, m) => { const M = mealW(k); M.order = M.order || {}; return (M.order[m] = M.order[m] || {}); };
/* 手配書の内訳（2026-11-11 本人）：お昼は神職・巫女・御朱印・台所。夕食は小泉家（宮司家）と御朱印、三が日などはほかに神職・巫女・台所も */
const BREAK = { L: ['神職', '臨時神職', '巫女', '御朱印', '台所'], D: ['小泉家', '御朱印', '神職', '臨時神職', '巫女', '台所'] };
function mealBreak(k, m) {   // 内訳（担当ごとの数）
  const ps = mealPeople(k).filter(p => m === 'L' ? lunchOn(k, p) : dinnerOn(k, p)), out = [], cat = p => m === 'D' && p.family ? '小泉家' : p.grp;
  BREAK[m].forEach(g => { const n = ps.filter(p => cat(p) === g).length; if (n) out.push(`${g} ${n}`); });
  const x = Number(mealOf(k)[m === 'L' ? 'extraL' : 'extraD']) || 0; if (x) out.push(`追加 ${x}`);
  return { list: out, names: ps.map(p => p.name) };
}
const mealOf = k => ({ ...MEAL0(), ...(S.meals[k] || {}) });
const mealW = k => (S.meals[k] = { ...MEAL0(), ...(S.meals[k] || {}) });
const lunchOn = (k, p) => !p.off && !mealOf(k).lunchOff[p.key];
/* 夕食の最初の設定（2026-11-11 本人）：三が日は全員あり。4日以降は宮司一家（泊まり）と、その日も次の日も御朱印に入っている人があり。あとは手で直す */
function dinnerDefault(k, p) {
  const d = DAYS.find(x => x.k === k);
  if (d && d.kind === 'sanga') return true;
  if (p.tomari) return true;
  if (p.grp === '御朱印') { const nx = key(addD(new Date(k + 'T00:00:00'), 1)); return gAs(nx).includes(p.key.slice(2)); }
  return false;
}
const dinnerOn = (k, p) => !p.off && (mealOf(k).dinner[p.key] ?? dinnerDefault(k, p));
function mealCount(k) { const ps = mealPeople(k), M = mealOf(k); return { L: ps.filter(p => lunchOn(k, p)).length + (Number(M.extraL) || 0), D: ps.filter(p => dinnerOn(k, p)).length + (Number(M.extraD) || 0) }; }
/* お弁当の手配表：お弁当担当が1枚で分かる（何を・どこで・何個・予約済みか当日買うか） */
function bentoHTML(k) {
  const d = DAYS.find(x => x.k === k), c = mealCount(k), dash = '<span class="bt-none">（未記入）</span>';
  const block = m => { const o = ordOf(k, m), n = m === 'L' ? c.L : c.D, b = mealBreak(k, m);
    if (!n) return `<section class="bt-b none"><div class="bt-h"><span class="bt-m">${MEALS[m]}</span><span class="bt-n">なし</span></div></section>`;
    const no = isNo(o.how), kv = [['お店', o.vendor], ['場所', o.place], ['お弁当', o.menu]];
    return `<section class="bt-b"><div class="bt-h"><span class="bt-m">${MEALS[m]}</span><span class="bt-n"><b>${n}</b>${no ? '人' : '個'}</span><span class="bt-how ${o.how || 'mi'}">${HOW[o.how] || '手配 未定'}</span></div>
      <table class="bt-kv">${kv.map(([l, v]) => `<tr><th>${l}</th><td>${no ? '—' : esc(v) || dash}</td></tr>`).join('')}</table>
      <div class="bt-sub"><b>内訳</b>　${b.list.join('・')}</div>
      ${m === 'D' ? `<div class="bt-sub"><b>夕食の人</b>　${b.names.map(esc).join('、')}</div>` : ''}</section>`; };
  return `<div class="bt"><div class="bt-top"><div><div class="bt-t">お弁当の手配</div><div class="bt-d">${wafuDate(d)}</div></div><div class="bt-s">品川神社</div></div>
    ${block('L')}${block('D')}
    <div class="bt-f"><span>担当：</span><span class="bt-line"></span><span class="sp"></span><span>${wafuToday()} 作成</span></div></div>`;
}
function bentoDlg() {
  const d = DAYS.find(x => x.k === mealK);
  document.getElementById('dlg').innerHTML = `<div class="overlay"><div class="dlg btdlg"><h2>お弁当の手配表</h2>
    <div class="ss-prev bt-prev" id="btprev">${bentoHTML(mealK)}</div>
    <div class="row"><span class="note" id="btmsg"></span><span class="sp"></span><button type="button" class="btn" id="cancel">閉じる</button><button type="button" class="btn pri" id="btgo">PDFで保存</button></div></div></div>`;

}
/* 予約のチェックシート：当日買いに行く分を除いて、業者ごとに日付・食事・内容・個数を並べる。□に印を付けながら予約する */
function yoyakuRows() {

document.addEventListener('keydown', e => { const c = e.target.closest?.('[data-cell]'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); c.click(); } });
document.addEventListener('change', e => { if (e.target.id === 'yearSel') switchYear(Number(e.target.value)); });
document.addEventListener('change', e => {
  const el = e.target, R = S.rules;
  if (el.closest('#mf')) return;
  if (el.dataset.need) R.need[el.dataset.need] = Number(el.value) || 0;
  else if (el.dataset.goneed) (R.goNeed = R.goNeed || {})[el.dataset.goneed] = Number(el.value) || 0;
  else if (el.dataset.stock) R.stock[el.dataset.stock] = el.value === '' ? '' : Number(el.value);
  else if (el.id === 'bookOn') R.bookOn = el.checked;
  else if (['perPerson', 'vetMin', 'newMax', 'sizeSM', 'sizeML'].includes(el.id)) R[el.id] = Number(el.value) || 0;
  else if (el.id === 'rokujiBy') R.rokujiBy = el.value;
  else if (el.name === 'mixMode') R.mixMode = el.value;
  else if (el.id.startsWith('h-')) { const f = el.id.slice(2); R.haichi[f] = el.type === 'checkbox' ? el.checked : el.type === 'time' ? el.value : Number(el.value) || 0; if (f === 'kiganN') S.kigan = {}; DAYS.forEach(d => makeTime(d.k)); }
  else if (el.id === 'groupSize') { R.groupSize = Number(el.value); S.kigan = {}; DAYS.forEach(d => makePairs(d.k)); }
  else if (el.id === 'groupSizeOther') { R.groupSizeOther = Number(el.value); DAYS.forEach(d => makePairs(d.k)); }
  else if (el.id === 'friendNew') { R.friendNew = el.checked; DAYS.forEach(d => makePairs(d.k)); }
  else return;
  save(); render();
});
/* ===== シフト登録URL（本番。神社くんの受け口に直接送る。2026-11-12）=====
   名前を選ぶ → その人の希望（○×）と基本情報を読む → 基本情報を確かめる（変わっていれば直す）→ 送信。
   本人確認はないが、基本情報は変わっているかもしれないので確かめさせる（2026-11-12 本人） */
const apiTeam = () => ({ '#nyuryoku': 'miko', '#goshuin': 'goshuin', '#daidokoro': 'kitchen' })[location.hash] || '';
const apiMine = new Set(), apiInfo = {};
async function sgApi(action, body) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, body)) });
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.message || j.error || 'エラー'); e.code = j.error; throw e; }
  return j;
}
const apiCard = h => `<section class="in-card">${h}</section>`;
function apiErr(er, near) {
  let m = document.getElementById('apiMsg');
  if (!m) { m = document.createElement('p'); m.id = 'apiMsg'; m.className = 'in-msg'; }
  const box = near && near.closest('.in-send, .in-card'); (box || document.getElementById('view')).prepend(m);
  m.textContent = er && er.code ? er.message : 'つながりませんでした。電波のよいところで、もう一度押してください。';
}
async function apiInit() {
  const team = apiTeam(), v = document.getElementById('view');
  document.body.classList.add('input-mode');
  inp = { step: 'name' }; ginp = { step: 'name' }; apiMine.clear();
  if (!team) { v.innerHTML = apiCard('<h2>正月</h2><p class="in-note">このページは神社くんの「正月」から開きます。シフトの希望は、神社から届いたURLから入れてください。</p>'); return; }
  v.innerHTML = apiCard('<p class="in-note">読み込んでいます…</p>');
  try {
    const r = await sgApi('sgForm', { team });
    if (apiTeam() !== team) return;   // 読み込み中にURLが変わった
    Y = Number(r.year) || Y;
    S = { rules: JSON.parse(JSON.stringify(DEFAULT_RULES)), members: [], goMembers: [], avail: {}, sent: {}, goAvail: {}, goSent: {}, extraDays: r.extraDays || [], assign: {}, adj: {}, pairs: {}, time: {}, kigan: {}, goAssign: {}, goNeed: {}, kitchen: {}, meals: {}, temps: {}, years: {} };
    (r.people || []).forEach(p => {
      if (team === 'miko') { S.members.push({ id: p.id, name: p.name, univ: '', height: '', tabi: '', friends: [], ng: [] }); S.avail[p.id] = {}; if (p.sent) S.sent[p.id] = p.sent; }
      else { S.goMembers.push({ id: p.id, name: p.name, team }); S.goAvail[p.id] = {}; if (p.sent) S.goSent[p.id] = p.sent; }
    });
    DAYS = buildDays(); render();
  } catch (e) { v.innerHTML = apiCard('<h2>読み込めませんでした</h2><p class="in-note">電波のよいところで、もう一度開いてください。</p><div class="in-btns"><button class="in-btn pri" id="apiRetry">もう一度</button></div>'); }
}
/* 巫女の基本情報：直した内容は送信のときにまとめて送る（受け口で置き換える）。はじめての人は仮の id「_new」 */
function apiSaveInfo(f) {
  const v = i => document.getElementById(i).value.trim(), msg = document.getElementById('i-msg');
  const isNew = !inp.id || inp.id === '_new', name = v('i-name');
  if (!name) { msg.textContent = '名前を入れてください。'; return; }
  const ng = [...f.querySelectorAll('input[name=i-ng]')].map(x => x.value).filter(x => !x.startsWith('_'));
  const fr = [...f.querySelectorAll('input[name=i-fr]')].map(x => x.value).filter(x => !ng.includes(x) && !x.startsWith('_'));
  const info = { univ: v('i-univ'), grade: v('i-grade'), age: v('i-age'), height: v('i-height'), tabi: v('i-tabi'), friends: fr, ng };
  let me = isNew ? null : byId(inp.id);
  if (isNew) { S.members = S.members.filter(x => x.id !== '_new'); me = { id: '_new', name, birth: '' }; S.members.push(me); S.avail._new = S.avail._new || {}; inp.id = '_new'; }
  if (String(age(me) ?? '') !== info.age) { me.birth = ''; me.ageAt = { age: info.age === '' ? '' : Number(info.age), year: Y }; }
  Object.assign(me, { univ: info.univ, grade: info.grade, school: info.grade === 'grad' ? 'grad' : 'student', height: Number(info.height) || '', tabi: Number(info.tabi) || '', friends: fr, ng });
  apiInfo[inp.id] = info;
  inGoShift(); render(); window.scrollTo(0, 0);
}
function apiNewG() {
  const name = document.getElementById('gi-name').value.trim();
  if (!name) { document.getElementById('gi-msg').textContent = '名前を入れてください。'; return; }
  S.goMembers = S.goMembers.filter(x => x.id !== '_new'); S.goMembers.push({ id: '_new', name, team: gHashTeam() }); S.goAvail._new = {};
  gGoShift('_new'); render(); window.scrollTo(0, 0);
}
async function apiSend(btn) {
  const team = apiTeam(), miko = team === 'miko', st = miko ? inp : ginp, id = st.id, list = miko ? S.members : S.goMembers, me = list.find(x => x.id === id);
  if (!me || btn.disabled) return;
  const label = btn.textContent; btn.disabled = true; btn.textContent = '送信しています…';
  const body = { team, days: st.ans };
  if (id === '_new') body.name = me.name; else body.id = id;
  if (miko && apiInfo[id]) body.info = apiInfo[id];
  try {
    const r = await sgApi('sgSubmit', body), nid = String(r.id);
    if (id === '_new') {   // 受け口が付けた id に置き換える（同じ名前の人がいたら、その人にまとめる）
      list.splice(list.indexOf(me), 1); if (!list.some(x => x.id === nid)) list.push(Object.assign(me, { id: nid }));
      [S.avail, S.sent, S.goAvail, S.goSent].forEach(o => delete o._new);
    }
    (miko ? S.avail : S.goAvail)[nid] = r.days || {}; (miko ? S.sent : S.goSent)[nid] = r.at; delete apiInfo[id]; apiMine.add(nid);
    st.id = nid; st.step = 'done'; render(); window.scrollTo(0, 0);
  } catch (er) { btn.disabled = false; btn.textContent = label; apiErr(er, btn); }
}
if (MODE === 'api') {
  document.addEventListener('click', async e => {
    if (e.target.closest('#apiRetry')) { apiInit(); return; }
    const pk = e.target.closest('[data-in-pick],[data-g-pick]');
    if (pk) {   // 名前を選んだ：その人の希望を先に読む
      const id = pk.dataset.inPick || pk.dataset.gPick, team = apiTeam();
      if (id === 'new' || id.startsWith('_') || apiMine.has(id)) return;
      e.stopImmediatePropagation(); if (pk.disabled) return; pk.disabled = true;
      try { const r = await sgApi('sgMine', { team, id }); (team === 'miko' ? S.avail : S.goAvail)[id] = r.days || {}; if (r.at) (team === 'miko' ? S.sent : S.goSent)[id] = r.at;
        if (team === 'miko' && r.info) { const m = byId(id); if (m) Object.assign(m, r.info, { ng: [], school: r.info.grade === 'grad' ? 'grad' : 'student' }); }   // 確かめてもらう基本情報（NG は受け口が返さない）
        apiMine.add(id); pk.disabled = false; pk.click(); }
      catch (er) { pk.disabled = false; apiErr(er); }
      return;
    }
    const sd = e.target.closest('[data-in-send],[data-g-send]');
    if (sd) { e.stopImmediatePropagation(); apiSend(sd); }
  }, true);
  document.addEventListener('submit', e => { if (e.target.id !== 'inf' && e.target.id !== 'gnf') return; e.preventDefault(); e.stopImmediatePropagation(); if (e.target.id === 'inf') apiSaveInfo(e.target); else apiNewG(); }, true);
}
if (MODE === 'api') {
  document.getElementById('demoTag').remove();
  apiInit();
} else if (MODE === 'host') {
  try { const y = Number(localStorage.getItem('sg-year')); if (y > 2000) Y = y; } catch (e) {}
  if (!PROD && !Object.keys(HOST.rows()).length) { S = seedState(); DAYS = buildDays(); draft(); gDraft(); S.tomari = KOIZUMI.slice(); baseRows = {}; hostPut(); }   // 神社くんのデモ：見本を入れる
  hostLoad();
  if (PROD) document.getElementById('demoTag').remove();
  const th = HOST.theme(); if (th) document.documentElement.setAttribute('data-theme', th);
  ['click', 'input', 'keydown'].forEach(ev => document.addEventListener(ev, () => HOST.touch(), true));
} else {
try { S = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { S = null; }
if (!S || !S.members) { S = seedState(); draft(); gDraft(); }
if (!S.goMembers) { seedG(S); gDraft(); }
S.tomari = KOIZUMI.slice();   // 登録欄はなし（2026-11-11 本人）
S.temps = S.temps || {}; if (!S.homeTemp) S.homeTemp = sampleHomeTemp();
Object.values(S.meals || {}).forEach(M => { if (M.vendor && !(M.order && M.order.L)) { M.order = M.order || {}; M.order.L = { vendor: M.vendor }; } delete M.vendor; });
S.time = S.time || {};
if (S.year) Y = S.year; else S.year = Y;
}
if (MODE !== 'api') { DAYS = buildDays(); DAYS.filter(d => !S.pairs[d.k] && assigned(d.k).length).forEach(d => makePairs(d.k)); render(); }
</script>
