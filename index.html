body{margin:0;background:var(--bg-2);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.small{font-size:12px}
.sp{flex:1}

/* ── layout ── */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:18px 12px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand span{display:block;font-size:11px;color:var(--text-2)}
.cal-bar.cal-bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.cal-l{min-width:0}.cal-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.cal-title{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:4px 8px;margin-left:-8px;border-radius:10px;color:inherit;cursor:pointer}
.cal-title:hover{background:var(--fill)}.cal-title .caret{font-size:13px;color:var(--text-2)}
.cal-nav{display:inline-flex;gap:8px;align-items:center;justify-self:center}
.cal-nav .btn{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:15px;min-height:42px;padding:0 16px;border-radius:12px}
.cal-nav .btn svg{width:18px;height:18px}
.cal-title h2{white-space:nowrap}
@media (max-width:900px){.cal-bar.cal-bar{grid-template-columns:auto minmax(0,1fr)}.cal-r{gap:6px}.cal-nav{grid-column:1/-1;grid-row:2;width:100%;justify-content:center}.cal-nav .btn{flex:1;justify-content:center;max-width:140px}}
.ym-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ym-cell{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:4px;min-height:96px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;cursor:pointer}
.ym-cell:hover{border-color:var(--brand)}.ym-cell.cur{border:2px solid var(--brand);background:var(--brand-soft)}
.ym-m{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}.ym-m i{font-style:normal;font-size:10px;font-weight:700;color:var(--brand-ink);background:var(--brand);border-radius:99px;padding:1px 6px}
.ym-cell ul{list-style:none;margin:0;padding:0;font-size:11.5px;line-height:1.5;color:var(--text-2)}.ym-cell li b{display:inline-block;min-width:18px;color:var(--shu);font-weight:700}
@media (max-width:600px){.ym-grid{grid-template-columns:repeat(3,1fr)}.ym-cell{min-height:80px;padding:8px}}
.reji{min-height:100vh;background:var(--bg-2);display:flex;flex-direction:column}
.reji-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--hair)}
.reji-h .mark{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:inline-grid;place-items:center;font-weight:700;font-size:14px}
.reji-b{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px 16px;align-items:start}
.reji-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));grid-auto-rows:96px;gap:10px}
.reji-item{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.reji-item:active{transform:scale(.98)}.reji-item.in{border:2px solid var(--brand);background:var(--brand-soft)}
.reji-item.big{grid-column:span 2;grid-row:span 2}.reji-item.big .nm{font-size:24px}.reji-item.big .pr{font-size:18px}
.reji-item .nm{font-weight:700;font-size:16px;line-height:1.3}.reji-item .pr{font-size:14px;color:var(--text-2)}
.reji-item .q{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:14px;display:grid;place-items:center;padding:0 6px}
.reji-cart{position:sticky;top:14px;padding:14px;display:flex;flex-direction:column}
.reji-lines{max-height:46vh;overflow:auto;margin-bottom:10px}
.reji-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair)}
.reji-qb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;color:inherit;touch-action:manipulation}
.reji-total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 2px;border-top:2px solid var(--text);margin-top:4px}
.reji-total b{font-size:30px}.reji-total small{font-size:15px;margin-left:2px}
.reji-go{width:100%;min-height:56px;font-size:18px;border-radius:14px}
@media (max-width:760px){.reji-b{grid-template-columns:1fr}.reji-cart{position:static}.reji-items{grid-template-columns:repeat(2,1fr)}}
.btn.act-btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;font-size:15px;font-weight:700;padding:0 14px;border-radius:10px;line-height:1.2;text-decoration:none;white-space:nowrap}
.day-acts{gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:900px){
  /* スマホ：見出しと月・週／予定を追加と休みを申告を同じ幅で並べる／月の移動 */
  .cal-bar.cal-bar{grid-template-columns:1fr 1fr;row-gap:8px}
  .cal-r{display:contents}
  .cal-l{grid-column:1;grid-row:1}
  .cal-r .seg{grid-column:2;grid-row:1;justify-self:end}
  .cal-r > .add-ev{grid-column:1;grid-row:2;width:100%;align-self:start}
  .cal-r > .leave-box{grid-column:2;grid-row:2;align-items:stretch;align-self:start}
  .cal-r > .leave-box .btn{width:100%}
  .cal-r > .leave-box .leave-left{position:static;text-align:right;margin-top:4px}
  .cal-nav{grid-row:3 !important}
  .row.day-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;flex:1 1 100%}
  .day-acts > .btn{width:100%;padding:0 14px}
  .day-acts > .add-ev{grid-column:1/-1}
}.btn.add-ev{border-color:var(--brand);color:var(--brand)}
.ev.one{white-space:nowrap;text-overflow:ellipsis;padding-top:0;padding-bottom:0}.ev.one b,.ev.one > span:not(.ev-ic),.ev.one .ev-tx span{display:inline;margin-right:6px}
.wareki-field{display:inline-flex;min-width:0}
.wareki-heading{font-size:18px;font-weight:700}
.wareki-dialog{width:min(400px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);color:var(--text);margin:auto}
.wareki-dialog::backdrop{background:rgba(0,0,0,.35)}
.wareki-nav,.wareki-footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wareki-footer{justify-content:flex-end}
.wareki-options{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:12px 0;text-align:center}
.wareki-options.months{grid-template-columns:repeat(4,minmax(0,1fr))}
.wareki-options .btn{justify-content:center;min-width:0;padding:6px 0;min-height:32px}
.diary-h{flex-wrap:wrap;gap:8px}
.cell .top .dots.in-top{display:inline-flex;gap:2px;flex:none}
@keyframes swipedIn{from{opacity:.35}to{opacity:1}}.cal.swiped,#dayPanel.swiped,.diary > section.swiped{animation:swipedIn .2s ease-out}
.wk-mini{display:none}.ev .ev-ic{display:none}
@media (max-width:760px){
  .cal,#dayPanel,.diary > section:first-child{touch-action:pan-y}                                   /* 横の動きはスワイプで月・週を移すのに使う */
  .week-wrap .week{grid-template-columns:28px repeat(7,minmax(0,1fr))}
  .cal.week-wrap{overflow-x:hidden}
  .wk-h{padding:6px 2px;min-height:0;text-align:center}
  .wk-h > .row{flex-direction:column;gap:0 !important;align-items:center}
  .wk-h .offs,.wk-h .season,.wk-h .sp,.wk-full{display:none}
  .wk-h .rokuyo{font-size:9px}
  .wk-h .dots{justify-content:center}
  .wk-mini{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;margin-top:2px;min-height:14px}
  .wk-mini i{font-style:normal;font-size:9px;font-weight:700;line-height:13px;padding:0 2px;border-radius:3px}
  .m-leave{color:var(--blue);background:var(--blue-soft)}.m-temp{color:var(--teal);background:var(--teal-soft)}.m-shuin{color:var(--green);background:var(--green-soft)}.m-honden{color:var(--honden);background:var(--honden-soft)}.m-sai{color:var(--shu);background:var(--shu-soft)}
  .wk-t{font-size:9px;padding-right:3px}
  .week .ev{padding:0;left:1px;right:1px}
  .week .ev .ev-tx{display:none}
  .week .ev .ev-ic{display:grid;place-items:center;height:100%;min-height:14px;font-size:12px;font-weight:800;line-height:1}
  .week .ev.one{line-height:normal !important}
}
img.mark{object-fit:cover;border-radius:50% !important;background:none !important;padding:0;flex:none}
.dy-h{font-size:14px;margin:16px 0 8px}
.dy-entry{border:1px solid var(--hair);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dy-entry.mine{border-color:var(--brand);background:var(--brand-soft)}
.dy-who{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.dy-text{white-space:pre-wrap;line-height:1.7}
.hv-item{border-top:1px solid var(--hair);padding:8px 0}.hv-item:first-of-type{border-top:0}
.hv-item.mine-day{border:1px solid var(--hair);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.rank.share li{grid-template-columns:minmax(0,1fr) 90px 44px 64px}
.grid2.an-grid{grid-template-columns:repeat(auto-fit,minmax(360px,1fr));align-items:start}
.an-grid .rank li{grid-template-columns:20px minmax(7em,1fr) minmax(40px,90px) 56px 46px}
.grid4.an-k3{grid-template-columns:repeat(3,minmax(0,1fr))}   /* SNS全体の3つの数字 */
@media (max-width:640px){.grid4.an-k3{grid-template-columns:1fr}}
@media (max-width:640px){.grid4.an-k3.an-kg{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.an-kg .kpi{padding:12px}.an-kg .kpi .v{font-size:22px}.an-kg .kpi .l{font-size:11.5px}}   /* 祈願の3つの件数はスマホでも横に並べる（数字が短いので） */

@media (max-width:640px){.an-pair.an-stack{grid-template-columns:1fr}.an-grid .rank.an-post li{grid-template-columns:20px minmax(0,1fr)}.an-grid .rank.an-post li>.r{grid-column:2;text-align:left}}   /* スマホではSNSの2枠を縦に、投稿の数字はタイトルの下に */
.an-grid .rank.an-gap li{grid-template-columns:minmax(0,1fr) 64px 80px}   /* 伸びしろの言葉 */
.an-grid .rank.an-rx li{grid-template-columns:5em minmax(40px,1fr) 64px 40px 52px}.an-grid .rank.an-rx li .bar{display:block}   /* SNSの反応の内訳（スマホでも棒を出す） */
.an-grid .rank.share li{grid-template-columns:minmax(9em,1fr) minmax(40px,90px) 40px 56px}
.an-grid .rank.with-share li{grid-template-columns:20px minmax(6em,1fr) minmax(30px,80px) 56px 36px 46px}
@media (max-width:760px){.grid2.an-grid{grid-template-columns:1fr}.an-grid .rank li{grid-template-columns:20px minmax(0,1fr) 56px 46px}.an-grid .rank.share li{grid-template-columns:minmax(0,1fr) 40px 56px}.an-grid .rank.with-share li{grid-template-columns:20px minmax(0,1fr) 56px 36px 46px}}
@media (max-width:760px){.an-grid .rank li .bar{display:block}.an-grid .rank:not(.an-fol):not(.an-rx) li{row-gap:4px}.an-grid .rank:not(.an-fol):not(.an-rx) li .bar{grid-row:2;grid-column:1/-1}.an-grid .rank:not(.an-fol):not(.an-rx) li .n~.bar{grid-column:2/-1}}   /* 狭い画面でも横棒を出す（名前の下に横いっぱい。フォロワー数・反応の内訳は横に並べたまま） */
.an-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.an-tiles.c3,.an-wide .an-tiles.c3{grid-template-columns:repeat(3,minmax(0,1fr))}   /* 3つ並び（口コミ・検索） */
.an-wide{grid-column:1/-1}
.an-rv{list-style:none;margin:0;padding:0}
.an-rv li{padding:12px 0;border-bottom:1px solid var(--hair)}
.an-rv li:last-child{border-bottom:0}
.an-rv p{margin:6px 0 0;font-size:13.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.an-star{color:var(--brand);letter-spacing:1px;font-size:13px}
.an-star span{color:var(--hair)}   /* 横いっぱいの枠（検索回数・曜日と時間帯） */
.an-wide .an-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.an-dh{display:grid;grid-template-columns:1fr;gap:22px}
/* 正月団体：日付×時間帯の混み具合（2026-11-02） */
.an-heat{overflow-x:auto}
.an-heat table{border-collapse:separate;border-spacing:2px;width:100%;min-width:520px;font-size:11px;table-layout:fixed}
.an-heat th{font-weight:500;color:var(--text-3);padding:2px 0;text-align:center}
.an-heat th.d{text-align:right;padding-right:6px;width:66px;white-space:nowrap}
.an-heat th.d .fill{display:block;font-size:10px;color:var(--text-3);line-height:1.1}
.an-open{list-style:none;margin:0;padding:0}.an-open li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}.an-open li:first-child{border-top:0}.an-open .d{color:var(--text-2)}.an-open .t{display:block;font-size:12px;color:var(--text-2);margin-top:2px;font-variant-numeric:tabular-nums}
.an-heat td{height:26px;text-align:center;border-radius:4px;background:var(--bg-2);font-variant-numeric:tabular-nums;font-weight:600}
@media (min-width:761px){.an-ny .rank.with-share li{grid-template-columns:20px minmax(6em,1fr) minmax(30px,80px) 64px 44px 46px}}
.an-bars{display:flex;align-items:stretch;gap:3px;height:160px;border-bottom:1px solid var(--hair);margin-bottom:22px}
.an-bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative;outline:none;cursor:default}

.an-chartw{position:relative}.an-chartw svg{display:block}   /* 折れ線の上に印を重ねる */
.an-mk{position:absolute;transform:translateX(-50%);width:22px;height:20px;line-height:10px;text-align:center;font-size:10px;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.an-mk .tip{display:none;position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11.5px;line-height:1.5;text-align:left;padding:5px 9px;border-radius:6px;width:max-content;max-width:220px;z-index:3;pointer-events:none}
.an-mk.l .tip{left:0;transform:none}.an-mk.r .tip{left:auto;right:0;transform:none}.an-mk:hover .tip,.an-mk:focus .tip{display:block}
.an-bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.an-band{display:flex;flex-direction:column;align-items:center;background:var(--fill);border-radius:8px;padding:6px 4px;font-size:12px;line-height:1.5}

@media (max-width:760px){.an-dh{grid-template-columns:1fr;gap:18px}}

.cell.bg-uke{background:linear-gradient(var(--s-uke),var(--s-uke)) bottom/100% 3px no-repeat,var(--card)}

/* week */
.week{display:grid;grid-template-columns:52px repeat(7,1fr)}
.wk-h{padding:8px 6px;border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);cursor:pointer;min-height:96px}

.wk-shade{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;text-align:center;padding:8px}

.tl{position:relative;margin-left:44px}

.big-mode{border-radius:14px;padding:16px;text-align:center}

/* diary */

.sg th,.sg td{border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);text-align:center;padding:0;height:34px;min-width:34px}
.sg th{font-size:11px;font-weight:700;color:var(--text-2);background:var(--card);position:sticky;top:0}
.sg th.sun,.sg th.hol{color:var(--red)} .sg th.sat{color:var(--sat)}
.sg td.name,.sg th.name{position:sticky;left:0;background:var(--card);text-align:left;padding:0 12px;min-width:150px;white-space:nowrap;z-index:1;font-weight:600}
.sg td.c{cursor:pointer;position:relative}
.sg td.c:hover{background:var(--bg-2)}
.sg td.need{background:var(--bg-2);font-weight:700}
.sg td.short{color:var(--red)}
.sg td.weekend{background:color-mix(in srgb,var(--fill) 50%,transparent)}
.mk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-weight:800;font-size:12px}
.mk.ok{color:var(--green)}
.mk.ng{color:var(--text-3)}
.mk.as{background:var(--green);color:#fff}
.mk.as.req{box-shadow:0 0 0 2px var(--green-soft)}

/* tasks */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--fill);border-radius:16px;padding:10px}
.kcol h4{font-size:12.5px;font-weight:700;color:var(--text-2);padding:4px 6px 10px;display:flex;gap:6px;align-items:center}
.tcard{background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--hair)}
.tcard h5{font-size:13.5px;font-weight:600;margin:0 0 6px}
.tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
.mail{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px}
.mail:last-child{border-bottom:0}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.chk.done span{color:var(--text-3);text-decoration:line-through}

/* seasons */
.ycal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mcal h5{font-size:13px;font-weight:700;margin:0 0 6px}
.mcal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mcal .g div{aspect-ratio:1;display:grid;place-items:center;font-size:10.5px;border-radius:5px;cursor:pointer}
.mcal .g div.h{font-weight:700;color:var(--text-3);cursor:default}
.mcal .g div.sun{color:var(--red)} .mcal .g div.sat{color:var(--sat)}
.mcal .g div.uke{background:var(--s-uke-b);color:#fff} .mcal .g div.hou{background:var(--s-hou-b);color:#fff} .mcal .g div.nok{background:var(--s-nok-b);color:#fff} .mcal .g div.off{background:var(--s-off-b);color:#fff}
.mcal .g div:not(.h):not(.e):hover{outline:2px solid var(--brand)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--card);border-radius:20px;box-shadow:var(--shadow-2);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--card);z-index:2}
.modal-h h3{font-size:16px;font-weight:700}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--hair);position:sticky;bottom:0;background:var(--card)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow-2);animation:fade .2s}

/* baito view */
.bv{max-width:760px;margin:0 auto;padding:0 16px 60px}
.bv-top{display:flex;align-items:center;gap:10px;padding:16px 0}
.bv-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bv-cal .h{text-align:center;font-size:11px;font-weight:700;color:var(--text-2)}
.bv-d{aspect-ratio:1/1.05;border-radius:12px;background:var(--card);border:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:2px;user-select:none}
.bv-d b{font-size:15px}
.bv-d.sun b,.bv-d.hol b{color:var(--red)} .bv-d.sat b{color:var(--sat)}
.bv-d .m{font-size:13px;font-weight:800;height:16px}
.bv-d.ok{background:var(--green-soft);border-color:var(--green)} .bv-d.ok .m{color:var(--green)}
.bv-d.maybe{background:var(--gold-soft);border-color:var(--gold)} .bv-d.maybe .m{color:var(--gold)}
.bv-d.ng{background:var(--fill)} .bv-d.ng .m{color:var(--text-3)}
.bv-d.e{visibility:hidden}

/* print */
@media print{
  body{background:#fff}
  .side,.topbar,.tabbar,.no-print,.modal-h,.modal-f{display:none !important}
  .modal-bg{position:static;background:none;padding:0;display:block}
  .modal{box-shadow:none;width:auto;max-height:none;overflow:visible}
  .app{display:block} .main{display:none}
  .order-sheet{border:0;page-break-after:always;max-width:none}
}

/* ── responsive ── */
@media (max-width:1240px){
  .cell .wx-mini{display:none}
  .home{grid-template-columns:minmax(0,1fr) 320px}
  .grid4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:1080px){
  .app{grid-template-columns:68px 1fr}
  .side{padding:14px 8px}
  .brand{justify-content:center;padding-bottom:12px}
  .brand div,.nav-g,.nav a .lbl,.nav a .badge,.nav a .ext,.side-foot .me select,.side-foot .me .nm,.linkbtn .lbl{display:none}
  .nav a{justify-content:center;position:relative}
  .nav a.has-badge::after{content:"";position:absolute;top:6px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .home{grid-template-columns:1fr}
  .day{position:static}
  .diary{grid-template-columns:1fr}
  .ycal{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  body{font-size:15px}
  .app{display:block}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
  .topbar b{font-size:15px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10px;font-weight:600;color:var(--text-2);text-decoration:none;position:relative}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--brand)}
  .tabbar a .badge{position:absolute;top:2px;left:calc(50% + 6px);height:16px;min-width:16px;font-size:10px}
  .main{padding:14px 16px 96px}
  .page-h h1{font-size:21px}
  .home{display:flex;flex-direction:column;gap:14px;align-items:stretch}   /* スマホは月が上、日の予定が下（2026-11-02 本人。日付を押すと下の予定へ自動で動く） */
  .cell{min-height:66px;padding:4px 3px}
  .d-num{width:22px;height:22px;font-size:12.5px}
  .rokuyo{font-size:9px}
  .kd{width:13px;height:13px;font-size:8px;border-width:1px}
  .hol-name,.wx-mini{display:none}
  .lines .ln span,.cell .season{display:none}
  .day{width:100%}
  .lines{flex-direction:row;flex-wrap:wrap;gap:2px}
  .ln{padding:0 3px;font-size:9px;border-radius:1px}
  .cell .top{flex-wrap:wrap;justify-content:flex-start;gap:1px;min-height:0}
  .cell .top .sp{display:none}
  .row2{justify-content:flex-end}
  .off-b{height:13px;font-size:8px;padding:0 2px;border-radius:3px}
  .offs{flex:0 1 auto;justify-content:center}
  .day-names{display:none}
  .leave-box{align-items:flex-start}
  .cal-bar h2{font-size:19px;min-width:0}
  .grid2,.grid3,.grid4,.auto{grid-template-columns:1fr 1fr}
  .grid3,.grid2{grid-template-columns:1fr !important}
  .page-h .sp{display:none}
  .manual{grid-template-columns:1fr}
  .cats{display:flex;overflow-x:auto;gap:4px}
  .cats button{white-space:nowrap;width:auto}
  .kanban{grid-template-columns:1fr}
  .ycal{grid-template-columns:repeat(2,1fr)}
  .rank li{grid-template-columns:20px 1fr 54px 54px;}
  .rank li .bar{display:none}
  .order-sheet{padding:20px}
  .os-top{flex-direction:column}
  .week{grid-template-columns:40px repeat(7,minmax(46px,1fr))}
  .week-wrap{overflow-x:auto}
}
/* メニュー（スマホ）ではラベルを常に表示 */
.modal .nav a{justify-content:flex-start}
.modal .nav a .lbl,.modal .nav-g{display:block}
.modal .nav a.has-badge::after{display:none}
/* 掲示板：未読 */
.post.isnew{background:var(--brand-soft)}
.post.isnew h4{color:var(--brand)}
.post.sel{box-shadow:inset 4px 0 0 var(--brand)}
/* 申し送り */
.handover{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.6}
.handover.compact{margin:0}
/* ログイン */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(420px,100%);padding:24px}
.login-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.login-person{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;font-weight:600;font-size:14px}
.login-person:hover{border-color:var(--brand);background:var(--brand-soft)}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:12px 0 4px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--text-3)}
.pin-dots span.on{background:var(--brand);border-color:var(--brand)}
.login-err{text-align:center;color:var(--red);font-size:12.5px;min-height:20px;font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:6px auto 0}
.keypad button{height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:600}
.keypad button:active{background:var(--fill)}
.keypad button:disabled{opacity:.4}
.tl-row.off-hours,.wk-row.off-hours{background:var(--bg-2)}
.bv-d.my-shuin{background:var(--green);border-color:var(--green)} .bv-d.my-shuin b,.bv-d.my-shuin .m{color:#fff}

.ln.temp{background:var(--teal-soft);color:var(--teal)}

.mini-btn:hover{color:var(--brand);border-color:var(--brand)}
.chip.mine-on{background:var(--brand);border-color:var(--brand);color:#fff}

.ev-dep{padding:2px 6px;font-size:10.5px;font-weight:700;color:var(--pink);opacity:.85}

.ev-main b{display:block}
.ev-back{font-size:10.5px;color:var(--text-2);margin-top:1px}

  const tsel = (id, v) => `<select class="input" id="${id}" data-chg="outCalc">${Array.from({ length: 33 }, (_, i) => tstr(360 + i * 30)).map(t => `<option ${t === v ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  const dsel = (id, v) => `<select class="input" id="${id}" data-chg="outCalc">${[[30, '30分'], [60, '1時間'], [90, '1時間半'], [120, '2時間'], [180, '3時間'], [240, '4時間']].map(([m, l]) => `<option value="${m}" ${m === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  const visitors = [...new Set(S.visits.map(v => v.who))];
  modal(`<div class="modal-h"><h3>予定を追加</h3><span class="sp"></span><button class="icon-btn" data-act="closeModal">${ICON.x}</button></div>
  <div class="modal-b">
    <div class="seg" style="margin-bottom:14px" id="evType" data-sai="${type === 'sai' ? '1' : ''}">${[['visit', '来訪者'], ['out', '外出'], ['sai', '祭典・行事'], ...(canSetTemp() ? [['temp', '臨時職員']] : [])].map(([v, l]) => `<button class="${v === type ? 'on' : ''}" data-act="evType" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="grid3" style="grid-template-columns:1.4fr 1fr 1fr"><div class="field"><label>日付</label>${warekiField(k, {id: 'evDate', label: '日付'})}</div><div class="field ev-time" ${type === 'temp' ? 'style="display:none"' : ''}><label>開始（先方での開始）</label>${tsel('evStart', type === 'sai' ? '11:00' : '10:00')}</div><div class="field ev-time" ${type === 'temp' ? 'style="display:none"' : ''}><label>長さ</label>${dsel('evDur', type === 'sai' ? 30 : 60)}</div></div>
    ${canSetTemp() ? `<div class="evsec" data-sec="temp" ${type !== 'temp' ? 'hidden' : ''}>
      <div class="field"><label>だれが</label><select class="input" id="twStaff">${TEMP_STAFF.map(t => `<option value="${t.id}">${t.name}</option>`).join('')}</select></div>
    </div>` : ''}
    <div class="evsec" data-sec="visit" ${type !== 'visit' ? 'hidden' : ''}>
      <div class="field"><label>来訪者（だれが来るか）</label><input class="input" id="vWho" list="vWhoList" placeholder="例：京都奉製、さわやか信用金庫"><datalist id="vWhoList">${visitors.map(v => `<option value="${esc(v)}">`).join('')}</datalist></div>
      <div class="grid2"><div class="field"><label>用件（任意）</label><input class="input" id="vPurpose" placeholder="例：授与品の打合せ"></div><div class="field"><label>対応する職員</label><select class="input" id="vHost"><option value="">未定</option>${HOSTS.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div></div>
    </div>
    <div class="evsec" data-sec="out" ${type !== 'out' ? 'hidden' : ''}>
      <div class="grid2"><div class="field"><label>だれが</label><div id="oStaffList">${outStaffRow(S.me, false)}</div><button class="btn sm" style="align-self:flex-start;margin-top:4px" data-act="addOutStaff">＋ 人を追加</button></div><div class="field"><label>行き先</label><input class="input" id="oPlace" placeholder="例：神社庁" list="oPlaceList" data-chg="outPlace"><datalist id="oPlaceList">${Object.keys(S.places).map(p => `<option value="${esc(p)}">`).join('')}</datalist></div></div>
      <div class="grid3" style="grid-template-columns:1fr 1fr 1.4fr"><div class="field"><label>移動時間（片道・分）</label><input class="input num" type="number" min="0" step="5" id="oTravel" placeholder="例：40" data-chg="outCalc"></div><div class="field"><label>余裕（分）</label><input class="input num" type="number" min="0" step="5" id="oBuffer" value="15" data-chg="outCalc"></div><div class="field"><label>出発の目安</label><div id="oCalc" class="small" style="padding:9px 0;font-weight:700">—</div></div></div>
      <div class="small muted" style="margin:-6px 0 10px">一度行った場所は移動時間を覚えるので、次からは行き先を選ぶだけで入ります。</div>
      <div class="field"><label>用件（任意）</label><input class="input" id="oPurpose" placeholder="例：支部の会議"></div>
    </div>
    <div class="evsec" data-sec="sai" ${type !== 'sai' ? 'hidden' : ''}>
      <div class="field"><label>祭典・行事の名前</label><input class="input" id="sName" placeholder="例：○○祭"></div>
      <label class="row small" style="gap:6px;margin:-4px 0 12px"><input type="checkbox" id="sAllDay" style="width:18px;height:18px;accent-color:var(--brand)"> 終日（時間を決めずに一日中）</label>
      <div class="note">${ICON.info}<span>この日だけの祭典はここで追加します。毎月・毎年決まっている祭典（月次祭など）は「祭典の設定」で登録すると、自動でカレンダーに入ります。</span></div>
    </div>
  </div>
  <div class="modal-f"><button class="btn" data-act="closeModal">やめる</button><button class="btn pri" data-act="saveEvent">追加する</button></div>`);
}

function leaveModal(k) {
  const mine = S.leaves.filter(l => l.staff === S.me && l.date >= TK).sort((a, b) => a.date < b.date ? -1 : 1).slice(0, 8);
  modal(`<div class="modal-h"><h3>休みを申告</h3><span class="sp"></span><button class="icon-btn" data-act="closeModal">${ICON.x}</button></div>
  <div class="modal-b">
    <div class="note" style="margin-bottom:14px">${ICON.info}<span>承認は不要です。登録するとすぐカレンダーに表示されます。申告の締切はありません。休みは1人<b>月${S.rules.leaveQuota}日</b>。1日に休めるのは<b>平日${S.rules.leaveCap.weekday}人・土日祝${S.rules.leaveCap.weekend}人・イベントの日${S.rules.leaveCap.event}人</b>までで、超える日は登録できません。</span></div>
    <div class="field"><label>だれの休み</label><select class="input" id="lvWho">${STAFF.map(s => `<option value="${s.id}" ${s.id === (isGuji() ? 'katsushi' : S.me) ? 'selected' : ''}>${s.name}</option>`).join('')}</select></div>
    <div class="grid2"><div class="field"><label>開始日</label>${warekiField(k, {id: 'lvFrom', label: '開始日'})}</div><div class="field"><label>終了日</label>${warekiField(k, {id: 'lvTo', label: '終了日'})}</div></div>
    <div class="field"><label>メモ（任意）</label><input class="input" id="lvMemo" placeholder="例：通院のため"></div>
    ${mine.length ? `<h4 class="small muted" style="margin:6px 0">${me().name}さんの予定している休み</h4><ul class="mini-list">${mine.map(l => `<li>${mdw(parse(l.date))}<span class="muted small">${esc(l.memo)}</span><span class="sp"></span><button class="btn sm ghost" data-act="delLeave" data-id="${l.id}">取り消す</button></li>`).join('')}</ul>` : ''}

}

/* =========================================================
   日報
   ========================================================= */
let diaryDay = TK, diaryQ = '';
/* 申し送り：前の日（7日以内）の日報の「明日への申し送り」。対応済み、またはタスクにして完了したら消える */
const noteTask = e => e.nextTask && S.tasks.find(t => t.id === e.nextTask);
const noteResolved = e => e.nextDone || (noteTask(e) && noteTask(e).status === 'done');
function prevNote(k) {
  for (let i = 1; i <= 7; i++) { const kk = key(addDays(parse(k), -i)), e = S.diary[kk]; if (e && e.next && e.next.trim() && !noteResolved(e)) return { date: kk, text: e.next, by: e.by, e }; }
  return null;
}
function noteCard(k, compact) {
  const n = prevNote(k); if (!n) return '';
  return `<div class="handover${compact ? ' compact' : ''}"><div class="row" style="gap:6px"><span class="small" style="font-weight:700;color:var(--brand)">申し送り（${md(parse(n.date))} ${staffById(n.by)?.name || ''}）</span><span class="sp"></span>
    <button class="mini-btn" data-act="noteDone" data-k="${n.date}">対応済</button></div>
    <div style="white-space:pre-wrap;margin-top:4px">${esc(n.text)}</div></div>`;
}
/* 祈願の件数：予約台帳の予約から自動で数える（外祭は除く）。本番は予約台帳とつながってから数え始める */
const kiganOn = k => resOn(k).filter(r => r.type !== '外祭').length;
const kiganMonth = k => { let n = 0; for (let d = new Date(parse(k).getFullYear(), parse(k).getMonth(), 1); key(d) <= k; d = addDays(d, 1)) n += kiganOn(key(d)); return n; };
const kiganReady = () => !PROD || S.res.length > 0;
function autoInfo(k) {
  const d = parse(k), ky = KOYOMI.get(d), w = wxOf(k), s = seasonOf(k), e = S.diary[k];
  const rs = resOn(k).filter(r => r.type !== '外祭');
  const wx = e && e.wx ? e.wx : w;
  return { d, ky, wx, s, kigan: rs.length || (e ? e.kigan : 0), visits: visitsOn(k).length, juyo: e ? e.juyo : (k === TK ? 64 : null) };
}
function pastCard(k, label) {
  const e = S.diary[k], d = parse(k), ky = KOYOMI.get(d);
  if (!e) return `<div class="past"><div class="ph"><span class="ag">${label}</span><b>${ymdw(d)}</b></div><p class="muted small">この日の日報はありません</p></div>`;
  const wx = e.wx || fakeWx(k);
  return `<div class="past"><div class="ph"><span class="ag">${label}</span><b>${ymdw(d)}</b><span class="sp"></span><span class="small muted">${WX_ICON[wx.kind]} ${wx.tmax}°・${ky.roku}${ky.inu ? '・戌' : ''}</span></div>
    <div class="row small muted" style="gap:12px;margin-bottom:6px"><span>祈願 <b class="num" style="color:var(--text)">${PROD ? (kiganReady() ? kiganOn(k) : '—') : e.kigan}</b>件</span>${PROD ? '' : `<span>授与品 <b class="num" style="color:var(--text)">${e.juyo}</b>体</span>`}<span>記入 ${staffById(e.by).name}</span></div>
    <p>${esc(e.text)}</p>${e.next ? `<p class="small muted" style="margin-top:6px">申し送り：${esc(e.next)}</p>` : ''}</div>`;
}
function vDiary() {
  const k = diaryDay, a = autoInfo(k), e = S.diary[k] || { text: '', next: '' };
  const cmp = S.ui.diaryCmp;
  const p1 = cmp === 'weekday' ? key(addDays(a.d, -364)) : key(new Date(a.d.getFullYear() - 1, a.d.getMonth(), a.d.getDate()));
  const p2 = cmp === 'weekday' ? key(addDays(a.d, -728)) : key(new Date(a.d.getFullYear() - 2, a.d.getMonth(), a.d.getDate()));
  const kt = [a.ky.roku, a.ky.inu && '戌の日', a.ky.ichi && '一粒万倍日', a.ky.ten && '天赦日'].filter(Boolean).join('・');
  const results = diaryQ ? Object.entries(S.diary).filter(([kk, v]) => (v.text + v.next).includes(diaryQ)).sort((x, y) => x[0] < y[0] ? 1 : -1).slice(0, 30) : [];
  return `
  <div class="page-h"><h1>日報</h1>${PROD ? '' : '<span class="sub">天気・暦・祈願件数は自動で入ります。書くのは出来事と申し送りだけ。</span>'}</div>
  <div class="diary">
    <section class="card card-p">
      <div class="row diary-h" style="margin-bottom:14px">
        ${warekiField(k, {max: TK, change: 'diaryDate', label: '日報の日付', heading: true})}
        <span class="sp"></span>
        <div class="cal-nav"><button class="btn sm" data-act="diaryMove" data-n="-1">${ICON.left}<span>前の日</span></button><button class="btn sm" data-act="diaryToday" ${k === TK ? 'disabled' : ''}>今日</button><button class="btn sm" data-act="diaryMove" data-n="1" ${k >= TK ? 'disabled' : ''}><span>次の日</span>${ICON.right}</button></div>
      </div>
      ${noteCard(k)}
      <div class="auto">
        <div><div class="l">天気 <span class="autotag">自動</span></div><div class="v">${a.wx ? `${WX_ICON[a.wx.kind]} ${WX_LABEL[a.wx.kind]}` : '—'}</div><div class="small muted">${a.wx ? `${a.wx.tmax}° / ${a.wx.tmin}°` : ''}</div></div>
        <div><div class="l">暦 <span class="autotag">自動</span></div><div class="v" style="font-size:13.5px">${kt}</div><div class="small muted">${a.ky.kanshi}</div></div>
        ${PROD ? `<div><div class="l">来訪 <span class="autotag">自動</span></div><div class="v num">${a.visits}件</div><div class="small muted">外出 ${outingsOn(k).length}件</div></div>` : `<div><div class="l">祈願 <span class="autotag">台帳から</span></div><div class="v num">${a.kigan}件</div><div class="small muted">来客 ${a.visits}件</div></div>`}
        ${PROD ? `<div><div class="l">祈願 <span class="autotag">自動</span></div>${kiganReady() ? `<div class="v num">${kiganOn(k)}件</div><div class="small muted">今月 ${kiganMonth(k)}件</div>` : '<div class="v num">—</div><div class="small muted">予約台帳とつながると自動で数えます</div>'}</div>` : `<div><div class="l">授与品の出数 <span class="autotag">レジから</span></div><div class="v num">${a.juyo ?? '—'}${a.juyo != null ? '体' : ''}</div><div class="small muted">${a.s ? esc(a.s.mode === 'off' ? '休み（全員）' : a.s.label) : '平時'}</div></div>`}
      </div>
      <div class="field"><label>今日の出来事</label><textarea class="input" id="dyText" placeholder="参拝の様子、印象に残ったこと、トラブルなど">${esc(e.text)}</textarea></div>
      <div class="field"><label>明日への申し送り</label><textarea class="input" id="dyNext" style="min-height:60px" placeholder="次の人に伝えること">${esc(e.next)}</textarea></div>
      <div class="small muted" style="margin:-6px 0 10px">申し送りは、次の日のホーム（今日の欄）と日報の上に自動で表示されます。「対応済」を押すと消えます。</div>
      <div class="row"><label class="row small" style="gap:6px"><input type="checkbox" id="dyBoard"> 掲示板にも載せる</label><span class="sp"></span>${e.by ? `<span class="small muted">記入 ${staffById(e.by).name}</span>` : ''}<button class="btn pri" data-act="saveDiary">保存</button></div>
    </section>
    <section>
      <div class="row" style="margin-bottom:12px"><h3 style="font-size:15px">過去の同じ時期</h3><span class="sp"></span>
        <div class="seg"><button class="${cmp === 'weekday' ? 'on' : ''}" data-act="diaryCmp" data-v="weekday">同じ曜日</button><button class="${cmp === 'date' ? 'on' : ''}" data-act="diaryCmp" data-v="date">同じ日付</button></div></div>
      ${pastCard(p1, '1年前')}${pastCard(p2, '2年前')}
      ${PROD ? '' : `<div class="note" style="margin-bottom:16px">${ICON.info}<span>「同じ曜日」は52週前（混み具合の比較向け）、「同じ日付」は例大祭など日付で決まる行事の比較向けです。</span></div>`}
      <div class="card card-p">
        <div class="row" style="margin-bottom:8px">${ICON.search.replace('<svg', '<svg width="16" height="16"')}<input class="input" id="dyQ" placeholder="過去の日報を検索（例：取材、雨、外祭）" value="${esc(diaryQ)}" data-enter="diarySearch"><button class="btn sm" data-act="diarySearch">検索</button></div>
        ${diaryQ ? (results.length ? `<ul class="mini-list">${results.map(([kk, v]) => `<li style="cursor:pointer" data-act="diaryGo" data-k="${kk}"><b class="num" style="white-space:nowrap">${kk.replace(/-/g, '/')}</b><span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.text)}</span></li>`).join('')}</ul>` : '<div class="empty">見つかりませんでした</div>') : '<div class="small muted">キーワードで過去の日報を探せます</div>'}
      </div>
    </section>
  </div>`;
}

/* =========================================================
   掲示板
   ========================================================= */
let postSel = null;
const readChips = (p, people, byName) => `<div class="reads">${people.map(s => { const at = byName ? Object.entries(p.reads).find(([id]) => personById(id)?.name === s.name)?.[1] : p.reads[s.id]; const nm = shortName(s.name); return at ? `<span class="read y">${avatar(s.name, s.color, true)}${esc(nm)} ✓ ${(d => `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`)(new Date(at))}</span>` : `<span class="read n">${avatar(s.name, s.color, true)}${esc(nm)} 未読</span>`; }).join('')}</div>`;
function vBoard() {
  const posts = [...S.board].sort((a, b) => b.at - a.at);
  const sel = posts.find(p => p.id === postSel) || null;
  const fmtAt = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`; };
  return `
  <div class="page-h"><h1>掲示板</h1><span class="sub">既読がわかるので、休み明けの人への伝え漏れを防げます</span><span class="sp"></span><button class="btn pri" data-act="newPost">＋ 投稿する</button></div>
  <div class="grid2" style="align-items:start">
    <div class="card" style="overflow:hidden">${posts.map(p => `<div class="post${p.reads[S.me] || isGuji() ? '' : ' isnew'}${p.id === postSel ? ' sel' : ''}" data-act="openPost" data-id="${p.id}">
      <span class="unread ${p.reads[S.me] || isGuji() ? 'no' : ''}"></span>
      <div style="min-width:0;flex:1"><div class="row" style="gap:6px">${p.reads[S.me] || isGuji() ? '' : '<span class="tag brand">未読</span>'}<h4>${esc(p.title)}</h4></div><p>${esc(p.body)}</p>
      <div class="row small muted" style="margin-top:6px;gap:8px">${avatar(staffById(p.by).name, staffById(p.by).color, true)}${staffById(p.by).name}・${fmtAt(p.at)}<span class="tag ${boardTargets(p).length ? 'green' : 'gray'}">${targetLabel(p)}</span><span class="sp"></span>既読 ${STAFF.filter(s => p.reads[s.id]).length}/${STAFF.length}</div></div></div>`).join('')}</div>
    <div class="card card-p" style="position:sticky;top:18px">${sel ? `
      <h3 style="font-size:18px;margin-bottom:6px">${esc(sel.title)}</h3>
      <div class="small muted" style="margin-bottom:14px">${staffById(sel.by).name}・${fmtAt(sel.at)}</div>
      <p style="white-space:pre-wrap;line-height:1.8">${esc(sel.body)}</p>
      <h4 class="small muted" style="margin:18px 0 8px">既読（職員）</h4>
      ${readChips(sel, STAFF)}
      ${boardTargets(sel).includes('shuin') ? `<h4 class="small muted" style="margin:14px 0 8px">既読（助勤・御朱印）</h4>${readChips(sel, S.regulars)}` : ''}
      ${boardTargets(sel).includes('miko') ? `<h4 class="small muted" style="margin:14px 0 8px">既読（助勤・巫女）</h4>${readChips(sel, mikoPeople(), true)}` : ''}` : '<div class="empty">投稿を選ぶと、内容と既読の状況が表示されます。<br>開いた時点で既読になります。</div>'}</div>
  </div>`;
}
function newPostModal(prefill) {
  modal(`<div class="modal-h"><h3>掲示板に投稿</h3><span class="sp"></span><button class="icon-btn" data-act="closeModal">${ICON.x}</button></div>
  <div class="modal-b">
    <div class="field"><label>タイトル</label><input class="input" id="bpTitle" value="${esc(prefill?.title || '')}"></div>
    <div class="field"><label>本文</label><textarea class="input" id="bpBody" style="min-height:140px">${esc(prefill?.body || '')}</textarea></div>

      <div class="row"><label class="row small" style="gap:6px"><input type="checkbox" id="bpShuin" style="width:18px;height:18px;accent-color:var(--brand)"> 御朱印にも表示</label><label class="row small" style="gap:6px"><input type="checkbox" id="bpMiko" style="width:18px;height:18px;accent-color:var(--brand)"> 巫女にも表示</label></div></div>
  </div>
  <div class="modal-f"><button class="btn" data-act="closeModal">やめる</button><button class="btn pri" data-act="savePost">投稿する</button></div>`);
}

/* =========================================================
   マニュアル・よくある質問
   ========================================================= */
let manCat = 'すべて', manQ = '';
function vManual() {
  const cats = ['すべて', ...new Set(S.manual.map(m => m.cat))];
  const list = S.manual.filter(m => (manCat === 'すべて' || m.cat === manCat) && (!manQ || (m.title + m.body).includes(manQ))).sort((a, b) => b.at - a.at);
  return `
  <div class="page-h"><h1>マニュアル・よくある質問</h1><span class="sub">各自で書き足し・修正できます。誰がいつ直したかが残ります。</span><span class="sp"></span><button class="btn pri" data-act="editMan" data-id="">＋ 追加</button></div>
  <div class="manual">
    <div class="cats card" style="padding:8px">${cats.map(c => `<button class="${c === manCat ? 'on' : ''}" data-act="manCat" data-v="${esc(c)}">${esc(c)}<span class="muted">${c === 'すべて' ? S.manual.length : S.manual.filter(m => m.cat === c).length}</span></button>`).join('')}</div>
    <div>

/* =========================================================
   授与品（在庫・出数の分析・御守りの登録・発注量の提案）
   ========================================================= */
const SALES_F = [3.2, 0.8, 0.8, 0.85, 0.85, 1.15, 0.8, 0.75, 0.8, 0.9, 1.25, 0.9];
const SALES_SUM = SALES_F.reduce((a, b) => a + b, 0);
const itemGrowth = it => 0.86 + rng(hashStr('gr' + it.id))() * 0.34;
function salesOf(it, ymk) {
  const [y, m] = ymk.split('-').map(Number);
  const ago = (TODAY.getFullYear() - y) * 12 + (TODAY.getMonth() + 1 - m);   // 何か月前か
  if (ago < 0) return 0;
  const g = ago < 12 ? itemGrowth(it) : 1;
  let v = it.annual / SALES_SUM * SALES_F[m - 1] * g * (0.9 + rng(hashStr('sl' + it.id + ymk))() * 0.2);
  if (ago === 0) v *= TODAY.getDate() / new Date(y, m, 0).getDate();
  return Math.round(v);
}
const monthsBack = (n, from = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1)) => Array.from({ length: n }, (_, i) => ym(new Date(from.getFullYear(), from.getMonth() - (n - 1 - i), 1)));
const supById = id => S.suppliers.find(s => s.id === id);
const itemLead = it => supById(it.sup)?.lead ?? 30;   // 納期は業者ごとに登録

function stockStat(it) {
  const logs = S.stockLog.filter(l => l.item === it.id).sort((a, b) => a.date < b.date ? -1 : 1);
  const since = key(addDays(TODAY, -90));
  const c0 = logs.find(l => l.type === 'count' && l.date >= since);
  const now = S.stock[it.id] ?? 0;
  let rate = null;
  if (c0) {
    const days = Math.max(1, Math.round((TODAY - parse(c0.date)) / 864e5));
    const ins = logs.filter(l => l.type === 'in' && l.date > c0.date).reduce((a, l) => a + l.boxes, 0);
    const used = c0.boxes + ins - now;
    if (days >= 7 && used > 0) rate = used / days;
  }
  // 入荷日は分からないので、「業者の納期」だけで判断する：無くなるまでの日数が納期＋2週間を切ったら注意、納期を切ったら至急
  const lead = itemLead(it);
  let out = null, status = 'ok', orderBy = null, daysLeft = null;
  if (rate) {
    daysLeft = Math.floor(now / rate);
    out = addDays(TODAY, daysLeft);
    orderBy = addDays(out, -lead);
    status = daysLeft <= lead ? 'urgent' : daysLeft <= lead + 14 ? 'warn' : 'ok';
  } else status = 'nodata';
  if (now === 0) { status = 'urgent'; out = TODAY; orderBy = TODAY; daysLeft = 0; }
  const lastCount = [...logs].reverse().find(l => l.type === 'count');
  return { now, rate, out, status, orderBy, lastCount, daysLeft, lead };
}

let salesItem = 'all', salesPeriod = 'year';
function juyoSales() {
  const cur = monthsBack(12), prev = monthsBack(12, new Date(TODAY.getFullYear() - 1, TODAY.getMonth(), 1));
  const isY = salesPeriod === 'year';
  const thisM = ym(TODAY), lastYM = ym(new Date(TODAY.getFullYear() - 1, TODAY.getMonth(), 1));
  const totals = S.items.map(it => {
    const q = isY ? cur.reduce((a, m) => a + salesOf(it, m), 0) : salesOf(it, thisM);
    const p = isY ? prev.reduce((a, m) => a + salesOf(it, m), 0) : Math.round(salesOf(it, lastYM) * TODAY.getDate() / new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate());
    return { it, q, p };
  }).sort((a, b) => b.q - a.q);
  const sum = totals.reduce((a, t) => a + t.q, 0); let acc = 0;
  totals.forEach(t => { acc += t.q; t.abc = acc / sum <= 0.7 ? 'A' : acc / sum <= 0.9 ? 'B' : 'C'; });
  const max = totals[0]?.q || 1;

    </div>
  </div>`;
}
function barChart(labels, a, b, la, lb) {
  const W = 560, H = 210, P = { l: 40, r: 8, t: 12, b: 26 }, n = labels.length;
  const max = Math.max(...a, ...b, 1) * 1.1, gw = (W - P.l - P.r) / n, bw = Math.min(14, gw / 2.8);
  const y = v => P.t + (H - P.t - P.b) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max / 4 * i, yy = y(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${P.l - 6}" y="${yy + 4}" font-size="10" text-anchor="end" fill="var(--text-3)">${v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : Math.round(v)}</text>`; }
  labels.forEach((l, i) => {
    const x = P.l + gw * i + gw / 2;
    g += `<rect x="${x - bw - 1}" y="${y(b[i])}" width="${bw}" height="${H - P.b - y(b[i])}" rx="3" fill="var(--line)"><title>${lb} ${l}：${b[i].toLocaleString()}</title></rect>`;
    g += `<rect x="${x + 1}" y="${y(a[i])}" width="${bw}" height="${H - P.b - y(a[i])}" rx="3" fill="var(--brand)"><title>${la} ${l}：${a[i].toLocaleString()}</title></rect>`;
    g += `<text x="${x}" y="${H - 8}" font-size="10" text-anchor="middle" fill="var(--text-2)">${l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="月別のグラフ">${g}</svg>
  <div class="legend" style="margin-top:2px"><span><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--brand);margin-right:4px"></span>${la}</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--line);margin-right:4px"></span>${lb}</span></div>`;
}

function orderRows() {
  const cur = monthsBack(12), prev = monthsBack(12, new Date(TODAY.getFullYear() - 1, TODAY.getMonth(), 1));

    const cons = Math.max(1, Math.round(it.annual / it.perBox));
    const sc = cur.reduce((a, m) => a + salesOf(it, m), 0), sp = prev.reduce((a, m) => a + salesOf(it, m), 0);

    const boxes = Math.max(0, Math.ceil(cons * growth * 1.1 - remain));

    .forEach(x => {

function vAnalytics() {
  const cur = monthsBack(12, new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1));
  const prev = monthsBack(12, new Date(TODAY.getFullYear() - 1, TODAY.getMonth() - 1, 1));
  const A = S.analytics, g = (m, f) => A[m]?.[f] ?? 0;
  const last = cur[11], lastPrev = prev[11];
  const sumC = cur.reduce((a, m) => a + g(m, 'hp'), 0), sumP = prev.reduce((a, m) => a + g(m, 'hp'), 0);
  const pct = (a, b) => b ? (a / b - 1) * 100 : 0;
  const kpi = (l, v, d, sub) => `<div class="card kpi"><div class="l">${l}</div><div class="v num">${v}</div>${d !== null ? `<div class="d ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} 前年比 ${d >= 0 ? '+' : ''}${d.toFixed(1)}%</div>` : `<div class="small muted">${sub}</div>`}</div>`;
  const evLabel = m => { const ts = new Set(Object.entries(S.seasons).filter(([k]) => k.slice(5, 7) === m.slice(5, 7)).map(([, t]) => SEASON_TYPES[t].label.replace('（平日）', ''))); return [...ts].join('・'); };
  return `
  <div class="page-h"><h1>分析</h1><span class="sp"></span><button class="btn pri" data-act="anInput">今月の数字を入力</button></div>
  <div class="note" style="margin-bottom:14px">${ICON.info}<span>数字はサンプルです。最初は月1回、GA4・Googleトレンドの数字を手で入れ、つなげられるものから自動にします。SNSはこれから開設するので、開設後に欄が埋まります。</span></div>
  <div class="grid4" style="margin-bottom:16px">
    ${kpi(`HP閲覧数（${Number(last.slice(5))}月）`, g(last, 'hp').toLocaleString(), pct(g(last, 'hp'), g(lastPrev, 'hp')))}
    ${kpi('HP閲覧数（直近12か月）', sumC.toLocaleString(), pct(sumC, sumP))}
    ${kpi(`検索の多さ（${Number(last.slice(5))}月・指数）`, g(last, 'search'), pct(g(last, 'search'), g(lastPrev, 'search')))}
    ${kpi('Instagram', '—', null, '開設後に表示')}
  </div>
  <div class="grid2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start">
    <div class="card card-p"><div class="card-h"><h3>HP閲覧数の月別（前年と比べる）</h3></div>
      ${barChart(cur.map(m => Number(m.slice(5)) + '月'), cur.map(m => g(m, 'hp')), prev.map(m => g(m, 'hp')), '直近12か月', '前年')}
</div>
    <div class="card card-p"><div class="card-h"><h3>月ごとの数字</h3></div>
      <div class="tbl-wrap" style="max-height:340px;overflow:auto"><table class="tbl"><thead><tr><th>月</th><th class="r">HP閲覧</th><th class="r">前年比</th><th class="r">検索</th></tr></thead>
      <tbody>${[...cur].reverse().map((m, i) => { const p = [...prev].reverse()[i], d = pct(g(m, 'hp'), g(p, 'hp')); return `<tr><td>${warekiFieldLabel(m, true)}</td><td class="r num">${g(m, 'hp').toLocaleString()}</td><td class="r num small ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d.toFixed(1)}%</td><td class="r num">${g(m, 'search')}</td></tr>`; }).join('')}</tbody></table></div></div>
  </div>
  <div class="grid3" style="margin-top:16px">
    <div class="card card-p"><h3>Googleマップ</h3><p class="small muted" style="margin-top:6px">ビジネスプロフィールの管理を始めたら、閲覧数・ルート検索数をここに出します。</p></div>
    <div class="card card-p"><h3>Search Console</h3><p class="small muted" style="margin-top:6px">所有権の確認が済んだら、検索での表示回数・クリック数を出します。</p></div>
    <div class="card card-p"><h3>YouTube</h3><p class="small muted" style="margin-top:6px">公式サイトに埋め込み中の動画の再生数を、必要なら追加します。</p></div>
  </div>`;
}

let taskMine = false, openEvent = null, showArchive = false;
const DONE_KEEP_DAYS = 7;   // 完了したタスクを「完了」の列に残す日数（その後は「過去の完了」へ。消さない）
function vTasks() {
  const tab = S.ui.taskTab;

  ${tab === 'tasks' ? tasksBoard() : eventsView()}`;
}
const isArchived = t => t.status === 'done' && t.doneAt && (Date.now() - t.doneAt) > DONE_KEEP_DAYS * 864e5;
function tasksBoard() {
  const list = S.tasks.filter(t => !taskMine || t.who === S.me);
  const col = (st, label) => {
    const ts = list.filter(t => t.status === st && !(st === 'done' && isArchived(t))).sort((a, b) => a.due < b.due ? -1 : 1);
    return `<div class="kcol"><h4>${label}<span class="tag gray">${ts.length}</span></h4>${ts.map(t => {
      const s = staffById(t.who), od = t.status !== 'done' && t.due < TK;
      return `<div class="tcard"><h5>${esc(t.title)}</h5>
        ${t.src === 'outlook' ? `<div class="small muted" style="margin-bottom:6px">${ICON.mail.replace('<svg', '<svg width="13" height="13" style="vertical-align:-2px"')} ${esc(t.mail)}</div>` : ''}
        <div class="meta">${avatar(s.name, s.color, true)}${s.name}<span class="${od ? 'tag red' : ''}">期限 ${md(parse(t.due))}</span>${t.src === 'outlook' ? '<span class="tag blue">Outlook</span>' : ''}<span class="sp"></span>
        ${st !== 'todo' ? `<button class="btn sm ghost" data-act="taskMove" data-id="${t.id}" data-n="-1">←</button>` : ''}${st !== 'done' ? `<button class="btn sm" data-act="taskMove" data-id="${t.id}" data-n="1">${st === 'todo' ? '着手' : '完了'}</button>` : ''}</div></div>`;
    }).join('') || '<div class="small muted" style="padding:6px">なし</div>'}</div>`;
  };
  return `
  <div class="grid2" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr);align-items:start">
    <div>
      <div class="row" style="margin-bottom:12px"><div class="seg"><button class="${!taskMine ? 'on' : ''}" data-act="taskMine" data-v="0">全員</button><button class="${taskMine ? 'on' : ''}" data-act="taskMine" data-v="1">自分の担当</button></div></div>
      <div class="kanban">${col('todo', '未着手')}${col('doing', '進行中')}${col('done', '完了')}</div>
      <div class="small muted" style="margin-top:8px">完了したタスクは${DONE_KEEP_DAYS}日間「完了」の列に残り、その後は「過去の完了」に移ります（消えません）。
        <a href="javascript:void 0" data-act="toggleArchive">過去の完了（${list.filter(isArchived).length}件）を${showArchive ? '閉じる' : '見る'}</a></div>
      ${showArchive ? `<div class="card card-p" style="margin-top:10px"><ul class="mini-list">${list.filter(isArchived).sort((a, b) => b.doneAt - a.doneAt).map(t => `<li><span class="small muted num" style="white-space:nowrap">${md(new Date(t.doneAt))} 完了</span><span style="flex:1">${esc(t.title)}</span>${avatar(staffById(t.who).name, staffById(t.who).color, true)}<button class="btn sm ghost" data-act="taskMove" data-id="${t.id}" data-n="-1">戻す</button></li>`).join('') || '<li class="muted">ありません</li>'}</ul></div>` : ''}
    </div>
    <div class="card card-p">
      <div class="card-h">${ICON.mail.replace('<svg', '<svg width="18" height="18"')}<h3>共有メール（Outlook）</h3><span class="sp"></span><span class="badge">${S.inbox.length}</span></div>
      <div class="small muted" style="margin-bottom:6px">担当を選ぶとタスクになり、担当者に通知が届きます。</div>
      ${S.inbox.map(m => `<div class="mail"><div style="flex:1;min-width:0"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.subject)}</b><span class="small muted">${esc(m.from)}</span></div>

  return `<span class="wareki-field"><button type="button" class="${heading ? 'cal-title wareki-heading' : 'btn'}" data-act="warekiPicker" data-label="${esc(label)}" data-month="${month}" data-clear="${clear}" data-heading="${heading}" aria-label="${esc(label + ' ' + text)}" aria-haspopup="dialog"><span>${esc(text)}</span> <span aria-hidden="true">▾</span></button><input type="hidden" ${id ? `id="${esc(id)}"` : ''} value="${esc(value)}" data-min="${esc(min)}" data-max="${esc(max)}" ${change ? `data-chg="${change}"` : ''}${dataAttrs}></span>`;
}

function warekiFieldLabel(value, month, heading) {
  if (!value) return month ? '年月を選ぶ' : '日付を選ぶ';
  if (month) {
    const [y, m] = value.split('-').map(Number);
    return warekiMonth(y, m);
  }
  return heading ? ymdw(parse(value)) : warekiDate(parse(value));
}

function openWarekiPicker(button) {
  if (document.getElementById('warekiPicker')) return;
  const input = button.nextElementSibling;
  const {min, max} = input.dataset;
  const {label} = button.dataset;
  const month = button.dataset.month === 'true';
  const heading = button.dataset.heading === 'true';
  const fallback = key(TODAY).slice(0, month ? 7 : 10);
  const initial = input.value || (min && fallback < min ? min : max && fallback > max ? max : fallback);
  const [year, initialMonth] = initial.split('-').map(Number);
  let cursor = new Date(year, initialMonth - 1, 1);
  const dialog = document.createElement('dialog');
  dialog.id = 'warekiPicker';
  dialog.className = 'wareki-dialog';
  dialog.setAttribute('aria-label', label);
  const allowed = v => (!min || v >= min) && (!max || v <= max);
  const interval = d => {
    const y = d.getFullYear(), m = d.getMonth();
    if (month) return [ym(new Date(y, 0, 1)), ym(new Date(y, 11, 1))];
    return [key(d), key(new Date(y, m + 1, 0))];
  };
  const overlaps = d => {
    const [start, end] = interval(d);
    return (!min || end >= min) && (!max || start <= max);
  };
  const move = n => new Date(cursor.getFullYear(), cursor.getMonth() + n, 1);
  function show(focusStep) {
    const y = cursor.getFullYear(), m = cursor.getMonth();
    const step = month ? 12 : 1;
    const nav = (n, text) => `<button type="button" class="btn sm" data-step="${n}" ${overlaps(move(n)) ? '' : 'disabled'}>${text}</button>`;
    const option = (value, text, name) => `<button type="button" class="btn sm${value === input.value ? ' pri' : ''}" data-value="${value}" aria-label="${name}" aria-pressed="${value === input.value}" ${allowed(value) ? '' : 'disabled'}>${text}</button>`;
    const options = month
      ? Array.from({length: 12}, (_, i) => option(ym(new Date(y, i, 1)), `${i + 1}月`, warekiMonth(y, i + 1))).join('')
      : WD.map(w => `<span aria-hidden="true">${w}</span>`).join('')
        + '<span></span>'.repeat(cursor.getDay())
        + daysOfMonth(cursor).map(d => option(key(d), d.getDate(), ymdw(d))).join('');
    dialog.innerHTML = `<div class="wareki-nav">${nav(-step, month ? '前年' : '前月')}<strong aria-live="polite">${month ? warekiYear(y) : warekiMonth(y, m + 1)}</strong>${nav(step, month ? '翌年' : '翌月')}</div>
      <div class="wareki-options${month ? ' months' : ''}">${options}</div>
      <div class="wareki-footer">${button.dataset.clear === 'true' ? '<button type="button" class="btn sm" data-clear>未設定にする</button>' : ''}<button type="button" class="btn sm" data-close>閉じる</button></div>`;
    if (focusStep != null) {
      const next = dialog.querySelector(`[data-step="${focusStep}"]:not(:disabled)`);
      (next || dialog.querySelector('[data-value]:not(:disabled)') || dialog.querySelector('[data-close]')).focus();
    }
  }
  dialog.addEventListener('click', e => {
    const action = e.target.closest('button');
    if (!action) return;
    if (action.hasAttribute('data-step')) {
      const step = Number(action.dataset.step);
      cursor = move(step);
      show(step);
      return;
    }
    if (action.hasAttribute('data-close')) return dialog.close();
    const value = action.hasAttribute('data-clear') ? '' : action.dataset.value;
    if (value == null || (value && !allowed(value))) return;
    dialog.close();
    if (!input.isConnected || value === input.value) return;
    input.value = value;
    const text = warekiFieldLabel(value, month, heading);
    button.firstElementChild.textContent = text;
    button.setAttribute('aria-label', label + ' ' + text);
    input.dispatchEvent(new Event('change', {bubbles: true}));
  });
  dialog.addEventListener('close', () => dialog.remove());
  show();
  document.body.appendChild(dialog);
  dialog.showModal();
  const selected = dialog.querySelector('[aria-pressed="true"]:not(:disabled)');
  if (selected) selected.focus();
}

function modal(html, wide) {

  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modalBg';
  bg.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  const f = bg.querySelector('input:not([type=checkbox]):not([type=hidden]),textarea'); if (f && !('ontouchstart' in window)) setTimeout(() => f.focus(), 30);
}

async function flush() {

/* =========================================================
   授与品（本番）：授与所のレジ端末と、職員の在庫・出数・品目の登録
   - レジ端末：授与所のiPadを「レジ端末」として登録すると、暗証番号なしでレジだけ開く
   - 会計はまず端末に保存してから送る。電波が悪くても、あとで自動で送り直す
   - 出数（レジ）と在庫（箱）は分けて扱い、数を合わせない（宮司が接客した分はレジに入らないため）
   ========================================================= */
const REG_QUEUE_KEY = 'shamu-reg-queue', REG_TODAY_KEY = 'shamu-reg-today', REG_ITEMS_KEY = 'shamu-reg-items';
const lsJson = (k, d) => { try { return JSON.parse(lsGet(k) || 'null') ?? d; } catch (e) { return d; } };
let REGI = { on: false, label: '', items: [], cart: {}, sending: false, err: '' };

const regDay = () => key(new Date());
function regToday() { const t = lsJson(REG_TODAY_KEY, null), d = regDay(); return t && t.date === d ? t : { date: d, sales: [] }; }
function regQueue() { return lsJson(REG_QUEUE_KEY, []); }

async function startReji(label) {
  REGI.on = true; REGI.label = label || REGI.label; REGI.items = lsJson(REG_ITEMS_KEY, []);
  S = S || { ui: loadUi() }; S.session = null;
  render();
  await regLoadItems();
  regFlush();
}
async function regLoadItems() {
  try { const r = await api('regItems'); REGI.items = r.items; REGI.label = r.label || REGI.label; REGI.err = ''; lsSet(REG_ITEMS_KEY, JSON.stringify(r.items)); }
  catch (e) {
    if (e.code === 'device') { REGI.on = false; P.device = null; lsSet(DEVICE_KEY, null); P.screen = 'register'; P.msg = 'この端末の登録が取り消されました。管理者に確認してください'; }
    else REGI.err = '受け口につながりません。前回の品目で動いています';
  }
  render();
}
/* 送れていない会計をまとめて送る（同じ会計は受け口で二重にならない） */
async function regFlush() {
  if (REGI.sending) return;
  let q = regQueue(); if (!q.length) return;
  REGI.sending = true;
  try {
    while (q.length) {
      const it = q[0]; REGI.inflight = it.undo ? null : it.id;
      if (it.undo) await api('regUndo', { id: it.id }); else await api('regSale', { sale: it });
      REGI.inflight = null;
      q = regQueue().filter(x => !(x.id === it.id && !!x.undo === !!it.undo)); lsSet(REG_QUEUE_KEY, JSON.stringify(q));
    }
    REGI.err = '';
  } catch (e) { REGI.inflight = null; REGI.err = '送れていない会計があります。電波が戻ると自動で送ります'; }
  finally { REGI.sending = false; if (REGI.on) render(); }
}

        : '<div class="empty" style="grid-column:1/-1">授与品がまだ登録されていません。<br>神社くんの「授与品 → 授与品の登録」で登録すると、ここに出ます。</div>'}</div>

/* =========================================================
   正月（2026-11-12 結合。仕様：../20261112_正月システム結合_仕様書.md）
   - 正月の画面は別ページ shogatsu.html（正月巫女デモを本番向けにしたもの）を画面の中に埋め込む
   - 保存は神社くんがまとめて行う：表 shogatsu（id と data）。埋め込んだページは SG_HOST を通して読み書きする
   - 見られるのは宮司・職員・臨時職員（2026-11-12 本人）。助勤のログインには出さない
   ========================================================= */
const SG_PAGE = PROD ? 'shogatsu.html' : 'shogatsu-demo.html';
const sgFrame = () => document.getElementById('sgFrame');
const SG_BOOK = { tok: undefined, d: null, p: null, cbs: [] };   // 正月の団体予約の読み込み（ログインごと）

  prod: PROD,
  rows() { if (!S.shogatsu) S.shogatsu = {}; return S.shogatsu; },
  /* 変えた行だけ受け取る（set：書いた行、del：消した行）。読み直しの間にURLから届いた行はそのまま残る */
  put(d) {
    const m = Object.assign({}, S.shogatsu || {}, (d && d.set) || {});
    ((d && d.del) || []).forEach(k => delete m[k]);
    S.shogatsu = m; save();
  },
  /* 神職の休み（ホームの休み申告）：日付 → 名前の一覧 */
  leaves() {
    const o = {}, nm = id => (HOSTS.find(h => h.id === id) || {}).name;

    return o;

  /* 臨時職員の出勤（ホーム）：日付 → 名前の一覧 */
  temps() {
    const o = {}, nm = id => (TEMP_STAFF.find(h => h.id === id) || {}).name;

  /* 正月の団体予約：分析に取り込んだ予約サイトのCSV（その年の分）から、日付→件数と取り込んだ日を返す（2026-11-12 Codex指摘）。
