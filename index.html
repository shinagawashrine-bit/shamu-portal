*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-2);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul{padding:0;list-style:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.small{font-size:12px}
.sp{flex:1}

.btn.act-btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;font-size:15px;font-weight:700;padding:0 14px;border-radius:10px;line-height:1.2;text-decoration:none;white-space:nowrap}

@media (max-width:900px){
  /* スマホ：見出しと月・週／予定を追加と休みを申告を同じ幅で並べる／月の移動 */

  .cal-r{display:contents}
  .cal-l{grid-column:1;grid-row:1}
  .cal-r .seg{grid-column:2;grid-row:1;justify-self:end}
  .cal-r > .add-ev{grid-column:1;grid-row:2;width:100%;align-self:start}
  .cal-r > .leave-box{grid-column:2;grid-row:2;align-items:stretch;align-self:start}
  .cal-r > .leave-box .btn{width:100%}
  .cal-r > .leave-box .leave-left{position:static;text-align:right;margin-top:4px}
  .cal-nav{grid-row:3 !important}
  .row.day-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;flex:1 1 100%}
  .day-acts > .btn{width:100%;padding:0 14px}
  .day-acts > .add-ev{grid-column:1/-1}
}.btn.add-ev{border-color:var(--brand);color:var(--brand)}
.ev.one{white-space:nowrap;text-overflow:ellipsis;padding-top:0;padding-bottom:0}.ev.one b,.ev.one > span:not(.ev-ic),.ev.one .ev-tx span{display:inline;margin-right:6px}
.date-pick{position:relative;display:inline-flex}.date-pick .cal-title{pointer-events:none}.date-over{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none}
.diary-h{flex-wrap:wrap;gap:8px}
.cell .top .dots.in-top{display:inline-flex;gap:2px;flex:none}
@keyframes swipedIn{from{opacity:.35}to{opacity:1}}.cal.swiped,#dayPanel.swiped{animation:swipedIn .2s ease-out}
.wk-mini{display:none}.ev .ev-ic{display:none}
@media (max-width:760px){

  .week-wrap .week{grid-template-columns:28px repeat(7,minmax(0,1fr))}
  .cal.week-wrap{overflow-x:hidden}

  .m-leave{color:var(--blue);background:var(--blue-soft)}.m-temp{color:var(--teal);background:var(--teal-soft)}.m-shuin{color:var(--green);background:var(--green-soft)}.m-honden{color:var(--honden);background:var(--honden-soft)}.m-sai{color:var(--shu);background:var(--shu-soft)}
  .wk-t{font-size:9px;padding-right:3px}

  .week .ev .ev-ic{display:grid;place-items:center;height:100%;min-height:14px;font-size:12px;font-weight:800;line-height:1}
  .week .ev.one{line-height:normal !important}
}

.ln.baito{background:var(--green-soft);color:var(--green)}
.ln span{overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin-top:10px;align-items:center}
.legend > span{display:inline-flex;align-items:center;gap:4px;line-height:1.3}
.legend .kd,.legend .off-b,.legend .mk{flex:none;margin:0}

/* week */
.week{display:grid;grid-template-columns:52px repeat(7,1fr)}
.wk-h{padding:8px 6px;border-bottom:1px solid var(--hair);border-left:1px solid var(--hair);cursor:pointer;min-height:96px}
.wk-h:hover{background:var(--bg-2)}
.wk-h.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.wk-h .dn{font-size:20px;font-weight:700}
.wk-h .dw{font-size:11px;font-weight:700;color:var(--text-2)}
.wk-h.sun .dn,.wk-h.hol .dn{color:var(--red)}
.wk-h.sat .dn{color:var(--sat)}
.wk-h.today .dn{color:var(--brand)}
.wk-col{position:relative;border-left:1px solid var(--hair)}
.wk-times{position:relative}
.wk-t{height:44px;font-size:10.5px;color:var(--text-3);text-align:right;padding-right:6px;transform:translateY(-7px)}
.wk-row{height:44px;border-bottom:1px solid var(--grid)}
.ev{position:absolute;left:3px;right:3px;border-radius:7px;padding:3px 6px;font-size:11px;line-height:1.3;overflow:hidden;border-left:3px solid}
.ev b{display:block;font-size:11px}
.ev.kigan{background:var(--brand-soft);border-color:var(--brand);color:var(--text)}
.ev.gaisai{background:var(--brand);border-color:var(--brand-h);color:#fff}
.ev.visit{background:var(--violet-soft);border-color:var(--violet);color:var(--text)}
.ev.out{background:var(--pink-soft);border-color:var(--pink);color:var(--text)}
.ev.sai{background:var(--shu-soft);border-color:var(--shu);color:var(--text)}
.ev{cursor:pointer}
.wk-shade{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;text-align:center;padding:8px}

/* day panel */
.day{position:sticky;top:18px}
.day-h{padding:18px 18px 14px;border-bottom:1px solid var(--hair)}
.day-h .dt{font-size:22px;font-weight:700;letter-spacing:.01em}
.day-h .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--text-2)}
.kfull{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.kfull .tag{font-size:11px}
.day-sec{padding:12px 18px;border-bottom:1px solid var(--hair)}
.day-sec:last-child{border-bottom:0}
.day-sec h4{font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:8px;display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.people{display:flex;gap:6px;flex-wrap:wrap}
.person{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 3px;font-size:12.5px;font-weight:600;background:var(--fill)}
.person.off{background:var(--blue-soft);color:var(--blue)}
.tl{position:relative;margin-left:44px}
.tl-row{height:30px;border-top:1px solid var(--grid);position:relative}
.tl-row span{position:absolute;left:-44px;top:-8px;font-size:10.5px;color:var(--text-3);width:38px;text-align:right}
.tl-row.half{border-top-style:dashed}
.tl-row.half span{display:none}
.tl .ev{left:4px;right:0}
.tl-now{position:absolute;left:-6px;right:0;height:2px;background:var(--red);z-index:3}
.tl-now::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.big-mode{border-radius:14px;padding:16px;text-align:center}
.big-mode b{display:block;font-size:17px;margin-bottom:4px}
.big-mode.uke{background:var(--s-uke);color:var(--text)}
.big-mode.hou{background:var(--s-hou)}
.big-mode.nok{background:var(--s-nok)}
.big-mode.off{background:var(--s-off)}
.mini-list li{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--hair)}
.mini-list li:last-child{border-bottom:0}

/* diary */
.diary{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.auto{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.auto div{background:var(--fill);border-radius:12px;padding:9px 12px}
.auto .l{font-size:11px;color:var(--text-2);font-weight:600;display:flex;gap:4px;align-items:center}
.auto .v{font-size:15px;font-weight:700;margin-top:2px}
.autotag{font-size:9.5px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:4px;padding:0 4px}
.past{border-radius:16px;border:1px solid var(--hair);padding:14px 16px;margin-bottom:12px;background:var(--card)}
.past .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.past .ph b{font-size:14px}
.past p{font-size:13.5px;white-space:pre-wrap}
.past .ag{font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:1px 8px}

/* board */
.post{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--hair);cursor:pointer}
.post:hover{background:var(--bg-2)}
.post:last-child{border-bottom:0}
.post .unread{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:7px;flex:none}
.post .unread.no{background:transparent}
.post h4{font-size:14px;font-weight:700}
.post p{font-size:12.5px;color:var(--text-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.reads{display:flex;gap:6px;flex-wrap:wrap}
.read{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 3px;font-size:12px;font-weight:600}
.read.y{background:var(--green-soft);color:var(--green)}
.read.n{background:var(--fill);color:var(--text-3)}

/* manual */
.manual{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.cats button{display:flex;width:100%;justify-content:space-between;border:0;background:transparent;padding:8px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text-2);text-align:left}
.cats button.on{background:var(--brand-soft);color:var(--brand)}
.man-item{padding:14px 16px;border-bottom:1px solid var(--hair);cursor:pointer}
.man-item:hover{background:var(--bg-2)}
.man-item:last-child{border-bottom:0}
.man-body{white-space:pre-wrap;font-size:14px;line-height:1.8}

/* juyo */
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.bar.warn i{background:var(--warn)}
.bar.red i{background:var(--red)}
.rank li{display:grid;grid-template-columns:22px 1fr 70px 64px 54px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13px}
.rank li:last-child{border-bottom:0}
.rank .n{font-weight:700;color:var(--text-3);text-align:center}
.abc{font-size:10px;font-weight:800;border-radius:4px;padding:0 5px;margin-left:6px}
.abc.A{background:var(--brand-soft);color:var(--brand)} .abc.B{background:var(--gold-soft);color:var(--gold)} .abc.C{background:var(--fill);color:var(--text-3)}
.order-sheet{background:#fff;color:#111;border:1px solid #ccc;border-radius:6px;padding:34px 38px;margin:0 auto 18px;max-width:760px;font-size:13px}
.order-sheet h2{text-align:center;font-size:22px;letter-spacing:.4em;margin-bottom:18px}
.order-sheet table{width:100%;border-collapse:collapse;margin-top:14px}
.order-sheet th,.order-sheet td{border:1px solid #999;padding:7px 9px}
.order-sheet th{background:#f3f3f3;font-weight:600}
.os-top{display:flex;justify-content:space-between;gap:20px}
.os-to{font-size:17px;border-bottom:1px solid #333;padding-bottom:4px;min-width:260px}

/* shift grid */
.sg{border-collapse:separate;border-spacing:0;font-size:12px}
.sg th,.sg td{border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);text-align:center;padding:0;height:34px;min-width:34px}
.sg th{font-size:11px;font-weight:700;color:var(--text-2);background:var(--card);position:sticky;top:0}
.sg th.sun,.sg th.hol{color:var(--red)} .sg th.sat{color:var(--sat)}
.sg td.name,.sg th.name{position:sticky;left:0;background:var(--card);text-align:left;padding:0 12px;min-width:150px;white-space:nowrap;z-index:1;font-weight:600}
.sg td.c{cursor:pointer;position:relative}
.sg td.c:hover{background:var(--bg-2)}
.sg td.need{background:var(--bg-2);font-weight:700}
.sg td.short{color:var(--red)}
.sg td.weekend{background:color-mix(in srgb,var(--fill) 50%,transparent)}
.mk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-weight:800;font-size:12px}
.mk.ok{color:var(--green)}
.mk.ng{color:var(--text-3)}
.mk.as{background:var(--green);color:#fff}
.mk.as.req{box-shadow:0 0 0 2px var(--green-soft)}

/* tasks */
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:var(--fill);border-radius:16px;padding:10px}
.kcol h4{font-size:12.5px;font-weight:700;color:var(--text-2);padding:4px 6px 10px;display:flex;gap:6px;align-items:center}
.tcard{background:var(--card);border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--hair)}
.tcard h5{font-size:13.5px;font-weight:600;margin:0 0 6px}
.tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
.mail{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px}
.mail:last-child{border-bottom:0}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13.5px}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.chk.done span{color:var(--text-3);text-decoration:line-through}

/* seasons */
.ycal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mcal h5{font-size:13px;font-weight:700;margin:0 0 6px}
.mcal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mcal .g div{aspect-ratio:1;display:grid;place-items:center;font-size:10.5px;border-radius:5px;cursor:pointer}
.mcal .g div.h{font-weight:700;color:var(--text-3);cursor:default}
.mcal .g div.sun{color:var(--red)} .mcal .g div.sat{color:var(--sat)}
.mcal .g div.uke{background:var(--s-uke-b);color:#fff} .mcal .g div.hou{background:var(--s-hou-b);color:#fff} .mcal .g div.nok{background:var(--s-nok-b);color:#fff} .mcal .g div.off{background:var(--s-off-b);color:#fff}
.mcal .g div:not(.h):not(.e):hover{outline:2px solid var(--brand)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal{background:var(--card);border-radius:20px;box-shadow:var(--shadow-2);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--card);z-index:2}
.modal-h h3{font-size:16px;font-weight:700}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--hair);position:sticky;bottom:0;background:var(--card)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow-2);animation:fade .2s}

/* baito view */
.bv{max-width:760px;margin:0 auto;padding:0 16px 60px}
.bv-top{display:flex;align-items:center;gap:10px;padding:16px 0}
.bv-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bv-cal .h{text-align:center;font-size:11px;font-weight:700;color:var(--text-2)}
.bv-d{aspect-ratio:1/1.05;border-radius:12px;background:var(--card);border:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:2px;user-select:none}
.bv-d b{font-size:15px}
.bv-d.sun b,.bv-d.hol b{color:var(--red)} .bv-d.sat b{color:var(--sat)}
.bv-d .m{font-size:13px;font-weight:800;height:16px}
.bv-d.ok{background:var(--green-soft);border-color:var(--green)} .bv-d.ok .m{color:var(--green)}
.bv-d.maybe{background:var(--gold-soft);border-color:var(--gold)} .bv-d.maybe .m{color:var(--gold)}
.bv-d.ng{background:var(--fill)} .bv-d.ng .m{color:var(--text-3)}
.bv-d.e{visibility:hidden}

/* print */
@media print{
  body{background:#fff}
  .side,.topbar,.tabbar,.no-print,.modal-h,.modal-f{display:none !important}
  .modal-bg{position:static;background:none;padding:0;display:block}
  .modal{box-shadow:none;width:auto;max-height:none;overflow:visible}
  .app{display:block} .main{display:none}
  .order-sheet{border:0;page-break-after:always;max-width:none}
}

/* ── responsive ── */
@media (max-width:1240px){
  .cell .wx-mini{display:none}
  .home{grid-template-columns:minmax(0,1fr) 320px}
  .grid4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:1080px){
  .app{grid-template-columns:68px 1fr}
  .side{padding:14px 8px}
  .brand{justify-content:center;padding-bottom:12px}
  .brand div,.nav-g,.nav a .lbl,.nav a .badge,.nav a .ext,.side-foot .me select,.side-foot .me .nm,.linkbtn .lbl{display:none}
  .nav a{justify-content:center;position:relative}
  .nav a.has-badge::after{content:"";position:absolute;top:6px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
  .home{grid-template-columns:1fr}
  .day{position:static}
  .diary{grid-template-columns:1fr}
  .ycal{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  body{font-size:15px}
  .app{display:block}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
  .topbar b{font-size:15px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10px;font-weight:600;color:var(--text-2);text-decoration:none;position:relative}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--brand)}
  .tabbar a .badge{position:absolute;top:2px;left:calc(50% + 6px);height:16px;min-width:16px;font-size:10px}
  .main{padding:14px 16px 96px}
  .page-h h1{font-size:21px}
  .home{display:flex;flex-direction:column-reverse;gap:14px;align-items:stretch}
  .cell{min-height:66px;padding:4px 3px}
  .d-num{width:22px;height:22px;font-size:12.5px}
  .rokuyo{font-size:9px}
  .kd{width:13px;height:13px;font-size:8px;border-width:1px}
  .hol-name,.wx-mini{display:none}
  .lines .ln span,.cell .season{display:none}
  .day{width:100%}
  .lines{flex-direction:row;flex-wrap:wrap;gap:2px}
  .ln{padding:0 3px;font-size:9px;border-radius:1px}
  .cell .top{flex-wrap:wrap;justify-content:flex-start;gap:1px;min-height:0}
  .cell .top .sp{display:none}
  .row2{justify-content:flex-end}
  .off-b{height:13px;font-size:8px;padding:0 2px;border-radius:3px}
  .offs{flex:0 1 auto;justify-content:center}
  .day-names{display:none}
  .leave-box{align-items:flex-start}
  .cal-bar h2{font-size:19px;min-width:0}
  .grid2,.grid3,.grid4,.auto{grid-template-columns:1fr 1fr}
  .grid3,.grid2{grid-template-columns:1fr !important}
  .page-h .sp{display:none}
  .manual{grid-template-columns:1fr}
  .cats{display:flex;overflow-x:auto;gap:4px}
  .cats button{white-space:nowrap;width:auto}
  .kanban{grid-template-columns:1fr}
  .ycal{grid-template-columns:repeat(2,1fr)}
  .rank li{grid-template-columns:20px 1fr 54px 54px;}
  .rank li .bar{display:none}
  .order-sheet{padding:20px}
  .os-top{flex-direction:column}
  .week{grid-template-columns:40px repeat(7,minmax(46px,1fr))}
  .week-wrap{overflow-x:auto}
}
/* メニュー（スマホ）ではラベルを常に表示 */
.modal .nav a{justify-content:flex-start}
.modal .nav a .lbl,.modal .nav-g{display:block}
.modal .nav a.has-badge::after{display:none}
/* 掲示板：未読 */
.post.isnew{background:var(--brand-soft)}
.post.isnew h4{color:var(--brand)}
.post.sel{box-shadow:inset 4px 0 0 var(--brand)}
/* 申し送り */
.handover{border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.6}
.handover.compact{margin:0}
/* ログイン */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(420px,100%);padding:24px}
.login-people{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.login-person{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 8px;font-weight:600;font-size:14px}
.login-person:hover{border-color:var(--brand);background:var(--brand-soft)}
.pin-dots{display:flex;justify-content:center;gap:14px;margin:12px 0 4px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--text-3)}
.pin-dots span.on{background:var(--brand);border-color:var(--brand)}
.login-err{text-align:center;color:var(--red);font-size:12.5px;min-height:20px;font-weight:600}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:6px auto 0}
.keypad button{height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:600}
.keypad button:active{background:var(--fill)}
.keypad button:disabled{opacity:.4}
.tl-row.off-hours,.wk-row.off-hours{background:var(--bg-2)}
.bv-d.my-shuin{background:var(--green);border-color:var(--green)} .bv-d.my-shuin b,.bv-d.my-shuin .m{color:#fff}
.bv-d.my-honden{background:var(--honden);border-color:var(--honden)} .bv-d.my-honden b,.bv-d.my-honden .m{color:#fff}
.bv-d.my-shuin .m,.bv-d.my-honden .m{font-size:11px}
.bv-d.is-today{box-shadow:0 0 0 2px var(--brand)}
.bv-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.bv-tiles .bv-d{aspect-ratio:auto;padding:8px 4px}
.login-people.compact{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.login-person.compact{flex-direction:row;justify-content:flex-start;padding:8px 10px;border-radius:12px;font-size:13.5px;text-align:left}
.lp-name{display:flex;flex-direction:column;min-width:0}
.allday{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.ln.temp{background:var(--teal-soft);color:var(--teal)}
.person.temp-on{background:var(--teal-soft);color:var(--teal)}
.person.temp-off{opacity:.6}
.mini-btn{border:1px solid var(--line);background:var(--card);color:var(--text-2);border-radius:6px;padding:0 7px;font-size:10.5px;font-weight:600;line-height:18px;height:20px;cursor:pointer}
.mini-btn:hover{color:var(--brand);border-color:var(--brand)}
.chip.mine-on{background:var(--brand);border-color:var(--brand);color:#fff}
/* 外出の帯：白＝移動、ピンク＝先方にいる時間 */
.ev.has-travel{padding:0}
.ev-dep{padding:2px 6px;font-size:10.5px;font-weight:700;color:var(--pink);opacity:.85}

<body>
<div id="root"></div>
<script>
'use strict';
/* 受け口（Apps Script ウェブアプリ）のURL。空のときは仮データのデモとして動く */
const API_URL = 'https://script.google.com/macros/s/AKfycbx-QNVOKsc6rMszEqwt9BjpfjqU0sIm2wOtfTBnyazvxA4PJHhNqOkaMszVWZi-JUWLgw/exec';
const PROD = !!API_URL;
/* =========================================================
   品川神社 社務ポータル（デモ）
   - データはすべて仮。ブラウザ内（localStorage）に保存。
   - 暦（六曜・一粒万倍日・天赦日・戌の日）はプログラムで計算した値。
   ========================================================= */

/* ── 日付ユーティリティ ── */
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const mdw = d => `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`;
const ymdw = d => `${d.getFullYear()}年${mdw(d)}`;
const TODAY = (() => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); })();
const TK = key(TODAY);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => n.toLocaleString('ja-JP');
const tmin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const tstr = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;

/* 疑似乱数（仮データを毎回同じにするため） */
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

/* ── 祝日（2025〜2027） ── */
const HOLIDAYS = {
  '2025-01-01': '元日', '2025-01-13': '成人の日', '2025-02-11': '建国記念の日', '2025-02-23': '天皇誕生日', '2025-02-24': '振替休日', '2025-03-20': '春分の日', '2025-04-29': '昭和の日', '2025-05-03': '憲法記念日', '2025-05-04': 'みどりの日', '2025-05-05': 'こどもの日', '2025-05-06': '振替休日', '2025-07-21': '海の日', '2025-08-11': '山の日', '2025-09-15': '敬老の日', '2025-09-23': '秋分の日', '2025-10-13': 'スポーツの日', '2025-11-03': '文化の日', '2025-11-23': '勤労感謝の日', '2025-11-24': '振替休日',
  '2026-01-01': '元日', '2026-01-12': '成人の日', '2026-02-11': '建国記念の日', '2026-02-23': '天皇誕生日', '2026-03-20': '春分の日', '2026-04-29': '昭和の日', '2026-05-03': '憲法記念日', '2026-05-04': 'みどりの日', '2026-05-05': 'こどもの日', '2026-05-06': '振替休日', '2026-07-20': '海の日', '2026-08-11': '山の日', '2026-09-21': '敬老の日', '2026-09-22': '国民の休日', '2026-09-23': '秋分の日', '2026-10-12': 'スポーツの日', '2026-11-03': '文化の日', '2026-11-23': '勤労感謝の日',
  '2027-01-01': '元日', '2027-01-11': '成人の日', '2027-02-11': '建国記念の日', '2027-02-23': '天皇誕生日', '2027-03-21': '春分の日', '2027-03-22': '振替休日', '2027-04-29': '昭和の日', '2027-05-03': '憲法記念日', '2027-05-04': 'みどりの日', '2027-05-05': 'こどもの日', '2027-07-19': '海の日', '2027-08-11': '山の日', '2027-09-20': '敬老の日', '2027-09-23': '秋分の日', '2027-10-11': 'スポーツの日', '2027-11-03': '文化の日', '2027-11-23': '勤労感謝の日'
};
const isWeekend = d => d.getDay() === 0 || d.getDay() === 6 || !!HOLIDAYS[key(d)];

/* =========================================================
   暦の計算
   - 朔（新月）: Meeus『Astronomical Algorithms』49章
   - 太陽黄経: 同25章（低精度式, 誤差約0.01度）
   - 旧暦の月: 中気を含む月に月番号を付け、含まない月は閏月
   ========================================================= */
const KOYOMI = (() => {
  const RAD = Math.PI / 180;
  const DT = 69 / 86400;            // ΔT（約69秒）
  const JST = 9 / 24;
  const jdn = (y, m, d) => { const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3; return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045; };
  const jdnOf = d => jdn(d.getFullYear(), d.getMonth() + 1, d.getDate());
  const jstDay = jde => Math.floor(jde - DT + JST + 0.5);   // JDE → JSTの日のJDN

  function sunLon(jde) {
    const T = (jde - 2451545) / 36525;
    const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * RAD;
    const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
    const om = (125.04 - 1934.136 * T) * RAD;
    let l = L0 + C - 0.00569 - 0.00478 * Math.sin(om);
    return ((l % 360) + 360) % 360;
  }
  function termJDE(year, lon) {      // 黄経 lon になる時刻（year年の春分を起点に探索）
    let j = jdn(year, 3, 20) + ((lon % 360) / 360) * 365.2422;
    for (let i = 0; i < 30; i++) {
      let diff = lon - sunLon(j);
      diff = ((diff + 540) % 360) - 180;
      j += diff / 0.98564736;
      if (Math.abs(diff) < 1e-6) break;
    }
    return j;
  }
  function newMoon(k) {
    const T = k / 1236.85, T2 = T * T, T3 = T2 * T, T4 = T3 * T;
    let jde = 2451550.09766 + 29.530588861 * k + 0.00015437 * T2 - 0.00000015 * T3 + 0.00000000073 * T4;
    const E = 1 - 0.002516 * T - 0.0000074 * T2;
    const M = (2.5534 + 29.1053567 * k - 0.0000014 * T2 - 0.00000011 * T3) * RAD;
    const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T2 + 0.00001238 * T3 - 0.000000058 * T4) * RAD;
    const F = (160.7108 + 390.67050284 * k - 0.0016118 * T2 - 0.00000227 * T3 + 0.000000011 * T4) * RAD;
    const Om = (124.7746 - 1.56375588 * k + 0.0020672 * T2 + 0.00000215 * T3) * RAD;
    const s = Math.sin;
    jde += -0.4072 * s(Mp) + 0.17241 * E * s(M) + 0.01608 * s(2 * Mp) + 0.01039 * s(2 * F) + 0.00739 * E * s(Mp - M) - 0.00514 * E * s(Mp + M)
      + 0.00208 * E * E * s(2 * M) - 0.00111 * s(Mp - 2 * F) - 0.00057 * s(Mp + 2 * F) + 0.00056 * E * s(2 * Mp + M) - 0.00042 * s(3 * Mp)
      + 0.00042 * E * s(M + 2 * F) + 0.00038 * E * s(M - 2 * F) - 0.00024 * E * s(2 * Mp - M) - 0.00017 * s(Om) - 0.00007 * s(Mp + 2 * M)
      + 0.00004 * s(2 * Mp - 2 * F) + 0.00004 * s(3 * M) + 0.00003 * s(Mp + M - 2 * F) + 0.00003 * s(2 * Mp + 2 * F) - 0.00003 * s(Mp + M + 2 * F)
      + 0.00003 * s(Mp - M + 2 * F) - 0.00002 * s(Mp - M - 2 * F) - 0.00002 * s(3 * Mp + M) + 0.00002 * s(4 * Mp);
    return jde;
  }

  // 2023〜2029年の節気・朔を前計算
  const terms = [];   // {day(JDN), lon}
  for (let y = 2023; y <= 2029; y++) for (let i = 0; i < 24; i++) { const lon = i * 15; terms.push({ day: jstDay(termJDE(y, lon)), lon }); }
  terms.sort((a, b) => a.day - b.day);
  const moons = [];
  const k0 = Math.floor((2023 - 2000) * 12.3685) - 2;
  for (let k = k0; k < k0 + 90; k++) moons.push(jstDay(newMoon(k)));

  // 旧暦の月番号（閏月は前月と同じ番号）
  const months = [];
  for (let i = 0; i < moons.length - 1; i++) {
    const a = moons[i], b = moons[i + 1];
    const chu = terms.find(t => t.lon % 30 === 0 && t.day >= a && t.day < b);
    let m, leap = false;
    if (chu) m = ((chu.lon / 30 + 2) % 12) || 12;
    else { m = months.length ? months[months.length - 1].m : 0; leap = true; }
    months.push({ start: a, end: b, m, leap });
  }
  const ROKU = ['大安', '赤口', '先勝', '友引', '先負', '仏滅'];
  const STEM = '甲乙丙丁戊己庚辛壬癸', BR = '子丑寅卯辰巳午未申酉戌亥';
  // 節月ごとの一粒万倍日の十二支（1=立春〜 … 12=小寒〜）
  const ICHI = { 1: [1, 6], 2: [2, 9], 3: [0, 3], 4: [3, 4], 5: [5, 6], 6: [9, 6], 7: [0, 7], 8: [3, 8], 9: [9, 6], 10: [9, 10], 11: [11, 0], 12: [3, 0] };
  const TEN = { spring: 14, summer: 30, autumn: 44, winter: 0 };   // 戊寅・甲午・戊申・甲子
  const cache = {};

  /* 季節の行事（日本の暦）：二十四節気の主なもの・節分・彼岸・八十八夜・土用の丑・五節句・お盆・十五夜など */
  const SEKKI = { 0: '春分', 45: '立夏', 90: '夏至', 135: '立秋', 180: '秋分', 225: '立冬', 270: '冬至', 315: '立春' };
  const termDay = (y, lon) => terms.find(t => t.lon === lon && t.day >= jdn(y, 1, 1) && t.day <= jdn(y, 12, 31))?.day;
  const FIXED = { '1-7': '七草', '1-11': '鏡開き', '3-3': '桃の節句', '5-5': '端午の節句', '7-7': '七夕', '9-9': '重陽の節句', '12-31': '大晦日',
    '8-13': 'お盆（迎え火）', '8-14': 'お盆', '8-15': 'お盆', '8-16': 'お盆（送り火）' };   // お盆は8月（本人指定）
  function bunkaOf(d, j, br, lunar) {
    const y = d.getFullYear(), out = [];
    const t = terms.find(x => x.day === j); if (t && SEKKI[t.lon]) out.push(SEKKI[t.lon]);
    const risshun = termDay(y, 315), shunbun = termDay(y, 0), shubun = termDay(y, 180), risshu = termDay(y, 135);
    if (risshun && j === risshun - 1) out.push('節分');
    [[shunbun, '春'], [shubun, '秋']].forEach(([c, s]) => { if (!c) return; if (j === c - 3) out.push(s + '彼岸入り'); if (j === c) out.push('彼岸の中日'); if (j === c + 3) out.push(s + '彼岸明け'); });
    if (risshun && j === risshun + 87) out.push('八十八夜');
    if (risshu && j >= risshu - 18 && j < risshu && br === 1) out.push('土用の丑の日');
    if (lunar && !lunar.leap && lunar.m === 8 && lunar.d === 15) out.push('十五夜');
    if (lunar && !lunar.leap && lunar.m === 9 && lunar.d === 13) out.push('十三夜');
    if (d.getMonth() === 1 && br === 6 && d.getDate() <= 12) out.push('初午');   // 2月最初の午の日
    const f = FIXED[`${d.getMonth() + 1}-${d.getDate()}`]; if (f) out.push(f);
    return out;
  }
  function get(d) {
    const k = key(d); if (cache[k]) return cache[k];
    const j = jdnOf(d);
    const kan = ((j + 49) % 60 + 60) % 60;          // 0 = 甲子（2000-01-01 = 戊午 で検算）
    const br = kan % 12;
    const lm = months.find(x => j >= x.start && j < x.end);
    let roku = '', lunar = null;
    if (lm) { const ld = j - lm.start + 1; roku = ROKU[(lm.m + ld) % 6]; lunar = { m: lm.m, d: ld, leap: lm.leap }; }
    const setsu = [...terms].reverse().find(t => t.lon % 30 === 15 && t.day <= j);
    let ichi = false, ten = false;
    if (setsu) {
      const sm = ((setsu.lon - 315 + 360) % 360) / 30 + 1;
      ichi = ICHI[sm].includes(br);
      const season = sm <= 3 ? 'spring' : sm <= 6 ? 'summer' : sm <= 9 ? 'autumn' : 'winter';
      ten = kan === TEN[season];
    }
    return (cache[k] = { roku, inu: br === 10, ichi, ten, kanshi: STEM[kan % 10] + BR[br], lunar, bunka: bunkaOf(d, j, br, lunar) });
  }
  return { get };
})();

/* ── 天気（Open-Meteo, 北品川付近） ── */
const LAT = 35.6187, LON = 139.7403;
const WX = {};       // key -> {code,tmax,tmin,prec,cloud,real}
const wxKind = w => !w ? null : (w.prec >= 1 ? (w.code >= 71 && w.code <= 77 ? 'snow' : 'rain') : (w.cloud != null ? (w.cloud >= 70 ? 'cloud' : 'sun') : (w.code <= 2 ? 'sun' : 'cloud')));
const WX_LABEL = { sun: '晴れ', cloud: 'くもり', rain: '雨', snow: '雪' };
const WX_ICON = { sun: '☀️', cloud: '☁️', rain: '☂️', snow: '❄️' };
async function loadWeather() {
  const p = 'daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,cloud_cover_mean&timezone=Asia%2FTokyo';
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&past_days=45&forecast_days=16&${p}`);
    const j = await r.json();
    j.daily.time.forEach((t, i) => { WX[t] = { code: j.daily.weather_code[i], tmax: j.daily.temperature_2m_max[i], tmin: j.daily.temperature_2m_min[i], prec: j.daily.precipitation_sum[i] ?? 0, cloud: j.daily.cloud_cover_mean[i], real: true }; });
    return true;
  } catch (e) { return false; }
}
/* 過去の日報用：記録が無い日は仮の天気 */
function fakeWx(k) {
  const r = rng(hashStr('wx' + k)), d = parse(k), m = d.getMonth();
  const base = [8, 9, 13, 18, 22, 25, 29, 31, 27, 21, 16, 11][m];
  const x = r(), kind = x < 0.22 ? 'rain' : x < 0.5 ? 'cloud' : 'sun';
  const tmax = Math.round(base + (r() - 0.5) * 6);
  return { kind, tmax, tmin: tmax - 6 - Math.round(r() * 3) };
}
function wxOf(k) {
  const w = WX[k];
  if (w) return { kind: wxKind(w), tmax: Math.round(w.tmax), tmin: Math.round(w.tmin), real: true };
  return k <= TK ? { ...fakeWx(k), real: false } : null;
}

/* =========================================================
   マスタ（仮）
   ========================================================= */
const STAFF = [
  { id: 'katsushi', name: '勝史', color: '#9c545b' },
  { id: 'suzuki', name: '鈴木', color: '#2f6fd0' },
  { id: 'imai', name: '今井', color: '#2e8b57' }
];
const staffById = id => [...HOSTS, ...TEMP_STAFF].find(s => s.id === id);   // 宮司・臨時職員も引ける（休み・シフトの対象は STAFF の3人だけ）
/* 臨時職員：休みではなく出勤を登録する */
const TEMP_STAFF = [{ id: 'kawabe', name: '川辺', color: '#0f7f6e' }, { id: 'nakajima', name: '中島', color: '#5b6fb5' }];
/* 来訪者の対応者（職員＋宮司）。宮司はログインしない */
const HOSTS = [{ id: 'guji', name: '宮司', color: '#4a2470' }, ...STAFF];   // 名前は必ず 宮司・勝史・鈴木・今井 の順
const hostName = id => HOSTS.find(h => h.id === id)?.name || '';
/* 外出する人（複数可） */
const hostOrder = id => HOSTS.findIndex(h => h.id === id);
const outStaff = o => [...(o.staffs || [o.staff])].sort((a, b) => hostOrder(a) - hostOrder(b));
const outNames = o => outStaff(o).map(hostName).join('・');
const outTimes = o => { const s = tmin(o.start), tr = o.travel || 0, bf = tr ? (o.buffer ?? 15) : 0, e = s + o.dur, direct = s < 1020 && e > 1020; return { depart: s - tr - bf, start: s, end: e, shownEnd: direct ? 1020 : e, direct, travel: tr, buffer: bf }; };
const AV_COLORS = ['#c27c2c', '#7a5bb5', '#2a8c8c', '#b5487a', '#5b7fb5', '#8c6b2a'];

/* 受付区分・時期 */
const MODES = {
  uke: { label: '受付順', long: '予約なし・受付順', cls: 'uke' },
  hou: { label: '法人のみ', long: '法人のみ（個人祈願は受付不可）', cls: 'hou' },
  nok: { label: '祈願なし', long: '祈願なし', cls: 'nok' },
  off: { label: '休（全員）', long: '休み（全員）', cls: 'off' }
};
const SEASON_TYPES = {
  shichigosan: { label: '七五三', mode: 'uke' },
  shogatsu: { label: '正月', mode: 'uke' },
  shogatsu_hou: { label: '正月（平日）', mode: 'hou' },
  reitaisai: { label: '例大祭', mode: 'nok' }
};
/* 例大祭：6月7日に最も近い日曜日と、その前の金・土 */
function reitaisaiDays(y) {
  const b = new Date(y, 5, 7); let best = null;
  for (let i = -3; i <= 3; i++) { const d = addDays(b, i); if (d.getDay() === 0) best = d; }
  return [addDays(best, -2), addDays(best, -1), best].map(key);
}

/* =========================================================
   状態（ブラウザ内保存）
   ========================================================= */
const STORE_KEY = 'shamu-portal-demo-v15';
let S;
/* PDFなどのファイルはブラウザ内のデータベース（IndexedDB）に保存。使えない場合はページを閉じるまで一時的に保持 */
const FILES = (() => {
  const mem = new Map(); let dbp = null;

   ========================================================= */
let calCursor = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
let selDay = TK;

function koyomiBadges(k) {
  const ky = KOYOMI.get(parse(k));
  const dots = (ky.inu ? '<span class="kd inu" title="戌の日">戌</span>' : '') + (ky.ichi ? '<span class="kd ichi" title="一粒万倍日">一</span>' : '') + (ky.ten ? '<span class="kd ten" title="天赦日">天</span>' : '');
  return `<div class="koyomi"><span class="rokuyo${ky.roku === '大安' ? ' taian' : ''}">${ky.roku}</span>${dots ? `<span class="dots">${dots}</span>` : ''}</div>`;
}
function offBadges(k) {
  const s = seasonOf(k);
  if (s && s.mode === 'off') return '<span class="offs"></span>';
  const lv = leavesOn(k);
  return `<span class="offs"${lv.length ? ` title="休み：${lv.map(id => staffById(id).name).join('・')}"` : ''}>${lv.map(id => `<span class="off-b">${staffById(id).name}</span>`).join('')}</span>`;
}
function kDots(ky) {
  return (ky.inu ? '<span class="kd inu" title="戌の日">戌</span>' : '') + (ky.ichi ? '<span class="kd ichi" title="一粒万倍日">一</span>' : '') + (ky.ten ? '<span class="kd ten" title="天赦日">天</span>' : '');
}
function cellLines(k) {
  const L = S.ui.layers, out = [];
  if (mineOnly()) {
    ritualsOn(k).forEach(r => out.push(`<div class="ln sai"><i>祭</i><span>${esc(r.name)}</span></div>`));
    if (leavesOn(k).includes(S.me)) out.push('<div class="ln leave"><i>休</i><span>休み</span></div>');
    if (tempOn(k).some(t => t.id === S.me)) out.push('<div class="ln temp"><i>臨</i><span>出勤</span></div>');
    visitsOn(k).filter(v => v.host === S.me).forEach(v => out.push(`<div class="ln visit"><i>来</i><span>${esc(v.who)}</span></div>`));
    outingsOn(k).filter(o => outStaff(o).includes(S.me)).forEach(o => { const t = outTimes(o); out.push(`<div class="ln out"><i>出</i><span>${tstr(t.depart)}発 ${esc(o.place)}</span></div>`); });
    return out.join('');
  }
  const rs = resOn(k), kg = rs.filter(r => r.type !== '外祭'), gs = rs.filter(r => r.type === '外祭');
  if (L.leave) { const tw = tempOn(k); if (tw.length) out.push(`<div class="ln temp"><i>臨</i><span>${tw.map(t => t.name).join('・')}</span></div>`); }
  if (L.sai) ritualsOn(k).forEach(r => out.push(`<div class="ln sai"><i>祭</i><span>${esc(r.name)}</span></div>`));
  if (L.kigan) {
    if (kg.length) out.push(`<div class="ln kigan"><i>祈</i><span>祈願 ${kg.length}件</span></div>`);
    gs.forEach(g => out.push(`<div class="ln kigan" data-act="evDetail" data-kind="gaisai" data-id="${g.id}" title="申込用紙を開く"><i>外</i><span>外祭 ${g.start}</span></div>`));
  }
  if (L.visit) visitsOn(k).forEach(v => out.push(`<div class="ln visit"><i>来</i><span>${esc(v.who)}</span></div>`));
  if (L.out) outingsOn(k).forEach(o => { const t = outTimes(o); out.push(`<div class="ln out"><i>出</i><span>${tstr(t.depart)}発 ${outNames(o)} ${esc(o.place)}</span></div>`); });
  if (L.baito) {
    const sh = regularsOn(k, 'shuin'), hd = regularsOn(k, 'honden');
    if (sh.length) out.push(`<div class="ln shuin"><i>朱印</i><span>${sh.map(r => shortName(r.name)).join('・')}</span></div>`);
    if (hd.length) out.push(`<div class="ln honden"><i>本殿</i><span>${hd.map(r => shortName(r.name)).join('・')}</span></div>`);
  }
  const max = 4;
  return out.length > max ? out.slice(0, max - 1).join('') + `<div class="ln" style="color:var(--text-3)"><span>ほか${out.length - max + 1}件</span></div>` : out.join('');
}
function monthView() {
  const first = calCursor, start = addDays(first, -first.getDay());
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const weeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  const L = S.ui.layers;
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i), k = key(d), s = seasonOf(k), hol = HOLIDAYS[k], ky = KOYOMI.get(d);
    const w = wxOf(k), dots = L.koyomi ? kDots(ky) : '';
    const cls = ['cell', d.getMonth() !== first.getMonth() ? 'out' : '', d.getDay() === 0 ? 'sun' : '', d.getDay() === 6 ? 'sat' : '', hol ? 'hol' : '', k === TK ? 'today' : '', k === selDay ? 'sel' : '', s ? 'bg-' + MODES[s.mode].cls : ''].join(' ');
    const names = hol || (L.bunka && ky.bunka.length);   // 祝日・季節の行事の名前があるときだけ2段目を使う。暦の丸だけなら日付の行に入れる（予定が下にずれないように）

      </div>

      <div class="legend">
        <span><span class="off-b">鈴木</span>青＝休みの職員</span><span><span class="bunka" style="font-size:11px">節分</span> 季節の行事</span>
        <span><span class="kd inu">戌</span>戌の日</span><span><span class="kd ichi">一</span>一粒万倍日</span><span><span class="kd ten">天</span>天赦日</span>
        <span><span class="season uke">受付順</span> 予約なし</span><span><span class="season hou">法人のみ</span></span><span><span class="season nok">祈願なし</span></span>

/* 外出の「だれが」1行分（宮司も選べる。＋で複数人） */

    <div class="grid3" style="grid-template-columns:1.4fr 1fr 1fr"><div class="field"><label>日付</label><input type="date" class="input" id="evDate" value="${k}"></div><div class="field"><label>開始（先方での開始）</label>${tsel('evStart', '10:00')}</div><div class="field"><label>長さ</label>${dsel('evDur', 60)}</div></div>

function leaveModal(k) {

    <div class="field"><label>だれの休み</label><select class="input" id="lvWho">${STAFF.map(s => `<option value="${s.id}" ${s.id === (isGuji() ? 'katsushi' : S.me) ? 'selected' : ''}>${s.name}</option>`).join('')}</select></div>

/* =========================================================
   日報
   ========================================================= */
let diaryDay = TK, diaryQ = '';
/* 申し送り：前の日（7日以内）の日報の「明日への申し送り」。対応済み、またはタスクにして完了したら消える */
const noteTask = e => e.nextTask && S.tasks.find(t => t.id === e.nextTask);
const noteResolved = e => e.nextDone || (noteTask(e) && noteTask(e).status === 'done');
function prevNote(k) {
  for (let i = 1; i <= 7; i++) { const kk = key(addDays(parse(k), -i)), e = S.diary[kk]; if (e && e.next && e.next.trim() && !noteResolved(e)) return { date: kk, text: e.next, by: e.by, e }; }
  return null;
}
function noteCard(k, compact) {
  const n = prevNote(k); if (!n) return '';
  return `<div class="handover${compact ? ' compact' : ''}"><div class="row" style="gap:6px"><span class="small" style="font-weight:700;color:var(--brand)">申し送り（${md(parse(n.date))} ${staffById(n.by)?.name || ''}）</span><span class="sp"></span>
    <button class="mini-btn" data-act="noteDone" data-k="${n.date}">対応済</button></div>
    <div style="white-space:pre-wrap;margin-top:4px">${esc(n.text)}</div></div>`;
}
/* 祈願の件数：予約台帳の予約から自動で数える（外祭は除く）。本番は予約台帳とつながってから数え始める */
const kiganOn = k => resOn(k).filter(r => r.type !== '外祭').length;
const kiganMonth = k => { let n = 0; for (let d = new Date(parse(k).getFullYear(), parse(k).getMonth(), 1); key(d) <= k; d = addDays(d, 1)) n += kiganOn(key(d)); return n; };
const kiganReady = () => !PROD || S.res.length > 0;
function autoInfo(k) {
  const d = parse(k), ky = KOYOMI.get(d), w = wxOf(k), s = seasonOf(k), e = S.diary[k];
  const rs = resOn(k).filter(r => r.type !== '外祭');
  const wx = e && e.wx ? e.wx : w;
  return { d, ky, wx, s, kigan: rs.length || (e ? e.kigan : 0), visits: visitsOn(k).length, juyo: e ? e.juyo : (k === TK ? 64 : null) };
}
function pastCard(k, label) {
  const e = S.diary[k], d = parse(k), ky = KOYOMI.get(d);
  if (!e) return `<div class="past"><div class="ph"><span class="ag">${label}</span><b>${ymdw(d)}</b></div><p class="muted small">この日の日報はありません</p></div>`;
  const wx = e.wx || fakeWx(k);
  return `<div class="past"><div class="ph"><span class="ag">${label}</span><b>${ymdw(d)}</b><span class="sp"></span><span class="small muted">${WX_ICON[wx.kind]} ${wx.tmax}°・${ky.roku}${ky.inu ? '・戌' : ''}</span></div>
    <div class="row small muted" style="gap:12px;margin-bottom:6px"><span>祈願 <b class="num" style="color:var(--text)">${PROD ? (kiganReady() ? kiganOn(k) : '—') : e.kigan}</b>件</span>${PROD ? '' : `<span>授与品 <b class="num" style="color:var(--text)">${e.juyo}</b>体</span>`}<span>記入 ${staffById(e.by).name}</span></div>
    <p>${esc(e.text)}</p>${e.next ? `<p class="small muted" style="margin-top:6px">申し送り：${esc(e.next)}</p>` : ''}</div>`;
}
function vDiary() {
  const k = diaryDay, a = autoInfo(k), e = S.diary[k] || { text: '', next: '' };
  const cmp = S.ui.diaryCmp;
  const p1 = cmp === 'weekday' ? key(addDays(a.d, -364)) : key(new Date(a.d.getFullYear() - 1, a.d.getMonth(), a.d.getDate()));
  const p2 = cmp === 'weekday' ? key(addDays(a.d, -728)) : key(new Date(a.d.getFullYear() - 2, a.d.getMonth(), a.d.getDate()));
  const kt = [a.ky.roku, a.ky.inu && '戌の日', a.ky.ichi && '一粒万倍日', a.ky.ten && '天赦日'].filter(Boolean).join('・');
  const results = diaryQ ? Object.entries(S.diary).filter(([kk, v]) => (v.text + v.next).includes(diaryQ)).sort((x, y) => x[0] < y[0] ? 1 : -1).slice(0, 30) : [];
  return `
  <div class="page-h"><h1>日報</h1>${PROD ? '' : '<span class="sub">天気・暦・祈願件数は自動で入ります。書くのは出来事と申し送りだけ。</span>'}</div>
  <div class="diary">
    <section class="card card-p">
      <div class="row diary-h" style="margin-bottom:14px">

        <span class="sp"></span>
        <div class="cal-nav"><button class="btn sm" data-act="diaryMove" data-n="-1">${ICON.left}<span>前の日</span></button><button class="btn sm" data-act="diaryToday" ${k === TK ? 'disabled' : ''}>今日</button><button class="btn sm" data-act="diaryMove" data-n="1" ${k >= TK ? 'disabled' : ''}><span>次の日</span>${ICON.right}</button></div>
      </div>
      ${noteCard(k)}
      <div class="auto">
        <div><div class="l">天気 <span class="autotag">自動</span></div><div class="v">${a.wx ? `${WX_ICON[a.wx.kind]} ${WX_LABEL[a.wx.kind]}` : '—'}</div><div class="small muted">${a.wx ? `${a.wx.tmax}° / ${a.wx.tmin}°` : ''}</div></div>
        <div><div class="l">暦 <span class="autotag">自動</span></div><div class="v" style="font-size:13.5px">${kt}</div><div class="small muted">${a.ky.kanshi}</div></div>
        ${PROD ? `<div><div class="l">来訪 <span class="autotag">自動</span></div><div class="v num">${a.visits}件</div><div class="small muted">外出 ${outingsOn(k).length}件</div></div>` : `<div><div class="l">祈願 <span class="autotag">台帳から</span></div><div class="v num">${a.kigan}件</div><div class="small muted">来客 ${a.visits}件</div></div>`}
        ${PROD ? `<div><div class="l">祈願 <span class="autotag">自動</span></div>${kiganReady() ? `<div class="v num">${kiganOn(k)}件</div><div class="small muted">今月 ${kiganMonth(k)}件</div>` : '<div class="v num">—</div><div class="small muted">予約台帳とつながると自動で数えます</div>'}</div>` : `<div><div class="l">授与品の出数 <span class="autotag">レジから</span></div><div class="v num">${a.juyo ?? '—'}${a.juyo != null ? '体' : ''}</div><div class="small muted">${a.s ? esc(a.s.mode === 'off' ? '休み（全員）' : a.s.label) : '平時'}</div></div>`}
      </div>

      <div class="small muted" style="margin:-6px 0 10px">申し送りは、次の日のホーム（今日の欄）と日報の上に自動で表示されます。「対応済」を押すと消えます。</div>
      <div class="row"><label class="row small" style="gap:6px"><input type="checkbox" id="dyBoard"> 掲示板にも載せる</label><span class="sp"></span>${e.by ? `<span class="small muted">記入 ${staffById(e.by).name}</span>` : ''}<button class="btn pri" data-act="saveDiary">保存</button></div>
    </section>
    <section>
      <div class="row" style="margin-bottom:12px"><h3 style="font-size:15px">過去の同じ時期</h3><span class="sp"></span>
        <div class="seg"><button class="${cmp === 'weekday' ? 'on' : ''}" data-act="diaryCmp" data-v="weekday">同じ曜日</button><button class="${cmp === 'date' ? 'on' : ''}" data-act="diaryCmp" data-v="date">同じ日付</button></div></div>
      ${pastCard(p1, '1年前')}${pastCard(p2, '2年前')}
      ${PROD ? '' : `<div class="note" style="margin-bottom:16px">${ICON.info}<span>「同じ曜日」は52週前（混み具合の比較向け）、「同じ日付」は例大祭など日付で決まる行事の比較向けです。</span></div>`}
      <div class="card card-p">
        <div class="row" style="margin-bottom:8px">${ICON.search.replace('<svg', '<svg width="16" height="16"')}<input class="input" id="dyQ" placeholder="過去の日報を検索（例：取材、雨、外祭）" value="${esc(diaryQ)}" data-enter="diarySearch"><button class="btn sm" data-act="diarySearch">検索</button></div>
        ${diaryQ ? (results.length ? `<ul class="mini-list">${results.map(([kk, v]) => `<li style="cursor:pointer" data-act="diaryGo" data-k="${kk}"><b class="num" style="white-space:nowrap">${kk.replace(/-/g, '/')}</b><span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.text)}</span></li>`).join('')}</ul>` : '<div class="empty">見つかりませんでした</div>') : '<div class="small muted">キーワードで過去の日報を探せます</div>'}
      </div>
    </section>
  </div>`;
}

/* =========================================================
   掲示板
   ========================================================= */
let postSel = null;
const readChips = (p, people, byName) => `<div class="reads">${people.map(s => { const at = byName ? Object.entries(p.reads).find(([id]) => personById(id)?.name === s.name)?.[1] : p.reads[s.id]; const nm = shortName(s.name); return at ? `<span class="read y">${avatar(s.name, s.color, true)}${esc(nm)} ✓ ${(d => `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`)(new Date(at))}</span>` : `<span class="read n">${avatar(s.name, s.color, true)}${esc(nm)} 未読</span>`; }).join('')}</div>`;
function vBoard() {
  const posts = [...S.board].sort((a, b) => b.at - a.at);
  const sel = posts.find(p => p.id === postSel) || null;
  const fmtAt = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`; };
  return `
  <div class="page-h"><h1>掲示板</h1><span class="sub">既読がわかるので、休み明けの人への伝え漏れを防げます</span><span class="sp"></span><button class="btn pri" data-act="newPost">＋ 投稿する</button></div>
  <div class="grid2" style="align-items:start">
    <div class="card" style="overflow:hidden">${posts.map(p => `<div class="post${p.reads[S.me] || isGuji() ? '' : ' isnew'}${p.id === postSel ? ' sel' : ''}" data-act="openPost" data-id="${p.id}">
      <span class="unread ${p.reads[S.me] || isGuji() ? 'no' : ''}"></span>
      <div style="min-width:0;flex:1"><div class="row" style="gap:6px">${p.reads[S.me] || isGuji() ? '' : '<span class="tag brand">未読</span>'}<h4>${esc(p.title)}</h4></div><p>${esc(p.body)}</p>

/* =========================================================
   授与品（在庫・出数の分析・御守りの登録・発注量の提案）
   ========================================================= */
const SALES_F = [3.2, 0.8, 0.8, 0.85, 0.85, 1.15, 0.8, 0.75, 0.8, 0.9, 1.25, 0.9];
const SALES_SUM = SALES_F.reduce((a, b) => a + b, 0);
const itemGrowth = it => 0.86 + rng(hashStr('gr' + it.id))() * 0.34;
function salesOf(it, ymk) {
  const [y, m] = ymk.split('-').map(Number);
  const ago = (TODAY.getFullYear() - y) * 12 + (TODAY.getMonth() + 1 - m);   // 何か月前か
  if (ago < 0) return 0;
  const g = ago < 12 ? itemGrowth(it) : 1;
  let v = it.annual / SALES_SUM * SALES_F[m - 1] * g * (0.9 + rng(hashStr('sl' + it.id + ymk))() * 0.2);
  if (ago === 0) v *= TODAY.getDate() / new Date(y, m, 0).getDate();
  return Math.round(v);
}
const monthsBack = (n, from = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1)) => Array.from({ length: n }, (_, i) => ym(new Date(from.getFullYear(), from.getMonth() - (n - 1 - i), 1)));
const supById = id => S.suppliers.find(s => s.id === id);
const itemLead = it => supById(it.sup)?.lead ?? 30;   // 納期は業者ごとに登録

function stockStat(it) {
  const logs = S.stockLog.filter(l => l.item === it.id).sort((a, b) => a.date < b.date ? -1 : 1);
  const since = key(addDays(TODAY, -90));
  const c0 = logs.find(l => l.type === 'count' && l.date >= since);
  const now = S.stock[it.id] ?? 0;
  let rate = null;
  if (c0) {
    const days = Math.max(1, Math.round((TODAY - parse(c0.date)) / 864e5));
    const ins = logs.filter(l => l.type === 'in' && l.date > c0.date).reduce((a, l) => a + l.boxes, 0);
    const used = c0.boxes + ins - now;
    if (days >= 7 && used > 0) rate = used / days;
  }
  // 入荷日は分からないので、「業者の納期」だけで判断する：無くなるまでの日数が納期＋2週間を切ったら注意、納期を切ったら至急
  const lead = itemLead(it);
  let out = null, status = 'ok', orderBy = null, daysLeft = null;
  if (rate) {
    daysLeft = Math.floor(now / rate);
    out = addDays(TODAY, daysLeft);
    orderBy = addDays(out, -lead);
    status = daysLeft <= lead ? 'urgent' : daysLeft <= lead + 14 ? 'warn' : 'ok';
  } else status = 'nodata';
  if (now === 0) { status = 'urgent'; out = TODAY; orderBy = TODAY; daysLeft = 0; }
  const lastCount = [...logs].reverse().find(l => l.type === 'count');
  return { now, rate, out, status, orderBy, lastCount, daysLeft, lead };
}

let salesItem = 'all', salesPeriod = 'year';
function juyoSales() {
  const cur = monthsBack(12), prev = monthsBack(12, new Date(TODAY.getFullYear() - 1, TODAY.getMonth(), 1));
  const isY = salesPeriod === 'year';
  const thisM = ym(TODAY), lastYM = ym(new Date(TODAY.getFullYear() - 1, TODAY.getMonth(), 1));
  const totals = S.items.map(it => {
    const q = isY ? cur.reduce((a, m) => a + salesOf(it, m), 0) : salesOf(it, thisM);
    const p = isY ? prev.reduce((a, m) => a + salesOf(it, m), 0) : Math.round(salesOf(it, lastYM) * TODAY.getDate() / new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate());
    return { it, q, p };
  }).sort((a, b) => b.q - a.q);
  const sum = totals.reduce((a, t) => a + t.q, 0); let acc = 0;
  totals.forEach(t => { acc += t.q; t.abc = acc / sum <= 0.7 ? 'A' : acc / sum <= 0.9 ? 'B' : 'C'; });
  const max = totals[0]?.q || 1;
  const pick = salesItem === 'all' ? null : S.items.find(i => i.id === salesItem);
  const series = ms => ms.map(m => pick ? salesOf(pick, m) : S.items.reduce((a, it) => a + salesOf(it, m), 0));
  const a = series(cur), b = series(prev);
  return `
  <div class="note" style="margin-bottom:14px">${ICON.info}<span>出数は<b>授与所レジ</b>の記録です（データ分析用）。宮司が接客した分は入らないので、在庫とは合わせません。数字はサンプルです。</span></div>

      <ul class="rank">${totals.map((t, i) => { const yoy = t.p ? (t.q / t.p - 1) * 100 : 0; return `<li style="cursor:pointer;${salesItem === t.it.id ? 'background:var(--brand-soft);border-radius:8px' : ''}" data-act="salesItem" data-id="${t.it.id}"><span class="n">${i + 1}</span><span><b>${esc(t.it.name)}</b><span class="abc ${t.abc}">${t.abc}</span></span><span class="bar"><i style="width:${t.q / max * 100}%"></i></span><span class="r num">${t.q.toLocaleString()}</span><span class="r num small ${yoy >= 0 ? 'up' : 'down'}">${yoy >= 0 ? '+' : ''}${yoy.toFixed(0)}%</span></li>`; }).join('')}</ul>

      ${barChart(cur.map(m => Number(m.split('-')[1]) + '月'), a, b, '直近12か月', '前年')}

      <h4 class="small muted" style="margin:16px 0 8px">天気・曜日の影響（1日あたりの平均・サンプル）</h4>
      <table class="tbl"><thead><tr><th></th><th class="r">☀️ 晴れ</th><th class="r">☁️ くもり</th><th class="r">☂️ 雨</th></tr></thead>
      <tbody><tr><td>平日</td><td class="r num">48</td><td class="r num">41</td><td class="r num">26</td></tr><tr><td>土日祝</td><td class="r num">132</td><td class="r num">108</td><td class="r num">61</td></tr></tbody></table>
    </div>
  </div>`;
}
function barChart(labels, a, b, la, lb) {
  const W = 560, H = 210, P = { l: 40, r: 8, t: 12, b: 26 }, n = labels.length;
  const max = Math.max(...a, ...b, 1) * 1.1, gw = (W - P.l - P.r) / n, bw = Math.min(14, gw / 2.8);
  const y = v => P.t + (H - P.t - P.b) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max / 4 * i, yy = y(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${P.l - 6}" y="${yy + 4}" font-size="10" text-anchor="end" fill="var(--text-3)">${v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : Math.round(v)}</text>`; }
  labels.forEach((l, i) => {
    const x = P.l + gw * i + gw / 2;
    g += `<rect x="${x - bw - 1}" y="${y(b[i])}" width="${bw}" height="${H - P.b - y(b[i])}" rx="3" fill="var(--line)"><title>${lb} ${l}：${b[i].toLocaleString()}</title></rect>`;
    g += `<rect x="${x + 1}" y="${y(a[i])}" width="${bw}" height="${H - P.b - y(a[i])}" rx="3" fill="var(--brand)"><title>${la} ${l}：${a[i].toLocaleString()}</title></rect>`;
    g += `<text x="${x}" y="${H - 8}" font-size="10" text-anchor="middle" fill="var(--text-2)">${l}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="月別のグラフ">${g}</svg>
  <div class="legend" style="margin-top:2px"><span><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--brand);margin-right:4px"></span>${la}</span><span><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--line);margin-right:4px"></span>${lb}</span></div>`;
}
function juyoItems() {

function orderRows() {
  const cur = monthsBack(12), prev = monthsBack(12, new Date(TODAY.getFullYear() - 1, TODAY.getMonth(), 1));
  S.order = S.order || {};
  return S.items.map(it => {
    const cons = Math.max(1, Math.round(it.annual / it.perBox));
    const sc = cur.reduce((a, m) => a + salesOf(it, m), 0), sp = prev.reduce((a, m) => a + salesOf(it, m), 0);
    const growth = sp ? sc / sp : 1;
    const remain = Math.round(cons * (0.04 + rng(hashStr('rm' + it.id))() * 0.1));
    const boxes = Math.max(0, Math.ceil(cons * growth * 1.1 - remain));
    const cases = Math.ceil(boxes / it.perCase);
    const final = S.order[it.id] ?? cases;
    return { it, cons, growth, remain, boxes, cases, final };
  });
}

function needOn(d, post) {
  const k = key(d), t = S.seasons[k], r = S.rules.posts[post];
  if (post === 'shuin' && S.extraNeed[k]) return (t === 'shichigosan' || t === 'reitaisai' ? r[t] : isWeekend(d) ? r.weekend : r.weekday) + S.extraNeed[k];

const reqOk = (p, k) => { const v = S.requests[p.id]?.[k.slice(0, 7)]?.days?.[k]; return v === 'ok' || v === 'maybe'; };
const reqMark = (p, k) => { const v = S.requests[p.id]?.[k.slice(0, 7)]?.days?.[k]; return v === 'ng' ? 'ng' : v ? 'ok' : null; };

    .map(x => ({ ...x, avail: S.regulars.filter(p => reqOk(p, x.k)).length })).sort((a, b) => a.avail - b.avail)
    .forEach(x => {
      A[x.k] = { shuin: [], honden: [...(old[x.k]?.honden || [])] };   // 本殿の担当（別の人）はそのまま残す

}

function vAnalytics() {
  const cur = monthsBack(12, new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1));
  const prev = monthsBack(12, new Date(TODAY.getFullYear() - 1, TODAY.getMonth() - 1, 1));
  const A = S.analytics, g = (m, f) => A[m]?.[f] ?? 0;
  const last = cur[11], lastPrev = prev[11];
  const sumC = cur.reduce((a, m) => a + g(m, 'hp'), 0), sumP = prev.reduce((a, m) => a + g(m, 'hp'), 0);
  const pct = (a, b) => b ? (a / b - 1) * 100 : 0;
  const kpi = (l, v, d, sub) => `<div class="card kpi"><div class="l">${l}</div><div class="v num">${v}</div>${d !== null ? `<div class="d ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} 前年比 ${d >= 0 ? '+' : ''}${d.toFixed(1)}%</div>` : `<div class="small muted">${sub}</div>`}</div>`;
  const evLabel = m => { const ts = new Set(Object.entries(S.seasons).filter(([k]) => k.slice(5, 7) === m.slice(5, 7)).map(([, t]) => SEASON_TYPES[t].label.replace('（平日）', ''))); return [...ts].join('・'); };
  return `
  <div class="page-h"><h1>分析</h1><span class="sp"></span><button class="btn pri" data-act="anInput">今月の数字を入力</button></div>
  <div class="note" style="margin-bottom:14px">${ICON.info}<span>数字はサンプルです。最初は月1回、GA4・Googleトレンドの数字を手で入れ、つなげられるものから自動にします。SNSはこれから開設するので、開設後に欄が埋まります。</span></div>
  <div class="grid4" style="margin-bottom:16px">
    ${kpi(`HP閲覧数（${Number(last.slice(5))}月）`, g(last, 'hp').toLocaleString(), pct(g(last, 'hp'), g(lastPrev, 'hp')))}
    ${kpi('HP閲覧数（直近12か月）', sumC.toLocaleString(), pct(sumC, sumP))}
    ${kpi(`検索の多さ（${Number(last.slice(5))}月・指数）`, g(last, 'search'), pct(g(last, 'search'), g(lastPrev, 'search')))}
    ${kpi('Instagram', '—', null, '開設後に表示')}
  </div>
  <div class="grid2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start">
    <div class="card card-p"><div class="card-h"><h3>HP閲覧数の月別（前年と比べる）</h3></div>
      ${barChart(cur.map(m => Number(m.slice(5)) + '月'), cur.map(m => g(m, 'hp')), prev.map(m => g(m, 'hp')), '直近12か月', '前年')}
</div>
    <div class="card card-p"><div class="card-h"><h3>月ごとの数字</h3></div>
      <div class="tbl-wrap" style="max-height:340px;overflow:auto"><table class="tbl"><thead><tr><th>月</th><th class="r">HP閲覧</th><th class="r">前年比</th><th class="r">検索</th></tr></thead>
      <tbody>${[...cur].reverse().map((m, i) => { const p = [...prev].reverse()[i], d = pct(g(m, 'hp'), g(p, 'hp')); return `<tr><td>${m.replace('-', '/')}</td><td class="r num">${g(m, 'hp').toLocaleString()}</td><td class="r num small ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d.toFixed(1)}%</td><td class="r num">${g(m, 'search')}</td></tr>`; }).join('')}</tbody></table></div></div>
  </div>
  <div class="grid3" style="margin-top:16px">
    <div class="card card-p"><h3>Googleマップ</h3><p class="small muted" style="margin-top:6px">ビジネスプロフィールの管理を始めたら、閲覧数・ルート検索数をここに出します。</p></div>
    <div class="card card-p"><h3>Search Console</h3><p class="small muted" style="margin-top:6px">所有権の確認が済んだら、検索での表示回数・クリック数を出します。</p></div>

}

function vBaitoView() {
  if (S.session.group && S.session.group !== 'shuin') return vSeasonMemberView();
  const p = S.regulars.find(x => x.id === S.session.id) || S.regulars[0];
  const nm = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 1), ymk = ym(nm);
  const req = S.requests[p.id]?.[ymk];
  const cur = (S.ui.baitoDraft && S.ui.baitoDraft.p === p.id) ? S.ui.baitoDraft.days : { ...(req?.days || {}) };
  S.ui.baitoDraft = { p: p.id, days: cur };
  const MK = { ok: '○', ng: '×' };
  let cal = WD.map(w => `<div class="h">${w}</div>`).join('') + Array.from({ length: nm.getDay() }, () => '<div class="bv-d e"></div>').join('');
  daysOfMonth(nm).forEach(d => { const k = key(d), v = cur[k] === 'maybe' ? 'ok' : cur[k]; cal += `<div class="bv-d ${v || ''} ${d.getDay() === 0 ? 'sun' : ''} ${d.getDay() === 6 ? 'sat' : ''} ${HOLIDAYS[k] ? 'hol' : ''}" data-act="bvTap" data-k="${k}"><b>${d.getDate()}</b><span class="m">${v ? MK[v] : ''}</span></div>`; });
  const posts = S.board.filter(b => boardTargets(b).includes('shuin')).sort((a, b) => b.at - a.at);
  posts.forEach(b => { if (!b.reads[p.id]) { b.reads[p.id] = Date.now(); save(); } });

/* =========================================================
   申込用紙（外祭・企業団体祈願）※様式は本人の指示待ち。今は仮の枠
   ========================================================= */
function applicationForm(r) {
  const d = parse(r.date), isG = r.type === '外祭';
  const row = (l, v) => `<tr><th style="width:150px;text-align:left">${l}</th><td>${v ? esc(v) : '&nbsp;'}</td></tr>`;
  const rows = isG
    ? [['祭典の種類', r.sub], ['日時', `${ymdw(d)} ${r.start}〜${tstr(tmin(r.start) + r.dur)}`], ['出発時刻', r.depart], ['施主（申込者）', r.name], ['ふりがな', ''], ['現場住所', r.place], ['連絡先', ''], ['迎え車', ''], ['持ち出し道具', ''], ['担当神職', ''], ['初穂料', ''], ['受付経路', r.route], ['備考', '']]
    : [['日時', `${ymdw(d)} ${r.start}〜${tstr(tmin(r.start) + r.dur)}`], ['会社・団体名（祈願者）', r.name], ['ふりがな', ''], ['申込者（ご担当）', ''], ['連絡先', ''], ['参列人数', r.people ? r.people + '名' : ''], ['祈願の内容', r.sub], ['札の体数', ''], ['初穂料', ''], ['受付経路', r.route], ['備考', '']];
  modal(`<div class="modal-h"><h3>申込用紙：${isG ? '外祭' : '企業・団体祈願'}</h3><span class="sp"></span><button class="btn pri sm print-only" data-act="print">${ICON.print.replace('<svg', '<svg width="14" height="14" style="vertical-align:-2px"')} 印刷・PDF</button><button class="icon-btn" style="margin-left:8px" data-act="closeModal">${ICON.x}</button></div>
  <div class="modal-b" style="background:var(--bg-2)">
    <div class="note warn no-print" style="margin-bottom:12px">${ICON.info}<span><b>仮の様式です。</b>申込用紙の作り方は追って指示をもらう予定です。今は予約に入っている内容だけを当てはめています。</span></div>
    <div class="order-sheet">
      <h2 style="letter-spacing:.2em">${isG ? '外祭 申込書' : '企業・団体祈願 申込書'}</h2>
      <div style="text-align:right;margin-bottom:8px">品川神社　TEL 03-3474-5575　FAX 03-3474-5599</div>
      <table>${rows.map(([l, v]) => row(l, v)).join('')}</table>
    </div>
  </div>`, true);
}

/* =========================================================
   モーダル・トースト
   ========================================================= */
function modal(html, wide) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modalBg';
  bg.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  const f = bg.querySelector('input:not([type=checkbox]):not([type=date]),textarea'); if (f && !('ontouchstart' in window)) setTimeout(() => f.focus(), 30);
}
/* 確認・入力はページ内の画面で行う（埋め込み表示ではブラウザ標準のダイアログが出ないため） */
let askCb = null;
function askConfirm(msg, onYes, okLabel = '削除する') {
  askCb = onYes;
  modal(`<div class="modal-h"><h3>確認</h3><span class="sp"></span><button class="icon-btn" data-act="closeModal">${ICON.x}</button></div><div class="modal-b"><p>${esc(msg)}</p></div><div class="modal-f"><button class="btn" data-act="closeModal">やめる</button><button class="btn pri" data-act="askYes">${okLabel}</button></div>`);
}
function askText(title, placeholder, onOk) {
  askCb = onOk;
  modal(`<div class="modal-h"><h3>${esc(title)}</h3><span class="sp"></span><button class="icon-btn" data-act="closeModal">${ICON.x}</button></div><div class="modal-b"><input class="input" id="askInput" placeholder="${esc(placeholder)}" data-enter="askYes"></div><div class="modal-f"><button class="btn" data-act="closeModal">やめる</button><button class="btn pri" data-act="askYes">追加する</button></div>`);
}
function closeModal() { document.getElementById('modalBg')?.remove(); }
function toast(msg) { document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function menuModal() {
  modal(`<div class="modal-h"><h3>メニュー</h3><span class="sp"></span><button class="icon-btn" data-act="closeModal">${ICON.x}</button></div>
  <div class="modal-b"><nav class="nav">${navItems().map(n => n[0] === 'g' ? `<div class="nav-g">${n[1]}</div>` : `<a href="#/${n[0]}" data-act="closeModal">${n[2]}<span class="lbl">${n[1]}</span></a>`).join('')}</nav>
  <div class="row" style="margin-top:14px">${avatar(me().name, me().color, true)}<b>${me().name}</b><span class="small muted">ログイン中</span><span class="sp"></span><button class="btn" data-act="logout">ログアウト</button></div>
  ${PROD ? '' : '<div class="row" style="margin-top:8px"><button class="btn ghost sm" data-act="reset">仮データに戻す（デモ）</button></div>'}</div>`);
}

/* =========================================================
   ルーティングと描画
   ========================================================= */
function route() { const h = location.hash.replace(/^#\/?/, '').split('/'); return { r: h[0] || 'home', p: h[1] }; }
function render() {
  const root = document.getElementById('root');
  if (!S.session) { root.innerHTML = vLogin(); return; }
  if (S.session.role === 'baito') { root.innerHTML = vBaitoView(); return; }
  S.me = S.session.id;
  const { r, p } = route();
  if (r === 'diary' && p) diaryDay = p > TK ? TK : p;
  if (PROD && PHASE1_HIDE.includes(r)) { location.hash = '#/home'; return; }
  const V = { admin: () => typeof vAdmin === 'function' ? vAdmin() : '', home: vHome, diary: vDiary, board: vBoard, manual: vManual, kigan: vKigan, juyo: () => vJuyo(p), baito: vBaito, tasks: vTasks, analytics: vAnalytics, seasons: vSeasons, ujiko: vUjiko };
  const y = window.scrollY;
  root.innerHTML = shell(r, (V[r] || vHome)());
  window.scrollTo(0, y);
}

let syncTimer = null;

  lsSet(UI_KEY, JSON.stringify(Object.assign({}, S.ui, { baitoDraft: undefined })));
  if (!P.last || !P.me) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(flush, 250);
}
async function flush() {
  if (P.busy) { clearTimeout(syncTimer); syncTimer = setTimeout(flush, 400); return; }
  const cur = snap(S), changes = diff(P.last, cur);
  if (!changes.length) return;
  const prev = P.last; P.last = cur; P.busy = true; syncBadge(true);
  try {
    for (let i = 0; i < changes.length; i += 150) {
      const r = await api('sync', { changes: changes.slice(i, i + 150) });
      if (r.denied && r.denied.length) { toast('権限のない変更があったため、一部は保存されませんでした'); await refresh(true); }
    }
  } catch (e) {
    P.last = prev;
    if (e.code === 'session') return expired(e.message);
    toast('保存できませんでした。通信を確かめて、もう一度お試しください（' + e.message + '）');
  } finally { P.busy = false; syncBadge(false); }
}

  if (!P.token || P.busy) return;
  const ae = document.activeElement, editing = ae && ['INPUT', 'TEXTAREA', 'SELECT'].includes(ae.tagName);
  const dy = document.getElementById('dyText'), dirty = dy && S && S.diary && dy.value !== ((S.diary[diaryDay] || {}).text || '');
  if (!force && (document.getElementById('modalBg') || editing || dirty || Date.now() - P.lastInput < 4000 || document.visibilityState !== 'visible')) return;
  try {
    const r = await api('data');
    P.me = r.me; const ui = S && S.ui; S = fromServer(r.data, r.me); if (ui) S.ui = ui; P.last = snap(S);

}

async function loadPeople() {
  try { const r = await api('people'); P.people = r.people; P.deviceType = r.device.type; P.screen = 'login'; if (P.deviceType === 'register') return startReji(r.device.label); }
  catch (e) { if (e.code === 'device') { P.device = null; lsSet(DEVICE_KEY, null); P.screen = 'register'; P.msg = ''; } else { P.screen = 'login'; P.people = []; P.msg = '受け口につながりません。通信を確かめてください'; } }
  render();
}
async function afterLogin(r) {
  P.token = r.token || P.token; lsSet(TOKEN_KEY, P.token); P.me = r.me; if (r.device) P.deviceType = r.device.type;
  if (r.me.mustChange) { P.screen = 'newpin'; P.newPinStep = 0; loginPin = ''; P.msg = '最初のログインです。自分だけの暗証番号に変えてください'; S = S || { ui: loadUi() }; S.session = null; render(); return; }
  S = fromServer(r.data, r.me); P.last = snap(S); P.msg = ''; P.screen = 'app';
  if (S.session.role === 'staff' && (!location.hash || location.hash === '#/')) location.hash = '#/home';
  render();
}

/* ── 起動 ── */
async function bootProd() {
  save = prodSave;
  vLogin = prodLogin;
  S = { ui: loadUi(), session: null };
  render();
  if (!P.device) { P.screen = 'register'; render(); return; }
  if (P.token) {
    try { const r = await api('data'); return afterLogin(Object.assign(r, { token: P.token })); }
    catch (e) { P.token = null; lsSet(TOKEN_KEY, null); }
  }
  await loadPeople();
  loadWeather().then(ok => { if (ok && S && S.session) render(); });
}
['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { P.lastInput = Date.now(); }, { passive: true, capture: true }));
setInterval(() => { if (PROD && S && S.session) refresh(false); }, 60000);
document.addEventListener('visibilitychange', () => { if (PROD && S && S.session && document.visibilityState === 'visible') refresh(false); });
// 共有端末は、何も触らないで15分たったらログアウト
setInterval(() => { if (PROD && S && S.session && P.deviceType === 'shared' && Date.now() - P.lastInput > 15 * 60000) { api('logout').catch(() => { }); expired('15分操作がなかったため、ログアウトしました'); } }, 30000);

/* ── 操作：本番では受け口を使う ── */
const WEAK_PINS = ['0000', '1111', '2222', '3333', '4444', '5555', '6666', '7777', '8888', '9999', '1234', '4321', '0123', '1212', '2580', '0852'];
if (PROD) Object.assign(ACT, {
  async regDevice() {
    const code = val('regCode'), label = val('regLabel');
    if (!/^\d{6}$/.test(code)) { P.msg = '招待コードは6桁の数字です'; return render(); }
    if (!label) { P.msg = 'この端末の名前を入れてください'; return render(); }
    try { const r = await api('registerDevice', { code, label }); P.device = r.token; lsSet(DEVICE_KEY, r.token); P.msg = ''; P.screen = 'loading'; render(); await loadPeople(); }
    catch (e) { P.msg = e.message; render(); }
  },
  loginWho(el) { loginWho = el.dataset.id; loginPin = ''; P.msg = ''; render(); },
  loginBack() { loginWho = null; loginPin = ''; P.msg = ''; render(); },
  async pinKey(el) {
    const v = el.dataset.v;
    if (v === '⌫') loginPin = loginPin.slice(0, -1); else if (loginPin.length < 4) loginPin += v;
    P.msg = ''; render();
    if (loginPin.length === 4) {
      const pin = loginPin; loginPin = '';
      try { P.msg = '確認しています…'; render(); const r = await api('login', { user: loginWho, pin }); P.oldPin = pin; await afterLogin(r); }
      catch (e) { P.msg = e.message; if (e.code === 'device') { P.device = null; lsSet(DEVICE_KEY, null); P.screen = 'register'; } render(); }
    }
  },
  async newPinKey(el) {
    const v = el.dataset.v;
    if (v === '⌫') loginPin = loginPin.slice(0, -1); else if (loginPin.length < 4) loginPin += v;
    P.msg = ''; render();
    if (loginPin.length < 4) return;
    if (P.newPinStep === 0) {
      if (WEAK_PINS.includes(loginPin)) { loginPin = ''; P.msg = '推測されやすい番号です。別の番号にしてください'; return render(); }
      if (loginPin === P.oldPin) { loginPin = ''; P.msg = 'いまと同じ番号です。別の番号にしてください'; return render(); }
      P.newPin = loginPin; loginPin = ''; P.newPinStep = 1; return render();
    }
    if (loginPin !== P.newPin) { loginPin = ''; P.newPinStep = 0; P.msg = '2回の番号が違いました。最初からやり直してください'; return render(); }
    const pin = loginPin; loginPin = '';
    try { await api('changePin', { oldPin: P.oldPin, newPin: pin }); P.oldPin = null; const r = await api('data'); toast('暗証番号を変えました'); await afterLogin(Object.assign(r, { me: Object.assign(r.me, { mustChange: false }) })); }
    catch (e) { P.newPinStep = 0; P.msg = e.message; render(); }
  },
  logout() { closeModal(); api('logout').catch(() => { }); P.token = null; lsSet(TOKEN_KEY, null); S.session = null; loginWho = null; loginPin = ''; P.screen = 'login'; P.msg = ''; window.scrollTo(0, 0); loadPeople(); },
  reset() { toast('本番では使えません'); },
  // 人の登録・変更は管理画面で（暗証番号を発行するため）
  editRegular() { goAdmin(); }, saveRegular() { goAdmin(); }, editMember() { goAdmin(); }, saveMember() { goAdmin(); }, delMember() { goAdmin(); }, bulkMember() { goAdmin(); }, saveBulkMember() { goAdmin(); },
  async manPdfOpen(el) {
    const w = window.open('', '_blank');
    try { const r = await api('file', { id: el.dataset.id }); const bytes = Uint8Array.from(atob(r.b64), c => c.charCodeAt(0)); const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); if (w) w.location = url; else location.href = url; }
    catch (e) { if (w) w.close(); toast('開けませんでした（' + e.message + '）'); }
  }
});
if (PROD) Object.assign(CHG, {
  async manPdf(el) {
    for (const f of [...el.files]) {
      if (!/\.pdf$/i.test(f.name)) { toast('PDFだけ登録できます'); continue; }
      if (f.size > 20 * 1048576) { toast('20MBより大きいPDFは登録できません'); continue; }
      toast('アップロード中…');
      try {

/* =========================================================
   授与品（本番）：授与所のレジ端末と、職員の在庫・出数・品目の登録
   - レジ端末：授与所のiPadを「レジ端末」として登録すると、暗証番号なしでレジだけ開く
   - 会計はまず端末に保存してから送る。電波が悪くても、あとで自動で送り直す
   - 出数（レジ）と在庫（箱）は分けて扱い、数を合わせない（宮司が接客した分はレジに入らないため）
   ========================================================= */
const REG_QUEUE_KEY = 'shamu-reg-queue', REG_TODAY_KEY = 'shamu-reg-today', REG_ITEMS_KEY = 'shamu-reg-items';
const lsJson = (k, d) => { try { return JSON.parse(lsGet(k) || 'null') ?? d; } catch (e) { return d; } };
let REGI = { on: false, label: '', items: [], cart: {}, sending: false, err: '' };

const regDay = () => key(new Date());
function regToday() { const t = lsJson(REG_TODAY_KEY, null), d = regDay(); return t && t.date === d ? t : { date: d, sales: [] }; }
function regQueue() { return lsJson(REG_QUEUE_KEY, []); }

async function startReji(label) {
  REGI.on = true; REGI.label = label || REGI.label; REGI.items = lsJson(REG_ITEMS_KEY, []);
  S = S || { ui: loadUi() }; S.session = null;
  render();
  await regLoadItems();
  regFlush();
}
async function regLoadItems() {
  try { const r = await api('regItems'); REGI.items = r.items; REGI.label = r.label || REGI.label; REGI.err = ''; lsSet(REG_ITEMS_KEY, JSON.stringify(r.items)); }
  catch (e) {
    if (e.code === 'device') { REGI.on = false; P.device = null; lsSet(DEVICE_KEY, null); P.screen = 'register'; P.msg = 'この端末の登録が取り消されました。管理者に確認してください'; }
    else REGI.err = '受け口につながりません。前回の品目で動いています';
  }
  render();
}
/* 送れていない会計をまとめて送る（同じ会計は受け口で二重にならない） */
async function regFlush() {
  if (REGI.sending) return;
  let q = regQueue(); if (!q.length) return;
  REGI.sending = true;
  try {
    while (q.length) {
      const it = q[0];
      if (it.undo) await api('regUndo', { id: it.id }); else await api('regSale', { sale: it });
      q = regQueue().filter(x => !(x.id === it.id && !!x.undo === !!it.undo)); lsSet(REG_QUEUE_KEY, JSON.stringify(q));
    }
    REGI.err = '';
  } catch (e) { REGI.err = '送れていない会計があります。電波が戻ると自動で送ります'; }
  finally { REGI.sending = false; if (REGI.on) render(); }
}

function vReji() {
  const items = REGI.items, cart = Object.entries(REGI.cart).filter(([, q]) => q > 0);
  const byId = id => items.find(i => i.id === id) || {};
  const total = cart.reduce((a, [id, q]) => a + (byId(id).price || 0) * q, 0), count = cart.reduce((a, [, q]) => a + q, 0);
  const today = regToday(), live = today.sales.filter(s => !s.undone), q = regQueue().length;
