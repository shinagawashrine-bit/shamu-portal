function regHistoryModal() {
  const t = regToday();
  modal(`<div class="modal-h"><h3>今日の記録（この端末）</h3><span class="sp"></span><button class="icon-btn" data-act="closeModal">${ICON.x}</button></div>
  <div class="modal-b">${t.sales.length ? `<ul class="mini-list">${[...t.sales].reverse().map(s => `<li style="${s.undone ? 'opacity:.45;text-decoration:line-through' : ''}"><span class="num small">${new Date(s.ts).toTimeString().slice(0, 5)}</span><span style="flex:1;min-width:0">${s.lines.map(l => esc(l.name) + (l.qty > 1 ? '×' + l.qty : '')).join('、')}</span><b class="num">${yen(s.total)}円</b>${s.undone ? '<span class="small muted">取り消し済み</span>' : `<button class="btn sm ghost" style="color:var(--red)" data-act="regUndo" data-id="${s.id}">取り消す</button>`}</li>`).join('')}</ul>` : '<div class="empty">今日はまだ記録がありません</div>'}
  <div class="small muted" style="margin-top:10px">押し間違えたときは「取り消す」。取り消せるのは、この端末で記録した24時間以内の会計です。</div></div>`);
}
if (PROD) Object.assign(ACT, {
  regAdd(el) { const id = el.dataset.id; REGI.cart[id] = (REGI.cart[id] || 0) + 1; render(); },
  regQty(el) { const id = el.dataset.id; REGI.cart[id] = Math.max(0, (REGI.cart[id] || 0) + +el.dataset.n); if (!REGI.cart[id]) delete REGI.cart[id]; render(); },
  regClear() { REGI.cart = {}; render(); },
  regCommit() {
    const lines = Object.entries(REGI.cart).filter(([, q]) => q > 0).map(([id, qty]) => { const it = REGI.items.find(i => i.id === id); return { item: id, name: it.name, price: it.price, qty }; });
    if (!lines.length) return;
    const sale = { id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), lines, total: lines.reduce((a, l) => a + l.price * l.qty, 0) };
    const t = regToday(); t.sales.push(sale); lsSet(REG_TODAY_KEY, JSON.stringify(t));
    lsSet(REG_QUEUE_KEY, JSON.stringify(regQueue().concat([sale])));
    REGI.cart = {}; render(); toast(`記録しました（${yen(sale.total)}円）`);
    regFlush();
  },
  regHistory() { regHistoryModal(); },
  regUndo(el) {
    const id = el.dataset.id;
    askConfirm('この会計を取り消しますか？', () => {
      const t = regToday(), s = t.sales.find(x => x.id === id); if (!s) return;
      s.undone = true; lsSet(REG_TODAY_KEY, JSON.stringify(t));
      const q = regQueue(), pending = q.some(x => x.id === id && !x.undo);
      // まだ送っていない会計なら、送る前に消すだけ
      lsSet(REG_QUEUE_KEY, JSON.stringify(pending ? q.filter(x => x.id !== id) : q.concat([{ id, undo: true }])));
      regHistoryModal(); render(); toast('取り消しました'); regFlush();
    }, '取り消す');
  }
});
// レジ端末のときは、ほかの画面を出さずにレジだけを出す
if (PROD) {
  const renderApp = render;
  render = function () { if (REGI.on) { document.getElementById('root').innerHTML = vReji(); return; } renderApp(); };
  setInterval(() => { if (REGI.on) regFlush(); }, 30000);
  setInterval(() => { if (REGI.on && document.visibilityState === 'visible') regLoadItems(); }, 10 * 60000);
  document.addEventListener('visibilitychange', () => { if (REGI.on && document.visibilityState === 'visible') { regFlush(); render(); } });
}

/* ── 職員：授与品（在庫・出数と集計・授与品の登録） ── */
let SUM = { rows: null, at: 0, loading: false, err: '' }, sumMonth = ym(TODAY), sumItem = 'all';
async function loadSalesSummary(force) {
  if (SUM.loading || (!force && SUM.rows && Date.now() - SUM.at < 60000)) return;
  SUM.loading = true;
  try { const r = await api('salesSummary'); SUM.rows = r.rows; SUM.at = Date.now(); SUM.err = ''; }
  catch (e) { SUM.err = '集計を読み込めませんでした（' + e.message + '）'; }
  finally { SUM.loading = false; if (route().r === 'juyo') render(); }
}
function vJuyoProd() {
  const tab = ['stock', 'sales', 'items'].includes(S.ui.juyoTab) ? S.ui.juyoTab : 'stock';
  const T = [['stock', '在庫'], ['sales', '出数と集計'], ['items', '授与品の登録']];
  return `
  <div class="page-h"><h1>授与品</h1><span class="sub">レジ端末の記録と、在庫の箱数</span></div>
  <div class="tabs">${T.map(t => `<button class="${tab === t[0] ? 'on' : ''}" data-act="juyoTab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>
  ${tab === 'stock' ? juyoStockProd() : tab === 'sales' ? juyoSalesProd() : juyoItemsProd()}`;
}
const activeItems = () => S.items.filter(i => i.active !== false);
function juyoStockProd() {
  const items = activeItems();
  if (!items.length) return `<div class="card card-p"><div class="empty">授与品がまだ登録されていません。「授与品の登録」から登録してください。</div></div>`;

  <div class="note" style="margin-bottom:14px">${ICON.info}<span><b>在庫は箱で数えます。</b>レジの出数とは合わせません（宮司が接客した分はレジに入らないため）。箱を開けたら「1箱開けた」、入荷したときや忙しい時期のあとは「まとめて数える」で実際の箱数を入れます。</span></div>
  <div class="grid2" style="margin-bottom:16px">
    <div class="card kpi"><div class="l">最後に数えた日</div><div class="v">${lastC ? md(parse(lastC)) : '—'}</div><div class="small muted"><a href="javascript:void 0" data-act="countModal">まとめて数える →</a></div></div>
    <div class="card kpi"><div class="l">在庫の合計</div><div class="v">${rows.reduce((a, r) => a + r.st.now, 0)}箱</div><div class="small muted">${items.length}品</div></div>
  </div>
  <div class="card"><div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>授与品</th><th class="r">在庫</th><th class="r">減り方</th><th>無くなる見込み</th><th></th></tr></thead>
    <tbody>${rows.map(({ it, st }) => `<tr>
      <td><b>${esc(it.name)}</b><div class="small muted">${esc(it.cat)}${it.perBox ? '・1箱' + it.perBox + '体' : ''}</div></td>
      <td class="r num"><b style="font-size:16px">${st.now}</b>箱<div class="small muted">約${(st.now * (it.perBox || 0)).toLocaleString()}体</div></td>
      <td class="r num small">${st.rate ? (st.rate * 7).toFixed(1) + '箱/週' : '—'}</td>
      <td class="small">${st.now <= 0 ? '<span class="tag red">在庫なし</span>' : st.out ? mdw(st.out) + `<div class="muted">あと約${st.daysLeft}日</div>` : '<span class="muted">記録が足りない</span>'}</td>
      <td><button class="btn sm" data-act="openBox" data-id="${it.id}" ${st.now <= 0 ? 'disabled' : ''}>1箱開けた</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="small muted" style="margin-top:8px">減り方は、90日以内に数えた記録から計算します（7日以上たつと出ます）。</div>`;
}
function juyoSalesProd() {
  if (!SUM.rows) { loadSalesSummary(); return `<div class="card card-p"><div class="empty">${SUM.err ? esc(SUM.err) : '集計を読み込んでいます…'}</div></div>`; }
  const rows = SUM.rows;   // [日付, 品目ID, 品名, 数, 金額]
  const [y, m] = sumMonth.split('-').map(Number);
  const inM = rows.filter(r => r[0].startsWith(sumMonth));
  const lastY = `${y - 1}-${pad(m)}`, inLY = rows.filter(r => r[0].startsWith(lastY));
  const qty = a => a.reduce((s, r) => s + r[3], 0), amt = a => a.reduce((s, r) => s + r[4], 0);
  // 品目ごと（この月）
  const per = {}; inM.forEach(r => { const p = per[r[1]] || (per[r[1]] = { id: r[1], name: r[2], q: 0, a: 0 }); p.q += r[3]; p.a += r[4]; });
  const rank = Object.values(per).sort((a, b) => b.q - a.q), sum = qty(inM); let acc = 0;
  rank.forEach(t => { acc += t.q; t.abc = acc / sum <= 0.7 ? 'A' : acc / sum <= 0.9 ? 'B' : 'C'; });
  const max = rank[0]?.q || 1;
  // 日ごと（この月）
  const days = {}; inM.forEach(r => { const d = days[r[0]] || (days[r[0]] = { q: 0, a: 0 }); d.q += r[3]; d.a += r[4]; });
  const dim = new Date(y, m, 0).getDate();
  // 12か月のグラフ
  const months = monthsBack(12, new Date(y, m - 1, 1)), prevMonths = months.map(k => `${Number(k.slice(0, 4)) - 1}${k.slice(4)}`);
  const pick = sumItem === 'all' ? null : sumItem;
  const mq = k => rows.filter(r => r[0].startsWith(k) && (!pick || r[1] === pick)).reduce((s, r) => s + r[3], 0);
  const pickName = pick ? (rank.find(t => t.id === pick)?.name || S.items.find(i => i.id === pick)?.name || '') : '';
  const yoy = qty(inLY) ? Math.round((sum / qty(inLY) - 1) * 100) : null;
  return `
  <div class="note" style="margin-bottom:14px">${ICON.info}<span>出数は<b>授与所のレジ端末</b>の記録です。宮司が接客した分などは入らないので、在庫とは合わせません。</span></div>
  <div class="row" style="margin-bottom:14px;gap:8px"><button class="icon-btn" data-act="sumMonth" data-n="-1" aria-label="前の月">${ICON.left}</button><h3 style="font-size:18px;margin:0">${y}年${m}月</h3><button class="icon-btn" data-act="sumMonth" data-n="1" aria-label="次の月">${ICON.right}</button><span class="sp"></span><button class="btn sm" data-act="sumCsv">日ごとの集計をCSVで保存</button><button class="btn sm ghost" data-act="sumReload">読み直す</button></div>
  <div class="grid3" style="margin-bottom:16px">
    <div class="card kpi"><div class="l">出数</div><div class="v">${sum.toLocaleString()}体</div><div class="small muted">${yoy == null ? '前年の記録なし' : `前年同月 ${yoy >= 0 ? '+' : ''}${yoy}%`}</div></div>
    <div class="card kpi"><div class="l">初穂料の合計</div><div class="v">${yen(amt(inM))}円</div><div class="small muted">レジ端末の記録</div></div>
    <div class="card kpi"><div class="l">記録のあった日</div><div class="v">${Object.keys(days).length}日</div><div class="small muted">${dim}日中</div></div>
  </div>
  <div class="grid2" style="align-items:start">
    <div class="card card-p"><div class="card-h"><h3>よく出ている順</h3></div>
      ${rank.length ? `<ul class="rank">${rank.map((t, i) => `<li style="cursor:pointer;${pick === t.id ? 'background:var(--brand-soft);border-radius:8px' : ''}" data-act="sumItem" data-id="${t.id}"><span class="n">${i + 1}</span><span><b>${esc(t.name)}</b><span class="abc ${t.abc}">${t.abc}</span></span><span class="bar"><i style="width:${t.q / max * 100}%"></i></span><span class="r num">${t.q.toLocaleString()}</span><span class="r num small">${yen(t.a)}円</span></li>`).join('')}</ul>
      <div class="small muted" style="margin-top:8px">A＝上位で全体の7割／B＝9割まで／C＝残り。品名を押すと右のグラフがその品だけになります</div>` : '<div class="empty">この月の記録はありません</div>'}</div>
    <div class="card card-p"><div class="card-h"><h3>${pick ? esc(pickName) : 'すべての授与品'}の月別</h3><span class="sp"></span>${pick ? '<button class="btn sm" data-act="sumItem" data-id="all">すべてに戻す</button>' : ''}</div>
      ${barChart(months.map(k => Number(k.split('-')[1]) + '月'), months.map(mq), prevMonths.map(mq), '直近12か月', '前年')}</div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h card-p" style="margin:0;padding-bottom:6px"><h3>日ごとの集計</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>日付</th><th class="r">出数</th><th class="r">初穂料</th></tr></thead><tbody>
    ${Object.keys(days).sort().map(d => `<tr><td>${mdw(parse(d))}</td><td class="r num">${days[d].q.toLocaleString()}体</td><td class="r num">${yen(days[d].a)}円</td></tr>`).join('') || '<tr><td colspan="3" class="muted">記録はありません</td></tr>'}
  </tbody></table></div></div>`;
}
function juyoItemsProd() {
  const can = !isTemp(), all = S.items;
  return `
  <div class="card"><div class="card-h card-p" style="margin:0;padding-bottom:6px"><h3>授与品（${all.filter(i => i.active !== false).length}品）</h3><span class="sp"></span>${can ? '<button class="btn pri sm" data-act="editItem" data-id="">＋ 登録</button>' : ''}</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="r">順</th><th>品名</th><th class="r">初穂料</th><th class="r">段ボール</th><th class="r">1箱</th><th>レジ</th><th></th></tr></thead>
    <tbody>${all.map(it => `<tr style="${it.active === false ? 'opacity:.45' : ''}"><td class="r num small muted">${it.ord ?? ''}</td><td><b>${esc(it.name)}</b><div class="small muted">${esc(it.cat)}</div></td><td class="r num">${yen(it.price)}円</td><td class="r num">${it.perCase || '—'}箱</td><td class="r num">${it.perBox || '—'}体</td><td class="small">${it.active === false ? '出さない' : it.big ? '大きく' : '出す'}</td><td>${can ? `<button class="btn sm" data-act="editItem" data-id="${it.id}">編集</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">まだ登録されていません</td></tr>'}</tbody></table></div></div>
  <div class="small muted" style="margin-top:8px">レジ端末には「出す」品が、順の小さい順に並びます。使わなくなった品は消さずに「レジに出さない」にすると、過去の集計が残ります。</div>`;
}
function editItemModalProd(id) {
  const it = S.items.find(x => x.id === id) || { id: '', name: '', price: 1000, cat: '', perCase: '', perBox: '', big: false, ord: (Math.max(0, ...S.items.map(i => i.ord || 0)) + 10), active: true };
  const cats = [...new Set(S.items.map(i => i.cat).filter(Boolean))];
  modal(`<div class="modal-h"><h3>${it.id ? '授与品の編集' : '授与品の登録'}</h3><span class="sp"></span><button class="icon-btn" data-act="closeModal">${ICON.x}</button></div>
  <div class="modal-b">
    <div class="grid2"><div class="field"><label for="itName">品名</label><input class="input" id="itName" value="${esc(it.name)}" maxlength="30"></div><div class="field"><label for="itCat">分類</label><input class="input" id="itCat" value="${esc(it.cat)}" list="itCatList" placeholder="例：御守"><datalist id="itCatList">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div></div>
    <div class="grid2"><div class="field"><label for="itPrice">初穂料（円）</label><input class="input num" type="number" min="0" inputmode="numeric" id="itPrice" value="${it.price}"></div><div class="field"><label for="itOrd">レジでの並び順（小さいほど前）</label><input class="input num" type="number" inputmode="numeric" id="itOrd" value="${it.ord ?? ''}"></div></div>
    <div class="grid2"><div class="field"><label for="itCase">段ボール1つに何箱</label><input class="input num" type="number" min="1" inputmode="numeric" id="itCase" value="${it.perCase || ''}" placeholder="分からなければ空欄"></div><div class="field"><label for="itBox">1箱に何体</label><input class="input num" type="number" min="1" inputmode="numeric" id="itBox" value="${it.perBox || ''}" placeholder="分からなければ空欄"></div></div>
    <label class="row small" style="gap:6px;margin:4px 0 8px"><input type="checkbox" id="itBig" ${it.big ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--brand)"> レジで大きく表示する（よく出る品）</label>
    <label class="row small" style="gap:6px"><input type="checkbox" id="itActive" ${it.active !== false ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--brand)"> レジに出す（外すとレジに出ません。記録は残ります）</label>
  </div>
  <div class="modal-f"><button class="btn" data-act="closeModal">やめる</button><button class="btn pri" data-act="saveItem" data-id="${it.id}">保存</button></div>`);
}
function sumCsv() {
  const rows = (SUM.rows || []).filter(r => r[0].startsWith(sumMonth));
  const days = {}; rows.forEach(r => { const d = days[r[0]] || (days[r[0]] = { q: 0, a: 0 }); d.q += r[3]; d.a += r[4]; });
  const lines = [['日付', '曜日', '出数', '初穂料'].join(',')].concat(Object.keys(days).sort().map(d => [d, WD[parse(d).getDay()], days[d].q, days[d].a].join(',')));
  const detail = [''].concat([['日付', '品名', '出数', '初穂料'].join(',')], rows.map(r => [r[0], '"' + String(r[2]).replace(/"/g, '""') + '"', r[3], r[4]].join(',')));
  const blob = new Blob(['﻿' + lines.concat(detail).join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `授与所レジ_${sumMonth}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
if (PROD) {
  vJuyo = vJuyoProd;
  Object.assign(ACT, {
    editItem(el) { editItemModalProd(el.dataset.id); },
    saveItem(el) {
      const id = el.dataset.id, n = v => v === '' ? null : Math.max(1, parseInt(v, 10) || 1);
      const d = { name: val('itName').trim(), cat: val('itCat').trim(), price: Math.max(0, parseInt(val('itPrice'), 10) || 0), ord: val('itOrd') === '' ? 999 : parseInt(val('itOrd'), 10) || 0, perCase: n(val('itCase')), perBox: n(val('itBox')), big: document.getElementById('itBig').checked, active: document.getElementById('itActive').checked };
      if (!d.name) return toast('品名を入れてください');
      if (id) Object.assign(S.items.find(i => i.id === id), d); else { const nid = 'it' + Date.now().toString(36); S.items.push({ id: nid, ...d }); S.stock[nid] = 0; }
      S.items.sort((a, b) => (a.ord ?? 999) - (b.ord ?? 999));
      save(); closeModal(); render(); toast('保存しました');
    },
    sumMonth(el) { const [y, m] = sumMonth.split('-').map(Number); sumMonth = ym(new Date(y, m - 1 + +el.dataset.n, 1)); render(); },
    sumItem(el) { sumItem = el.dataset.id; render(); },
    sumReload() { loadSalesSummary(true); },
    sumCsv() { sumCsv(); }
  });
}

boot();
</script>
