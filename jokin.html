<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<title>品川神社 助勤</title>
<style>
:root { --brand: #9c545b; --brand-2: #f6ecec; --text: #2b2424; --text-2: #6b6262; --line: #e6dede; --bg: #faf7f6; --card: #fff; --ok: #2e8b57; --ok-bg: #e8f5ee; --ng: #c0392b; --ng-bg: #fbeaea; --sun: #c0392b; --sat: #2f6fd0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.top .mk { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.top b { display: block; font-size: 17px; }
.top .s { font-size: 13px; color: var(--text-2); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
h2 { font-size: 17px; margin: 0 0 10px; }
.muted { color: var(--text-2); font-size: 14px; }
.small { font-size: 13px; }
.btn { appearance: none; border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 10px; padding: 11px 16px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.people li:last-child { border-bottom: 0; }
.people li:active { background: var(--brand-2); }
.tag { font-size: 12px; border-radius: 999px; padding: 2px 9px; font-weight: 600; white-space: nowrap; }
.tag.green { background: var(--ok-bg); color: var(--ok); }
.tag.gray { background: #f0eeee; color: var(--text-2); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.field .req { color: var(--ng); font-size: 12px; margin-left: 4px; }
.in { width: 100%; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-family: inherit; background: #fff; color: var(--text); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; user-select: none; background: #fff; font-weight: 600; }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs button { flex: 1; }
.tabs .on { background: var(--brand-2); border-color: var(--brand); color: var(--brand); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .h { text-align: center; font-size: 12px; color: var(--text-2); font-weight: 700; }
.d { border: 1px solid var(--line); border-radius: 10px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; background: #fff; user-select: none; }
.d.e { border: 0; background: transparent; cursor: default; }
.d.off { background: #f3f1f1; border-color: #f3f1f1; color: #c9c2c2; cursor: default; }
.d.off b { color: #c9c2c2 !important; font-weight: 400; }
.dl { background: #fff6dc; border: 1px solid #f0d48a; border-radius: 10px; padding: 8px 12px; font-size: 14px; margin-bottom: 10px; }
.dl.over { background: var(--ng-bg); border-color: #f0b4ad; color: var(--ng); }
.d b { font-size: 15px; }
.d .m { font-size: 18px; font-weight: 700; line-height: 1.1; min-height: 20px; }
.d.sun b, .d.hol b, .cal .h.sun { color: var(--sun); }
.d.sat b, .cal .h.sat { color: var(--sat); }
.d.ok { background: var(--ok-bg); border-color: var(--ok); }
.d.ok .m { color: var(--ok); }
.d.ng { background: var(--ng-bg); border-color: var(--ng); }
.d.ng .m { color: var(--ng); }
.d.we { background: #fffaf3; }
.d.we.ok { background: var(--ok-bg); }
.d.we.ng { background: var(--ng-bg); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tiles .d { min-height: 74px; }
.tiles .d .w { font-size: 12px; color: var(--text-2); }
.note { background: var(--brand-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.err { background: var(--ng-bg); color: var(--ng); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.demo { background: #fff6dc; border: 1px solid #f0d48a; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
.done { text-align: center; padding: 26px 10px; }
.done .big { font-size: 40px; color: var(--ok); }
.mine { list-style: none; margin: 0; padding: 0; }
.mine li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.mine li:last-child { border-bottom: 0; }
.foot { text-align: center; font-size: 12px; color: var(--text-2); margin-top: 18px; }
</style>
<div class="wrap" id="app"></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbx-QNVOKsc6rMszEqwt9BjpfjqU0sIm2wOtfTBnyazvxA4PJHhNqOkaMszVWZi-JUWLgw/exec';
const HOLIDAYS = {
  '2025-01-01': '元日', '2025-01-13': '成人の日', '2025-02-11': '建国記念の日', '2025-02-23': '天皇誕生日', '2025-02-24': '振替休日', '2025-03-20': '春分の日', '2025-04-29': '昭和の日', '2025-05-03': '憲法記念日', '2025-05-04': 'みどりの日', '2025-05-05': 'こどもの日', '2025-05-06': '振替休日', '2025-07-21': '海の日', '2025-08-11': '山の日', '2025-09-15': '敬老の日', '2025-09-23': '秋分の日', '2025-10-13': 'スポーツの日', '2025-11-03': '文化の日', '2025-11-23': '勤労感謝の日', '2025-11-24': '振替休日',
  '2026-01-01': '元日', '2026-01-12': '成人の日', '2026-02-11': '建国記念の日', '2026-02-23': '天皇誕生日', '2026-03-20': '春分の日', '2026-04-29': '昭和の日', '2026-05-03': '憲法記念日', '2026-05-04': 'みどりの日', '2026-05-05': 'こどもの日', '2026-05-06': '振替休日', '2026-07-20': '海の日', '2026-08-11': '山の日', '2026-09-21': '敬老の日', '2026-09-22': '国民の休日', '2026-09-23': '秋分の日', '2026-10-12': 'スポーツの日', '2026-11-03': '文化の日', '2026-11-23': '勤労感謝の日',
  '2027-01-01': '元日', '2027-01-11': '成人の日', '2027-02-11': '建国記念の日', '2027-02-23': '天皇誕生日', '2027-03-21': '春分の日', '2027-03-22': '振替休日', '2027-04-29': '昭和の日', '2027-05-03': '憲法記念日', '2027-05-04': 'みどりの日', '2027-05-05': 'こどもの日', '2027-07-19': '海の日', '2027-08-11': '山の日', '2027-09-20': '敬老の日', '2027-09-23': '秋分の日', '2027-10-11': 'スポーツの日', '2027-11-03': '文化の日', '2027-11-23': '勤労感謝の日'
};
const TEAMS = {
  goshuin: { team: 'shuin', label: '御朱印', post: '御朱印' },
  reitaisai: { team: 'reitaisai', label: '例大祭', post: '本殿' },
  shichigosan: { team: 'shichigosan', label: '七五三', post: '本殿' }
};
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const DEADLINE_DAY = 25;   // 御朱印の希望の締め切り：前の月の25日（2026-11-15 本人）
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isWe = d => d.getDay() === 0 || d.getDay() === 6 || !!HOLIDAYS[key(d)];
const md = k => { const d = parse(k); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const at2s = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`; };
const wareki = (y, m) => `${y >= 2019 ? '令和' + (y - 2018 === 1 ? '元' : y - 2018) + '年' : y + '年'}${m}月`;

/* ── 受け口（デモのときはこの端末の中だけで動かす） ── */
const DEMO = !API_URL, DK = 'jokin-demo-v1';
function demoDb() {
  try { const j = JSON.parse(localStorage.getItem(DK) || 'null'); if (j) return j; } catch (e) { }
  return { people: [{ id: 'jd1', name: '林 胡桃', team: 'shuin' }, { id: 'jd2', name: '山田 花子', team: 'shuin' }, { id: 'jd3', name: '佐藤 桜', team: 'reitaisai' }, { id: 'jd4', name: '鈴木 結衣', team: 'shichigosan' }], req: {}, sreq: {}, shifts: {} };
}
function demoSave(db) { try { localStorage.setItem(DK, JSON.stringify(db)); } catch (e) { } }
function nextMonths() { const t = new Date(); return [1, 2].map(n => { const d = new Date(t.getFullYear(), t.getMonth() + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }); }
function reitaisaiDays(y) { let best = null; for (let i = -3; i <= 3; i++) { const d = new Date(y, 5, 7 + i); if (d.getDay() === 0) best = d; } return [-2, -1, 0].map(n => key(new Date(best.getFullYear(), best.getMonth(), best.getDate() + n))); }
function demoDays(team) {
  const t = new Date(), tk = key(t), y = t.getFullYear();
  if (team === 'reitaisai') { let ds = reitaisaiDays(y); if (ds[2] < tk) ds = reitaisaiDays(y + 1); return ds; }
  const yy = t.getMonth() >= 11 ? y + 1 : y; return ['10-11', '10-12', '10-13', '10-18', '10-19', '10-25', '11-01', '11-02', '11-03', '11-08', '11-09', '11-15', '11-16'].map(s => `${yy}-${s}`);   // 見本の日程
}
async function api(action, body) {
  if (!DEMO) {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, body)) });
    const j = await res.json(); if (!j.ok) throw new Error(j.message || 'うまく送れませんでした'); return j;
  }
  await new Promise(r => setTimeout(r, 250));
  const db = demoDb(), team = body.team;
  const days = team === 'shuin' ? [] : demoDays(team);
  if (action === 'jkForm') return { ok: true, team, days, months: team === 'shuin' ? nextMonths() : [], people: db.people.filter(p => p.team === team).map(p => ({ id: p.id, name: p.name, sent: team === 'shuin' ? Object.fromEntries(Object.entries(db.req[p.id] || {}).map(([m, v]) => [m, v.at])) : (db.sreq[p.id] || {}).at || null })) };
  if (action === 'jkMine') { const o = { ok: true, shifts: db.shifts[body.id] || [] }; if (team === 'shuin') o.req = db.req[body.id] || {}; else { o.days = (db.sreq[body.id] || {}).days || {}; o.at = (db.sreq[body.id] || {}).at || null; } return o; }
  if (action === 'jkSubmit') {
    let p = body.id ? db.people.find(x => x.id === body.id) : db.people.find(x => x.team === team && x.name.replace(/\s/g, '') === String(body.name || '').replace(/\s/g, ''));
    if (!p) { if (!body.name) throw new Error('名前を入れてください'); p = { id: 'jd' + Date.now(), name: body.name, team }; db.people.push(p); }
    const at = Date.now();
    if (body.days) { if (team === 'shuin') (db.req[p.id] = db.req[p.id] || {})[body.ym] = { days: body.days, at }; else db.sreq[p.id] = { days: body.days, at }; }
    demoSave(db); return { ok: true, id: p.id, name: p.name, days: body.days || {}, at };
  }
}

/* ── 画面 ── */
const V = { hash: '', reg: false, form: null, err: '', busy: false, step: 'list', who: null, mine: null, cur: {}, ym: '', reg2: { name: '', kana: '', tel: '', wdays: [0, 6], memo: '' }, sentAt: null, justReg: false };
const T = () => TEAMS[V.hash];
function readHash() {
  const h = (location.hash || '').replace(/^#\/?/, ''), reg = /-touroku$/.test(h), base = h.replace(/-touroku$/, '');
  V.hash = TEAMS[base] ? base : ''; V.reg = reg;
}
async function load() {
  V.err = ''; V.form = null; render();
  try { V.form = await api('jkForm', { team: T().team }); V.ym = (V.form.months || [])[0] || ''; }
  catch (e) { V.err = '読み込めませんでした。電波のよいところで開き直してください。（' + e.message + '）'; }
  V.step = V.reg ? 'reg' : 'list'; render();
}
function header() {
  const t = T();
  return `<div class="top"><div class="mk">品</div><div><b>品川神社 ${t ? t.label + 'の助勤' : '助勤'}</b><div class="s">${V.reg ? '登録' : 'シフトの希望の入力'}</div></div></div>${DEMO ? '<div class="demo">見本の画面です。入れた内容はこの端末の中だけに残り、神社には届きません。</div>' : ''}`;
}
function vList() {
  const f = V.form, t = T(), ppl = f.people;
  const sentTag = p => { const s = t.team === 'shuin' ? (p.sent || {})[V.ym] : p.sent; return s ? `<span class="tag green">送信済み</span>` : '<span class="tag gray">まだ</span>'; };
  return `<div class="card"><h2>お名前を選んでください</h2>
    ${ppl.length ? `<ul class="people">${ppl.map(p => `<li data-act="pick" data-id="${esc(p.id)}"><b>${esc(p.name)}</b><span class="sp"></span>${sentTag(p)}</li>`).join('')}</ul>` : '<div class="muted">まだだれも登録されていません。</div>'}
  </div>
  <div class="card"><h2>はじめての方</h2><div class="muted" style="margin-bottom:10px">一覧にお名前がないときは、先に登録してください。</div><button class="btn wide" data-act="toReg">登録する</button></div>`;
}
function vReg() {
  const r = V.reg2, t = T();
  return `<div class="card"><h2>${t.label}の助勤の登録</h2>
    <div class="muted" style="margin-bottom:12px">はじめての方だけ登録してください。電話番号は神社の職員だけが見ます。</div>
    <div class="field"><label>お名前<span class="req">必須</span></label><input class="in" id="rName" value="${esc(r.name)}" placeholder="例：品川 花子" autocomplete="name"></div>
    <div class="field"><label>ふりがな</label><input class="in" id="rKana" value="${esc(r.kana)}" placeholder="例：しながわ はなこ"></div>
    <div class="field"><label>電話番号<span class="req">必須</span></label><input class="in" id="rTel" value="${esc(r.tel)}" inputmode="tel" placeholder="例：090-0000-0000" autocomplete="tel"></div>
    ${t.team === 'shuin' ? `<div class="field"><label>ふだん出られる曜日</label><div class="chips" id="rWd">${WD.map((w, i) => `<span class="chip ${r.wdays.includes(i) ? 'on' : ''}" data-act="wd" data-i="${i}">${w}</span>`).join('')}</div></div>` : ''}
    <div class="field"><label>神社への連絡（任意）</label><input class="in" id="rMemo" value="${esc(r.memo)}" placeholder="例：午前だけ出られます"></div>
    ${V.err ? `<div class="err">${esc(V.err)}</div>` : ''}
    <button class="btn pri wide" data-act="doReg" ${V.busy ? 'disabled' : ''}>${V.busy ? '送っています…' : '登録する'}</button>
  </div>${V.reg ? '' : '<button class="btn wide" data-act="back">もどる</button>'}`;
}
function calShuin() {
  const [y, m] = V.ym.split('-').map(Number), first = new Date(y, m - 1, 1), n = new Date(y, m, 0).getDate();
  let h = WD.map((w, i) => `<div class="h ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('') + Array.from({ length: first.getDay() }, () => '<div class="d e"></div>').join('');
  for (let i = 1; i <= n; i++) {
    const d = new Date(y, m - 1, i), k = key(d), v = V.cur[k];
    if (!isWe(d)) { h += `<div class="d off"><b>${i}</b><span class="m"></span></div>`; continue; }   // 平日は入れない（御朱印は土日祝だけ）
    h += `<div class="d ${v || ''} we ${d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : ''} ${HOLIDAYS[k] ? 'hol' : ''}" data-act="tap" data-k="${k}"><b>${i}</b><span class="m">${v === 'ok' ? '○' : v === 'ng' ? '×' : ''}</span></div>`;
  }
  return `<div class="cal">${h}</div>`;
}
function tilesSeason() {
  return `<div class="tiles">${V.form.days.map(k => { const d = parse(k), v = V.cur[k]; return `<div class="d ${v || ''} ${d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : ''} ${HOLIDAYS[k] ? 'hol' : ''}" data-act="tap" data-k="${k}"><b>${d.getMonth() + 1}/${d.getDate()}</b><span class="w">${WD[d.getDay()]}${HOLIDAYS[k] ? '・祝' : ''}</span><span class="m">${v === 'ok' ? '○' : v === 'ng' ? '×' : ''}</span></div>`; }).join('')}</div>`;
}
function deadlineOf(ymk) { const [y, m] = ymk.split('-').map(Number); return new Date(y, m - 2, DEADLINE_DAY); }   // その月の分は前の月の25日まで
function deadlineNote() {
  const dl = deadlineOf(V.ym), t = new Date(), today = new Date(t.getFullYear(), t.getMonth(), t.getDate()), over = today > dl, [, m] = V.ym.split('-').map(Number);
  return `<div class="dl ${over ? 'over' : ''}">${m}月分の締め切り：<b>${dl.getMonth() + 1}月${dl.getDate()}日（${WD[dl.getDay()]}）</b>${over ? '<br>締め切りを過ぎています。変えたいときは神社に連絡してください。' : ''}</div>`;
}
function sentAtNow() { const t = T(); return t.team === 'shuin' ? ((V.mine && V.mine.req && V.mine.req[V.ym]) || {}).at : V.mine && V.mine.at; }
function vInput() {
  const t = T(), f = V.form, sent = sentAtNow();
  const mineShifts = (V.mine && V.mine.shifts) || [];
  const head = t.team === 'shuin'
    ? `<div class="tabs">${f.months.map(m => { const [y, mm] = m.split('-').map(Number); return `<button class="btn ${m === V.ym ? 'on' : ''}" data-act="month" data-m="${m}">${wareki(y, mm)}</button>`; }).join('')}</div>`
    : '';
  const body = t.team === 'shuin' ? calShuin() : (f.days.length ? tilesSeason() : '<div class="muted">まだ日程が決まっていません。決まったら神社から連絡します。</div>');
  return `<div class="card"><div class="row"><b style="font-size:17px">${esc(V.who.name)}</b><span class="muted">さん</span><span class="sp"></span><button class="btn" style="padding:6px 12px;font-size:14px" data-act="back">名前を選び直す</button></div></div>
  ${mineShifts.length ? `<div class="card"><h2>決まったシフト</h2><ul class="mine">${mineShifts.map(k => `<li>${md(k)}　${t.post}</li>`).join('')}</ul></div>` : ''}
  <div class="card"><h2>${t.label}の希望${t.team === 'shuin' ? '' : `（${f.days.length}日）`}</h2>
    ${head}
    ${t.team === 'shuin' ? deadlineNote() : ''}
    <div class="muted" style="margin-bottom:10px">${t.team === 'shuin' ? '土日・祝日だけ入れられます。' : ''}日付を押すと ○（出られる）→ ×（出られない）→ 空欄 と変わります。${sent ? `<br>送信済み（${at2s(sent)}）。直して送り直せます。` : ''}</div>
    ${body}
    ${V.err ? `<div class="err" style="margin-top:12px">${esc(V.err)}</div>` : ''}
    <div class="row" style="margin-top:14px"><button class="btn" data-act="all">${t.team === 'shuin' ? '土日祝をすべて○' : 'すべて○'}</button><span class="sp"></span><button class="btn pri" data-act="send" ${V.busy || (t.team !== 'shuin' && !f.days.length) ? 'disabled' : ''}>${V.busy ? '送っています…' : sent ? '送り直す' : '送信する'}</button></div>
  </div>`;
}
function vDone() {
  const t = T();
  return `<div class="card done"><div class="big">✓</div><h2>${V.justReg && !V.sentAt ? '登録しました' : '送信しました'}</h2><div class="muted">${esc(V.who.name)}さん、ありがとうございます。${V.justReg && !V.sentAt ? 'このまま希望のシフトも入れられます。' : 'シフトが決まったら神社から連絡します。内容はあとから直せます。'}</div></div>
  ${V.justReg && !V.sentAt ? `<button class="btn pri wide" data-act="goInput" style="margin-bottom:10px">続けて希望を入れる</button>` : `<button class="btn wide" data-act="goInput" style="margin-bottom:10px">入れた内容を見る・直す</button>`}
  <button class="btn wide" data-act="back">最初の画面へ</button>`;
}
function render() {
  const el = document.getElementById('app');
  if (!V.hash) { el.innerHTML = header() + '<div class="card">このURLは使えません。神社から届いたURLをそのまま開いてください。</div>'; return; }
  let body;
  if (!V.form) body = V.err ? `<div class="err">${esc(V.err)}</div><button class="btn wide" data-act="reload">もう一度読み込む</button>` : '<div class="card muted">読み込んでいます…</div>';
  else body = V.step === 'reg' ? vReg() : V.step === 'input' ? vInput() : V.step === 'done' ? vDone() : vList();
  el.innerHTML = header() + body + '<div class="foot">品川神社</div>';
}
async function pick(id, name) {
  V.who = { id, name }; V.err = ''; V.mine = null; V.cur = {}; V.step = 'input'; V.busy = true; render();
  try { V.mine = await api('jkMine', { team: T().team, id }); setCur(); }
  catch (e) { V.err = e.message; }
  V.busy = false; render(); window.scrollTo(0, 0);
}
function setCur() { const t = T(); V.cur = Object.assign({}, t.team === 'shuin' ? ((V.mine.req || {})[V.ym] || {}).days || {} : V.mine.days || {}); }
const half = v => String(v).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[－ー―‐−]/g, '-').replace(/[（]/g, '(').replace(/[）]/g, ')');   // 全角の数字・ハイフンを半角に
function readReg() { const g = id => (document.getElementById(id) || {}).value || ''; Object.assign(V.reg2, { name: g('rName').trim(), kana: g('rKana').trim(), tel: half(g('rTel')).trim(), memo: g('rMemo').trim() }); }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || V.busy) return;
  const a = el.dataset.act, t = T();
  if (a === 'reload') return load();
  if (a === 'pick') { const p = V.form.people.find(x => x.id === el.dataset.id); return pick(p.id, p.name); }
  if (a === 'toReg') { V.step = 'reg'; V.err = ''; render(); return window.scrollTo(0, 0); }
  if (a === 'back') { V.step = 'list'; V.who = null; V.err = ''; V.sentAt = null; V.justReg = false; if (V.reg) { V.reg = false; history.replaceState(null, '', '#' + V.hash); } await load(); return window.scrollTo(0, 0); }
  if (a === 'wd') { readReg(); const i = +el.dataset.i, w = V.reg2.wdays; V.reg2.wdays = w.includes(i) ? w.filter(x => x !== i) : [...w, i].sort(); return render(); }
  if (a === 'doReg') {
    readReg(); const r = V.reg2;
    if (!r.name) { V.err = 'お名前を入れてください'; return render(); }
    if (!/\d{2,}/.test(r.tel.replace(/[^\d]/g, '')) || r.tel.replace(/[^\d]/g, '').length < 10) { V.err = '電話番号を入れてください（数字10けた以上）'; return render(); }
    V.err = ''; V.busy = true; render();
    try { const j = await api('jkSubmit', { team: t.team, name: r.name, kana: r.kana, tel: r.tel, wdays: r.wdays, memo: r.memo }); V.who = { id: j.id, name: j.name }; V.justReg = true; V.sentAt = null; V.step = 'done'; V.reg2 = { name: '', kana: '', tel: '', wdays: [0, 6], memo: '' }; }
    catch (er) { V.err = er.message; }
    V.busy = false; render(); return window.scrollTo(0, 0);
  }
  if (a === 'goInput') { V.reg = false; history.replaceState(null, '', '#' + V.hash); try { V.form = await api('jkForm', { team: t.team }); } catch (er) { } if (!V.ym) V.ym = (V.form.months || [])[0] || ''; return pick(V.who.id, V.who.name); }
  if (a === 'month') { V.ym = el.dataset.m; setCur(); return render(); }
  if (a === 'tap') { const k = el.dataset.k, O = [undefined, 'ok', 'ng'], nx = O[(O.indexOf(V.cur[k]) + 1) % 3]; if (nx) V.cur[k] = nx; else delete V.cur[k]; return render(); }
  if (a === 'all') {
    if (t.team === 'shuin') { const [y, m] = V.ym.split('-').map(Number), n = new Date(y, m, 0).getDate(); for (let i = 1; i <= n; i++) { const d = new Date(y, m - 1, i); if (isWe(d)) V.cur[key(d)] = 'ok'; } }
    else V.form.days.forEach(k => V.cur[k] = 'ok');
    return render();
  }
  if (a === 'send') {
    if (t.team === 'shuin') Object.keys(V.cur).forEach(k => { if (!isWe(parse(k))) delete V.cur[k]; });   // 平日の分は送らない
    if (!Object.keys(V.cur).length) { V.err = '○か×を1日以上入れてください'; return render(); }
    V.err = ''; V.busy = true; render();
    try {
      const j = await api('jkSubmit', Object.assign({ team: t.team, id: V.who.id, days: V.cur }, t.team === 'shuin' ? { ym: V.ym } : {}));
      V.sentAt = j.at; V.justReg = false;
      if (t.team === 'shuin') { V.mine.req = V.mine.req || {}; V.mine.req[V.ym] = { days: j.days, at: j.at }; } else { V.mine.days = j.days; V.mine.at = j.at; }
      V.step = 'done';
    } catch (er) { V.err = er.message; }
    V.busy = false; render(); return window.scrollTo(0, 0);
  }
});
window.addEventListener('hashchange', () => { readHash(); V.step = 'list'; V.who = null; load(); });
readHash(); if (V.hash) load(); else render();
</script>
